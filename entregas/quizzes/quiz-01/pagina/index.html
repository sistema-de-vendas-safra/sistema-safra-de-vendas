/* ··· Linha de leitura: tudo que é novo nasce na mesma altura ···
   A âncora (altura zero) marca onde começa o conteúdo novo. A rolagem acontece uma vez só, antes de ele aparecer, e leva a âncora até a linha:
   a resposta que a pessoa acabou de dar fica logo acima dela, o histórico sai pelo alto. O espaço vazio no fim da conversa (100vh) faz isso
   valer mesmo com pouco conteúdo. No computador a linha fica 140px abaixo da barra de progresso; no celular, logo abaixo das abas. */
const linhaLeitura = () => {
  const ab = palco.querySelector('.abas');
  return ab && getComputedStyle(ab).display !== 'none' ? ab.getBoundingClientRect().bottom + 80 : $('#topo').getBoundingClientRect().bottom + 140;
};
function alinhar(suave){
  const a = palco.querySelector('[data-ancora]');
  if (!a || !a.offsetParent) return 0;
  let alvo = a.getBoundingClientRect().top + window.scrollY - linhaLeitura();
  if (alvo < -1) { // primeira pergunta: ainda não há histórico para subir, então o respiro vem de cima
    const conv = a.parentElement;
    conv.style.paddingTop = (parseFloat(getComputedStyle(conv).paddingTop) - alvo) + 'px';
    alvo = 0;
  }
  const dist = Math.abs(alvo - window.scrollY);
  window.scrollTo({top:Math.max(0, alvo), behavior:suave && !calmo ? 'smooth' : 'auto'});
  return dist;
}

/* ··· Conversa: "digitando…" e entrada das falas (T4, T5) ··· */
function conversar(focar){
  const novas = [].slice.call(palco.querySelectorAll('[data-nova]'));
  const corpoEl = palco.querySelector('[data-corpo]');
  const fim = () => {
    corpoEl.hidden = false;
    marcarUltimo();
    const fo = document.getElementById('foco');
    if (focar && fo) fo.focus({preventScroll:true});
    mostrarSelo();
  };
  // pelo seletor de telas ou com menos movimento: tudo aparece de uma vez e a rolagem é instantânea
  if (!porFluxo || calmo || !novas.length) { fim(); alinhar(false); return; }
  novas.forEach(n => { n.hidden = true; });
  corpoEl.hidden = true;
  const dist = alinhar(true);
  let k = 0;
  const passo = () => {
    if (k >= novas.length) return fim();
    const n = novas[k++];
    const entra = () => { n.hidden = false; n.classList.add('is-in'); marcarUltimo(); if (n.querySelector('[data-onboarding]')) destacar(); };
    // como no original: só as falas de comentário mostram "digitando…"; a pergunta atual entra direto. O "digitando…" nasce no lugar do comentário e é trocado por ele no mesmo lugar
    if (!n.classList.contains('balao--bot') || n.classList.contains('balao--atual')) { entra(); timers.push(setTimeout(passo, 350)); return; }
    const dig = document.createElement('div');
    dig.className = 'balao balao--bot digitando';
    dig.innerHTML = '<span class="avatar" aria-hidden="true"><img src="' + FOTO + '" alt=""></span><div class="balao__texto" role="img" aria-label="Junior está digitando"><i></i><i></i><i></i></div>';
    n.before(dig); marcarUltimo();
    timers.push(setTimeout(() => { dig.remove(); entra(); timers.push(setTimeout(passo, k < novas.length ? 500 : 200)); }, k === 1 ? 900 : 700));
  };
  timers.push(setTimeout(passo, dist < 2 ? 80 : 520));
}
function montar(){
  palco.querySelectorAll('.passos li').forEach((li, i) => timers.push(setTimeout(() => li.classList.add('feito'), 700 + i * 800)));
  timers.push(setTimeout(() => {
    const s = $('#abaSelo');
    if (s) { s.className = 'abas__selo is-pronto'; s.textContent = '✓'; s.setAttribute('aria-label', 'diagnóstico pronto'); }
  }, 2900));
  timers.push(setTimeout(() => {
    if (porFluxo) return mostrar(proximaDe('montando'), {fluxo:true});
    const b = palco.querySelector('[data-acao="ver-relatorio"]'); if (b) b.hidden = false;
  }, 3700));
}
const GIRO = ['Lendo suas respostas…', 'Calculando as 4 etapas do funil…', 'Comparando com as metas…', 'Somando o dinheiro na mesa…', 'Escrevendo a leitura de cada etapa…'];
function girar(){
  const el = $('#giro');
  if (el) GIRO.forEach((txt, i) => timers.push(setTimeout(() => { el.textContent = txt; }, i * 650)));
}

/* ··· Barra de progresso (T1): rápida no começo, devagar no fim, teto de 65% nas perguntas ··· */
function progresso(t){
  if (t.rel || t.id === 'erro') return 100;
  if (!t.chat) return null;
  if (t.id === 'video-time') return 100;
  if (t.id === 'plano') return 95;
  if (t.id === 'montando') return 90;
  if (t.id === 'contato') return 80;
  const qs = caminho(t.id).filter(id => ['contato', 'montando', 'plano', 'video-time'].indexOf(id) < 0), feitas = qs.indexOf(t.id);
  const peso = i => i < 6 ? 2 : i < 10 ? 1.5 : 1;
  let feito = 0, total = 0;
  qs.forEach((id, i) => { total += peso(i); if (i < feitas) feito += peso(i); });
  return Math.round(feito / total * 65);
}
function topo(t){
  const p = progresso(t), barra = $('#progresso');
  barra.hidden = p === null;
  if (p !== null) { $('#fill').style.width = p + '%'; barra.setAttribute('aria-valuenow', p); }
  $('#passo').textContent = t.rel ? fato('analise_nome_publico') : '';
}

/* ··· Seletor de telas (só para revisão) ··· */
const protoBotao = $('#protoBotao'), protoPainel = $('#protoPainel');
$('#protoLista').innerHTML = TELAS.map((t, i) => '<li><button type="button" data-ir="' + t.id + '"><span>' + String(i + 1).padStart(2, '0') + '</span>' + t.rot + '</button></li>').join('');
function protoMarcar(t){
  const i = TELAS.indexOf(t);
  $('#protoNum').textContent = (i + 1) + '/' + TELAS.length;
  protoPainel.querySelectorAll('[data-ir]').forEach(b => b.setAttribute('aria-current', b.dataset.ir === t.id));
}
function protoAbrir(sim){ protoPainel.hidden = !sim; protoBotao.setAttribute('aria-expanded', sim); }
protoBotao.addEventListener('click', () => protoAbrir(protoPainel.hidden));
protoPainel.addEventListener('click', e => { const b = e.target.closest('[data-ir]'); if (b) { protoAbrir(false); mostrar(b.dataset.ir); } });
document.addEventListener('click', e => { if (!protoPainel.hidden && !e.target.closest('#proto')) protoAbrir(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !protoPainel.hidden) { protoAbrir(false); protoBotao.focus(); } });

/* ··· Cliques nas telas ··· */
let tAuto = null;
palco.addEventListener('click', e => {
  const op = e.target.closest('.opcao');
  if (op) {
    const campo = op.dataset.campo, v = op.dataset.valor;
    if ('varios' in op.dataset) {
      const arr = (R[campo] || []).slice(), k = arr.indexOf(v);
      if (k < 0) arr.push(v); else arr.splice(k, 1);
      R[campo] = arr; op.setAttribute('aria-checked', k < 0);
    } else {
      R[campo] = v;
      op.parentElement.querySelectorAll('.opcao').forEach(x => x.setAttribute('aria-checked', x === op));
      if (campo === 'chute') { R.chuteN = ''; const ch = $('#chuteN'); if (ch) ch.value = ''; }
      if (campo === 'plano') R.planoVolta = null;
      if ('auto' in op.dataset) { clearTimeout(tAuto); tAuto = setTimeout(avancar, 380); }
    }
    return;
  }
  const un = e.target.closest('[data-unidade]');
  if (un) {
    const i = +un.dataset.linha; R.nums[i].u = un.dataset.unidade;
    un.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === un));
    atualizarLivro(); return;
  }
  const fi = e.target.closest('[data-ficha]');
  if (fi) {
    const g = fi.dataset.ficha; R[g] = fi.dataset.valor;
    fi.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === fi));
    $('#confirmar').disabled = !(R.dia && R.hora); return;
  }
  const ab = e.target.closest('.abas [data-aba]'); // o body também carrega data-aba
  if (ab) {
    aba = ab.dataset.aba; document.body.dataset.aba = aba;
    palco.querySelectorAll('[data-aba]').forEach(x => x.setAttribute('aria-selected', x === ab));
    if (aba === 'resultado') { sinal = false; empurrao = false; ab.classList.remove('is-empurrao'); const s = ab.querySelector('.abas__selo'); if (s) s.classList.remove('is-novo'); }
    if (aba === 'conversa') alinhar(false); else window.scrollTo(0, 0);
    return;
  }
  const ed = e.target.closest('[data-editar]');
  if (ed) { clearTimeout(tAuto); mostrar(ed.dataset.editar); return; }
  const b = e.target.closest('[data-acao]');
  if (!b) return;
  const nota = $('#ctaNota');
  switch (b.dataset.acao) {
    case 'proximo': clearTimeout(tAuto); avancar(); break;
    case 'enviar': {
      if (b.disabled) break;
      // Consentimento obrigatório: sem pelo menos uma caixa marcada, nada é enviado e o aviso aparece
      if (!temConsentimento()) { const av = $('#consAviso'); if (av) av.hidden = false; break; }
      R.consentimento.em = new Date().toISOString();
      const pacote = montarPacote();
      enviarPacote(pacote);
      console.info('[quiz-01] criterios do fim (conflito-16) ' + JSON.stringify({criterio_em_uso:CRITERIO_DO_FIM, junior:qualificado() ? 'qualificado' : 'nao qualificado', lead_score:pacote.evento.lead_score_faixa}));
      avancar(); break;
    }
    case 'ver-relatorio': mostrar(proximaDe('montando')); break;
    case 'tentar': mostrar('montando', {fluxo:true}); break;
    case 'aviso': { const alvo = document.getElementById(b.dataset.alvo); if (alvo) { alvo.textContent = b.dataset.aviso; alvo.hidden = false; } break; }
    case 'encher':
      // Dados de teste marcados (#102): no site do protótipo o envio grava de verdade no banco de teste
      R.contato = {nome:'TESTE Marina Souza', email:'marina@teste.invalid', pais:'BR', tel:'00900000000', empresa:'TESTE Empresa Exemplo'};
      mostrar('contato'); break;
    case 'corrigir-email':
      R.contato.email = R.contato.email.split('@')[0] + '@' + b.dataset.dominio; $('#email').value = R.contato.email; validarContato(); break;
    case 'marcar':
      // Escolha de dia e horário oculta: quem agenda é o SDR (M26; #67; ficha-de-fatos#quem-agenda; pergunta 13.5)
      nota.textContent = 'Anotado. Alguém da nossa equipe chama você no WhatsApp para marcar o horário.'; nota.hidden = false; break;
    case 'agendar': {
      const ag = $('#agenda'); ag.hidden = !ag.hidden; b.setAttribute('aria-expanded', !ag.hidden); nota.hidden = true; break;
    }
    case 'confirmar':
      nota.textContent = 'Horário reservado: ' + R.dia + ', às ' + R.hora + '. A confirmação chega no seu WhatsApp.'; nota.hidden = false; break;
    case 'whats':
      $('#agenda').hidden = true;
      nota.textContent = 'Abre o nosso WhatsApp com a mensagem pronta: “Oi, fiz o diagnóstico de vendas e quero conversar.” (protótipo: sem link)'; nota.hidden = false; break;
    case 'plano-quero': case 'plano-voltar':
      // os dois botões da página de exemplo voltam para a conversa, no vídeo do time
      R.plano = 'Quero ver como é'; R.planoVolta = b.dataset.acao === 'plano-quero' ? 'quero' : 'voltar';
      mostrar('video-time', {fluxo:true}); break;
    case 'whats-plano': {
      if (WHATS.numero) { window.open('https://wa.me/' + WHATS.numero + '?text=' + encodeURIComponent(WHATS.plano), '_blank', 'noopener'); break; }
      const a = $('#avisoWhatsPlano');
      a.textContent = 'Protótipo: na versão final, abre o nosso WhatsApp com a mensagem “' + WHATS.plano + '” já escrita. Número: ' + A_DEFINIR.whatsapp + '.'; a.hidden = false; break;
    }
    case 'interesse':
      R.interesse = true; b.disabled = true; nota.textContent = notaInteresse(); nota.hidden = false; break;
    case 'agora-nao': {
      const ag = $('#agenda'); if (ag) ag.hidden = true;
      nota.textContent = 'Tudo bem. O diagnóstico fica no seu e-mail e no WhatsApp para quando quiser.'; nota.hidden = false; break;
    }
  }
});

/* ··· Digitação ··· */
palco.addEventListener('input', e => {
  const el = e.target, c = R.contato;
  if (el.id === 'nomeIn') {
    R.nome = el.value; const s = $('#seguir'); if (s) s.disabled = R.nome.trim().length < 2;
  } else if (el.id === 'ticket') {
    const d = el.value.replace(/\D/g, '').slice(0, 9);
    el.value = R.ticket = d ? Number(d).toLocaleString('pt-BR') : '';
    const s = $('#seguirTicket'); if (s) s.disabled = !lerNum(R.ticket || '');
  } else if (el.dataset.linha !== undefined && el.tagName === 'INPUT') {
    el.value = el.value.replace(/[^\d.,]/g, '');
    R.nums[+el.dataset.linha].v = el.value; atualizarLivro();
  } else if (el.id === 'chuteN') {
    el.value = el.value.replace(/[^\d,]/g, '').slice(0, 5); R.chuteN = el.value;
    if (el.value) { R.chute = null; palco.querySelectorAll('[data-campo="chute"]').forEach(x => x.setAttribute('aria-checked', 'false')); }
  } else if (el.id === 'tel') {
    const p = pais(c.pais), max = (modeloTel(p, '00000000000').match(/#/g) || []).length;
    c.tel = el.value.replace(/\D/g, '').slice(0, max); el.value = formatarTel(p, c.tel); validarContato();
  } else if (el.id === 'nome' || el.id === 'email' || el.id === 'empresa') {
    c[el.id] = el.value.trim() ? el.value : ''; validarContato();
  }
});
palco.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.id !== 'nomeIn') return;
  e.preventDefault();
  const s = $('#seguir'); if (s && !s.disabled) avancar();
});
palco.addEventListener('change', e => {
  if (e.target.id === 'consWhats' || e.target.id === 'consEmail') {
    R.consentimento[e.target.id === 'consWhats' ? 'whatsapp' : 'email'] = e.target.checked; validarContato(); return;
  }
  if (e.target.id !== 'pais') return;
  const c = R.contato; c.pais = e.target.value; c.tel = '';
  const p = pais(c.pais), tel = $('#tel');
  $('#ddiVer').textContent = p.f + ' ' + p.d; tel.value = ''; tel.placeholder = p.ph; tel.focus(); validarContato();
});

/* ··· Início ··· */

mostrar(tela(h) ? h : 'capa');
})();
