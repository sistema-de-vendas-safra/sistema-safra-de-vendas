<title>[a definir: nome público da Análise]</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Permanent+Marker&family=Space+Grotesk:wght@300..700&display=swap">
<style>
/* Layout (estrutura da REA do Full Stack Marketing): capa em coluna de 640 com cartões escuros (teste + vídeo do Junior); abertura em duas colunas; teste em conversa + painel ao vivo à direita (abas no celular); relatório em blocos empilhados com a haste semente → fruto como assinatura.
   Identidade: variação da Triad (triad-www/styles.css). Do site: fundo #07070d, superfícies #11131d e #0d0e16, texto #f4f6f5, cinza #8b8f9c, verde #00ff87 com brilho, grade de 64px do hero, marca ▲ TRIAD e as fontes Space Grotesk, Inter e Permanent Marker (só 1 acento manuscrito por tela).
   Acréscimos do quiz: coral #ff5f6d = abaixo da meta, âmbar #ffb547 = dinheiro na mesa, fruto e estimativa. A marca é escura por natureza: os mesmos valores valem nos dois modos. */
:root{
  --papel:#07070d; --superficie:#11131d; --tinta:#f4f6f5; --ardosia:#8b8f9c; --linha:#2a2e3d; --trilho:#1b1e2a; --grade:rgba(244,246,245,.07);
  --folha:#00ff87; --folha-forte:#5cffb4; --folha-suave:#0b2a1d; --sobre-folha:#04130b;
  --tomate:#ff5f6d; --tomate-suave:#2e1418;
  --trigo:#ffb547; --trigo-suave:#1a1509;
  --sombra:rgba(0,0,0,.6);
  --painel:#0d0e16; --sobre-painel:#f4f6f5; --folha-viva:#00ff87; --tomate-viva:#ff5f6d;
  --f-titulo:'Space Grotesk',system-ui,sans-serif;
  --f-texto:'Inter',system-ui,sans-serif;
  --f-dado:'Space Grotesk',system-ui,sans-serif;
  --f-mao:'Permanent Marker','Marker Felt',cursive;
  --curva:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#07070d; --superficie:#11131d; --tinta:#f4f6f5; --ardosia:#8b8f9c; --linha:#2a2e3d; --trilho:#1b1e2a; --grade:rgba(244,246,245,.07);
  --folha:#00ff87; --folha-forte:#5cffb4; --folha-suave:#0b2a1d; --sobre-folha:#04130b;
  --tomate:#ff5f6d; --tomate-suave:#2e1418;
  --trigo:#ffb547; --trigo-suave:#1a1509;
  --sombra:rgba(0,0,0,.6);
  --painel:#0d0e16; --sobre-painel:#f4f6f5; --folha-viva:#00ff87; --tomate-viva:#ff5f6d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --papel:#07070d; --superficie:#11131d; --tinta:#f4f6f5; --ardosia:#8b8f9c; --linha:#2a2e3d; --trilho:#1b1e2a; --grade:rgba(244,246,245,.07);
  --folha:#00ff87; --folha-forte:#5cffb4; --folha-suave:#0b2a1d; --sobre-folha:#04130b;
  --tomate:#ff5f6d; --tomate-suave:#2e1418;
  --trigo:#ffb547; --trigo-suave:#1a1509;
  --sombra:rgba(0,0,0,.6);
  --painel:#0d0e16; --sobre-painel:#f4f6f5; --folha-viva:#00ff87; --tomate-viva:#ff5f6d; color-scheme:dark;
}
/* Tokens extras, iguais nos dois modos: tons vivos para as superfícies escuras que aparecem dentro de telas claras, fundos em degradê, botão e fonte de máquina */
:root{
  --trigo-viva:#ffb547; --folha-forte-viva:#5cffb4; --superficie-escura:#11131d; --folha-suave-escura:#0b2a1d; --sobre-folha-escura:#04130b;
  --verde-fundo:#0a2a1b; --verde-fundo-2:#0d3322;
  --btn:#00ff87; --btn-texto:#04130b; --btn-hover:#5cffb4;
  --f-maq:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
}
/* Superfícies escuras (cartões da capa, painel ao vivo, vídeo, relatório de exemplo): as mesmas peças, com os tons trocados por dentro */
.escuro{
  --tinta:var(--sobre-painel); --ardosia:color-mix(in srgb,var(--sobre-painel) 62%,transparent);
  --linha:color-mix(in srgb,var(--sobre-painel) 18%,transparent); --trilho:color-mix(in srgb,var(--sobre-painel) 14%,transparent);
  --folha:var(--folha-viva); --folha-forte:var(--folha-forte-viva); --tomate:var(--tomate-viva); --trigo:var(--trigo-viva); --papel:var(--painel);
  --superficie:var(--superficie-escura); --folha-suave:var(--folha-suave-escura); --sobre-folha:var(--sobre-folha-escura);
  --btn:var(--folha-viva); --btn-texto:var(--sobre-folha-escura); --btn-hover:var(--folha-forte-viva);
  color:var(--sobre-painel);
}
/* Telas claras: abertura e conversa (a página do original é clara). O escuro fica nos cartões e no painel. O neon vira acento:
   onde vai texto, o verde escurece para passar de 4,5:1 no fundo claro */
body[data-largura="abertura"],body[data-largura="sala"],body[data-largura="plano"]{
  --papel:#f3f5ef; --superficie:#ffffff; --tinta:#07070d; --ardosia:#586070; --linha:#d8dcd0; --trilho:#e2e6da; --grade:transparent;
  --folha:#007a3e; --folha-forte:#006733; --folha-suave:#dcfae9; --folha-borda:#a8ebc6; --sobre-folha:#ffffff;
  --tomate:#c4323f; --tomate-suave:#fbe6e8; --trigo:#9a5f00; --trigo-suave:#fdf1dc;
  --sombra:rgba(7,7,13,.3);
  --btn:#07070d; --btn-texto:#f3f5ef; --btn-hover:#0d3322;
  --fala:#3b4150;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; position:relative; z-index:0; background:var(--papel); color:var(--tinta);
  font-family:var(--f-texto); font-size:17px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 104px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* Grade e brilho verde do hero do site da Triad, só na capa */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--grade) 1px,transparent 1px),linear-gradient(90deg,var(--grade) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 30%,transparent 80%);opacity:0;transition:opacity .5s}
body[data-largura="capa"]::before{opacity:1}
body[data-largura="capa"]{background:radial-gradient(ellipse 70% 380px at 50% -60px, color-mix(in srgb,var(--folha) 16%,transparent), transparent 72%) no-repeat, var(--papel)}
::selection{background:var(--folha);color:var(--sobre-folha)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--folha);outline-offset:3px;border-radius:6px}
h1,h2,h3{text-wrap:balance}
[hidden]{display:none!important}
.pular{position:absolute;left:-9999px;top:8px;z-index:60;padding:10px 14px;border-radius:8px;background:var(--folha);color:var(--sobre-folha);font-family:var(--f-titulo);font-weight:650;text-decoration:none}
.pular:focus{left:max(16px, env(safe-area-inset-left, 0px))}

/* ··· Cabeçalho: marca + barra fina sem rótulos ··· */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--papel) 84%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:1080px;margin-inline:auto;padding-block:16px 12px}
body[data-largura="capa"] .topo{display:none}
body[data-largura="coluna"] .topo{max-width:620px}
body[data-largura="relatorio"] .topo{max-width:760px}
body[data-largura="abertura"] .topo{max-width:1120px}
body[data-largura="plano"] .topo{max-width:760px}
/* conversa: só a barra de progresso fina (trecho preto sobre trilho claro), sem cabeçalho carregado */
body[data-largura="sala"] .topo{max-width:1180px;padding-block:11px}
body[data-largura="sala"] .topo__linha{display:none}
body[data-largura="sala"] .progresso{margin-top:0}
body[data-largura="sala"] .progresso__fill{background:var(--tinta);box-shadow:none}
.topo__linha{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-titulo);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta)}
.marca svg{width:12px;height:12px;fill:var(--folha)}
.topo__passo{font-family:var(--f-dado);font-size:12px;color:var(--ardosia);letter-spacing:.03em;text-align:right}
.progresso{margin-top:12px;height:5px;background:var(--trilho);border-radius:99px;overflow:hidden}
.progresso__fill{height:100%;width:0;background:var(--folha);box-shadow:0 0 12px color-mix(in srgb,var(--folha) 60%,transparent);border-radius:inherit;transition:width .7s var(--curva)}

/* ··· Palco ··· */
.palco{margin-inline:auto}
.entra > * > *{animation:sobe .5s var(--curva) both}
.entra > * > *:nth-child(2){animation-delay:.07s}
.entra > * > *:nth-child(3){animation-delay:.14s}
.entra > * > *:nth-child(4){animation-delay:.21s}
.entra > * > *:nth-child(n+5){animation-delay:.28s}
[tabindex="-1"]:focus{outline:none}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}}

/* ··· Botões ··· */
.botao{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:999px;border:1.5px solid var(--btn);background:var(--btn);color:var(--btn-texto);font-family:var(--f-titulo);font-weight:600;font-size:1.02rem;line-height:1.2;cursor:pointer;text-decoration:none;box-shadow:0 8px 30px -6px color-mix(in srgb,var(--btn) 32%,transparent);transition:transform .18s var(--curva),background .18s,border-color .18s,color .18s,box-shadow .18s}
.botao:hover{transform:translateY(-2px);background:var(--btn-hover);border-color:var(--btn-hover);box-shadow:0 14px 40px -6px color-mix(in srgb,var(--btn) 48%,transparent)}
.botao:active{transform:none}
.botao:disabled{opacity:.35;cursor:not-allowed;transform:none;background:var(--btn);border-color:var(--btn);box-shadow:none}
.botao--linha{background:transparent;color:var(--tinta);border-color:color-mix(in srgb,var(--tinta) 32%,transparent);box-shadow:none}
.botao--linha:hover{background:transparent;border-color:var(--folha);color:var(--folha);box-shadow:none}
.botao svg{flex:none}
.seta{font-family:var(--f-dado);font-weight:500}
.olho{font-family:var(--f-dado);font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ardosia);margin:0 0 16px}
.fino{font-family:var(--f-dado);font-size:12px;line-height:1.55;color:var(--ardosia);margin:0}

/* ··· Glifos ··· */
.g-semente{fill:var(--ardosia)}
.g-fruto circle{fill:var(--trigo)}
.g-folha{fill:var(--folha)}

/* ··· Capa (C1 a C11): coluna de 640, foto, rótulo, cartões ··· */
.hub{max-width:640px;margin-inline:auto;padding-block:clamp(40px,8vh,80px) 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.hub__foto{width:clamp(96px,18vw,132px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid color-mix(in srgb,var(--folha) 45%,transparent);box-shadow:0 0 0 6px var(--folha-suave),0 20px 50px -22px var(--sombra);background:var(--painel)}
.hub__foto img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 16%}
.hub__nome{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-dado);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ardosia);padding:6px 14px;border:1px solid var(--linha);border-radius:999px;background:color-mix(in srgb,var(--superficie) 60%,transparent)}
.hub__nome::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--folha);box-shadow:0 0 10px var(--folha)}
/* acento manuscrito da capa (Permanent Marker, como o "launches" do site) */
.rotulo{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;margin:30px 0 0;font-family:var(--f-mao);font-size:1.45rem;font-weight:400;line-height:1.2;color:var(--folha);text-shadow:0 0 18px color-mix(in srgb,var(--folha) 45%,transparent)}
.rotulo::before,.rotulo::after{content:"";flex:0 1 56px;height:1px;background:var(--linha)}
.cartoes{width:100%;display:grid;grid-auto-rows:1fr;gap:14px}
.cartao{--sobe:30px;position:relative;isolation:isolate;background:radial-gradient(ellipse 80% 150px at 30% 100%,color-mix(in srgb,var(--folha-viva) 22%,transparent),transparent 72%),linear-gradient(180deg,#07070d 0%,#07120d 36%,var(--verde-fundo) 74%,var(--verde-fundo-2) 100%);border:1px solid color-mix(in srgb,var(--folha-viva) 28%,transparent);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px -30px color-mix(in srgb,var(--folha) 60%,transparent);transition:border-color .25s var(--curva),box-shadow .25s var(--curva),transform .15s var(--curva)}
.cartao:hover{border-color:color-mix(in srgb,var(--folha-viva) 60%,transparent);box-shadow:0 28px 64px -28px color-mix(in srgb,var(--folha) 75%,transparent)}
.cartao:active{transform:scale(.985)}
/* Mesma faixa do Arthur: 190 a 270 de altura, recorte pelo alto. Ela derrete no degradê do cartão por máscara (sem corte seco),
   e o corpo sobe só --sobe, sobre a parte já apagada: o conteúdo da faixa termina antes do texto (nada sobreposto, no celular e no computador) */
.cartao__midia{position:relative;z-index:-1;height:clamp(190px,42vw,270px);overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 50%,transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 50%,transparent 100%)}
.cartao__midia img,.cartao__midia video{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 28%} /* rosto no terço de cima da faixa */
.cartao__midia--barras{display:flex;flex-direction:column;gap:8px;padding:14px clamp(20px,3.5vw,32px) 40px;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 46px),transparent 100%);mask-image:linear-gradient(180deg,#000 calc(100% - 46px),transparent 100%)}
.cartao__midia--barras .barras{flex:1;min-height:0}
.mini-rel__olho{display:flex;justify-content:space-between;gap:8px;margin:0;font-family:var(--f-dado);font-size:10.5px;line-height:1.3;letter-spacing:.1em;text-transform:uppercase;color:var(--ardosia)}
.mini-rel__olho > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartao__corpo{margin-top:calc(var(--sobe) * -1);padding:0 clamp(20px,3.5vw,32px) clamp(24px,4vw,32px);display:flex;flex-direction:column;gap:14px}
.cartao__meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0}
.pilula{display:inline-flex;align-items:center;gap:8px;min-width:0;padding:6px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--sobre-painel) 22%,transparent);background:color-mix(in srgb,var(--painel) 78%,transparent);font-family:var(--f-dado);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--sobre-painel) 72%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pilula::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--folha-viva)}
.cartao__ir{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--folha-viva);color:var(--painel);font-family:var(--f-dado);font-size:15px;font-weight:600;transition:background .25s var(--curva),transform .25s var(--curva)}
.cartao:hover .cartao__ir{background:var(--sobre-painel);transform:translateX(2px)}
.cartao__titulo{margin:0;font-family:var(--f-titulo);font-weight:700;font-size:clamp(22px,5.6vw,27px);line-height:1.18;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 16px rgba(0,0,0,.45)}
.cartao__link{all:unset;cursor:pointer}
.cartao__link::after{content:"";position:absolute;inset:0;border-radius:18px}
.cartao__link:focus-visible::after{outline:2px solid var(--folha-viva);outline-offset:-4px}
.cartao__aviso{margin:0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--sobre-painel) 10%,transparent);font-family:var(--f-dado);font-size:12.5px;line-height:1.55}
.play{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--folha-viva) 92%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--folha-viva) 16%,transparent),0 12px 30px -10px rgba(0,0,0,.55)}
.play::before{content:"";margin-left:5px;border-left:18px solid var(--sobre-folha);border-top:11px solid transparent;border-bottom:11px solid transparent}
.hub__mais{width:100%;display:grid;gap:10px;margin-top:20px}
.hub__mais .botao{width:100%;max-width:320px;justify-self:center}
.hub__mais .fino{text-align:center}
.hub__pe{width:100%;margin-top:30px;padding-top:18px;border-top:1px solid var(--linha);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;font-family:var(--f-dado);font-size:11.5px;color:var(--ardosia)}
.hub__pe .marca{font-size:12px}

/* ··· Abertura do teste (A1 a A9): página clara, peça a peça como a do /assessment do original.
   Relatório de exemplo grande à esquerda (cartão escuro, inclinado, clicável); etiqueta, título, texto, botão preto e nota à direita ··· */
.abertura{width:100%;max-width:1120px;margin-inline:auto;display:grid;gap:clamp(28px,5vw,64px);align-items:start;padding-block:clamp(12px,3vw,36px) 24px}
.abertura__copy{min-width:0;width:100%;max-width:520px;justify-self:center;container-type:inline-size}
.abertura__olho{margin:0 0 18px;font-family:var(--f-maq);font-size:.86rem;font-weight:500;letter-spacing:.02em;color:var(--ardosia)}
.abertura h1{margin:0 0 22px;font-family:var(--f-titulo);font-weight:700;font-size:clamp(2rem,9vw,2.7rem);line-height:1.04;letter-spacing:-.035em;color:var(--tinta);overflow-wrap:break-word}
.abertura__lede{margin:0 0 28px;max-width:32em;font-size:1.1rem;line-height:1.55;color:var(--fala)}
.abertura__lede strong{color:var(--tinta);font-weight:700}
.abertura__meta{display:flex;flex-wrap:wrap;gap:8px 22px;list-style:none;padding:0;margin:0 0 28px;font-family:var(--f-dado);font-size:.95rem;color:var(--ardosia)}
.abertura__meta li{display:inline-flex;align-items:center;gap:8px}
.abertura__meta svg{flex:none;width:16px;height:16px}
.abertura__nota{margin:18px 0 0;max-width:34em;font-size:.88rem;line-height:1.5;color:var(--ardosia)}
@media (min-width:900px){
  .abertura{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  /* o texto acompanha a rolagem do relatório, que é mais alto que a tela */
  .abertura__copy{justify-self:start;position:sticky;top:clamp(72px,12vh,120px);padding-top:clamp(0px,4vh,40px)}
  /* 3 linhas no computador; o tamanho acompanha a largura da coluna para a linha mais longa (21 letras) sempre caber */
  .abertura h1{font-size:clamp(1.6rem,7.6cqw,3.1rem)}
  .abertura h1 .l{display:block;white-space:nowrap}
}

/* Relatório de exemplo: o mesmo que a pessoa recebe no final, com dados de exemplo. A conta toda é em "em" e escala com a largura do cartão */
.previa{position:relative;margin:0;width:100%;max-width:560px;justify-self:center;container-type:inline-size}
.previa__botao{position:absolute;inset:0;z-index:2;width:100%;height:100%;padding:0;border:0;border-radius:20px;background:transparent;cursor:pointer}
.previa__botao:focus-visible{outline:2px solid var(--folha);outline-offset:6px}
.rel{font-size:clamp(10px,2.78cqw,15px);position:relative;padding:2.1em 2em 1.9em;border-radius:1.4em;color:#f4f6f5;
  background:radial-gradient(ellipse 85% 22em at 90% 0%,rgba(0,255,135,.14),transparent 70%),linear-gradient(180deg,#07070d 0%,#08160f 42%,var(--verde-fundo) 100%);
  border:1px solid rgba(0,255,135,.2);box-shadow:0 44px 90px -36px rgba(0,0,0,.6),0 14px 32px -16px rgba(0,0,0,.45);
  transform:rotate(-2deg);transition:transform .35s var(--curva)}
.previa:hover .rel,.previa:has(.previa__botao:focus-visible) .rel{transform:rotate(0) scale(1.01)}
.rel__topo{margin:0;display:flex;justify-content:space-between;gap:1em;font-family:var(--f-maq);font-size:.74em;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,246,245,.6)}
.rel__topo span:first-child{color:var(--folha-viva)}
.rel__titulo{margin:.5em 0 0;font-family:var(--f-titulo);font-weight:700;font-size:2.2em;line-height:1.05;letter-spacing:-.03em;color:#fff;text-wrap:balance}
.rel__quem{margin:1.1em 0 0;padding-top:1.1em;border-top:1px solid rgba(0,255,135,.28);display:flex;flex-wrap:wrap;gap:.4em 1.2em;font-family:var(--f-maq);font-size:.72em;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,246,245,.68)}
.rel__quem b{color:#fff;font-weight:600}
.rel__sec{margin-top:1.9em;display:grid;grid-template-columns:1.4em minmax(0,1fr);gap:0 .9em;align-items:start}
.rel__vert{writing-mode:vertical-rl;transform:rotate(180deg);justify-self:center;font-family:var(--f-maq);font-size:.66em;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:rgba(244,246,245,.5)}
.rel__conteudo{min-width:0}
.rel__funil{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.3em}
.rel__graf{height:13.5em;min-width:0}
.rel .barras{--larg:clamp(12px,38%,34px);font-size:.92em}
.rel__perfil{align-self:start;padding:1.1em 1.2em 1.2em;border-radius:1em;color:var(--sobre-folha-escura);background:linear-gradient(150deg,#5cf0a8 0%,#26c576 100%);box-shadow:0 0 2.4em -.6em rgba(0,255,135,.5)}
.rel__perfil-cab{margin:0;display:flex;align-items:center;gap:.7em;font-family:var(--f-maq);font-size:.66em;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.rel__perfil-cab::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.rel__perfil b{display:block;margin-top:.7em;font-family:var(--f-titulo);font-weight:800;font-size:1.45em;line-height:1.08;letter-spacing:-.015em}
.rel__perfil-txt{margin:.7em 0 0;font-size:.86em;line-height:1.45;color:#0a2a18}
.rel .mini{margin:1.6em 0 0;gap:1em}
.rel .mini li{font-size:.92em}
.rel .mini em{font-size:1em}
.rel__sub{margin:0 0 .9em;font-family:var(--f-maq);font-size:.7em;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,246,245,.6)}
.rel__sub b{color:var(--folha-viva);font-weight:600}
.rel__selos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55em}
.rel__selos li{display:flex;align-items:center;gap:.5em;min-width:0;padding:.7em .75em;border:1px solid rgba(244,246,245,.14);border-radius:.7em;font-family:var(--f-titulo);font-weight:550;font-size:.74em;line-height:1.2;color:rgba(244,246,245,.5)}
.rel__selos li::before{content:"";flex:none;width:.7em;height:.7em;border-radius:50%;border:1.5px dashed currentColor}
.rel__selos li.is-ganho{color:#fff;border-color:rgba(0,255,135,.55);background:rgba(0,255,135,.12)}
.rel__selos li.is-ganho::before{border:0;background:var(--folha-viva)}
.rel__qs{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.rel__q{min-width:0;padding:1.1em 1.2em;border:1px solid rgba(244,246,245,.14);border-radius:.9em;background:rgba(244,246,245,.03)}
.rel__q h3{margin:0 0 .8em;display:flex;align-items:center;gap:.6em;font-family:var(--f-maq);font-size:.7em;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.rel__q h3::before{content:"";flex:none;width:.9em;height:.9em;border-radius:50%;background:currentColor}
.rel__q--f h3{color:var(--folha-viva)} .rel__q--r h3{color:var(--tomate-viva)} .rel__q--o h3{color:var(--trigo-viva)} .rel__q--a h3{color:rgba(244,246,245,.62)}
.rel__q ul{list-style:none;margin:0;padding:0;display:grid;gap:.6em;font-size:.76em;line-height:1.4;color:rgba(244,246,245,.9)}
.rel__q li{position:relative;padding-left:1.1em}
.rel__q li::before{content:"";position:absolute;left:0;top:.5em;width:.4em;height:.4em;border-radius:50%;background:currentColor;opacity:.6}
.rel__mesa{margin:1.7em 0 0;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.4em 1em;padding:1em 1.2em;border:1px dashed rgba(255,181,71,.55);border-radius:.9em;font-family:var(--f-dado);font-size:.8em;color:rgba(244,246,245,.72)}
.rel__mesa b{font-weight:600;font-size:1.05em;color:var(--trigo-viva)}
/* cartão estreito (celular): sem o rótulo girado, tudo em uma coluna */
@container (max-width:430px){
  .rel{font-size:max(10.6px,3.05cqw);padding:1.8em 1.4em 1.5em}
  .rel__sec{grid-template-columns:1fr;gap:.9em 0}
  .rel__vert{writing-mode:horizontal-tb;transform:none;justify-self:start}
  .rel__funil{grid-template-columns:1fr}
  .rel__selos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rel__qs{grid-template-columns:1fr}
}
/* no celular o relatório vem em cima, menor: mostra o começo dele e esmaece, o cartão inteiro continua clicável */
@media (max-width:899px){
  .previa{max-height:clamp(500px,148vw,620px);overflow:hidden;padding:10px 10px 0;-webkit-mask-image:linear-gradient(180deg,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,#000 78%,transparent 100%)}
}

/* ··· Sala: conversa + painel ao vivo (T2, T3) ··· */
.sala{max-width:1180px;margin-inline:auto;display:grid;gap:24px;align-items:start}
@media (min-width:980px){
  .sala{grid-template-columns:minmax(0,1fr) 480px;gap:40px}
  .abas{display:none!important}
}
.abas{position:sticky;top:calc(env(safe-area-inset-top,0px) + 33px);z-index:15;display:flex;gap:6px;padding:4px;margin-top:0;background:var(--superficie);border:1px solid var(--linha);border-radius:999px;box-shadow:0 8px 16px -12px var(--sombra)}
.abas button{position:relative;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border:0;border-radius:999px;background:transparent;font-family:var(--f-titulo);font-weight:600;font-size:.92rem;color:var(--ardosia);cursor:pointer}
.abas button[aria-selected="true"]{background:var(--tinta);color:var(--papel)}
/* selo da aba Resultado: conta o que já foi preenchido, gira na análise, vira ✓ quando fica pronto */
.abas__selo{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid currentColor;font-family:var(--f-dado);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.abas__selo.is-novo{background:var(--folha);border-color:var(--folha);color:var(--sobre-folha)}
.abas__selo.is-girando{color:var(--trigo);border-color:color-mix(in srgb,var(--trigo) 30%,transparent)}
.abas__selo.is-girando::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--trigo);border-right-color:transparent;border-bottom-color:transparent;animation:gira .8s linear infinite}
.abas__selo.is-pronto{background:var(--folha);border-color:var(--folha);color:var(--sobre-folha);animation:pulso-forte .8s var(--curva) 4}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pulso-forte{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--folha) 75%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.abas button.is-empurrao{animation:empurrao 1.3s var(--curva) infinite}
@keyframes empurrao{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--folha) 40%,transparent)}}
/* setinha apontando para a aba (o 👆 do original) */
.abas button.is-empurrao::after{content:"↑";position:absolute;top:calc(100% + 8px);left:50%;margin-left:-.3em;font-family:var(--f-titulo);font-size:22px;font-weight:700;line-height:1;color:var(--folha);text-shadow:0 0 12px color-mix(in srgb,var(--folha) 60%,transparent);animation:aponta 1s var(--curva) infinite;pointer-events:none}
@keyframes aponta{50%{transform:translateY(-5px)}}
@media (max-width:979px){
  body[data-aba="resultado"] .sala [data-pane="conversa"]{display:none}
  body:not([data-aba="resultado"]) .sala [data-pane="resultado"]{display:none}
}

/* ··· Conversa (T4 a T11): fundo claro. A fala do Junior fica em balão branco (Inter regular, cinza escuro); a pergunta fica solta no fundo
   (Space Grotesk em negrito, preta, maior), colada nas opções; uma opção por linha, sem bolinha ··· */
.conversa{max-width:660px;width:100%;margin-inline:auto;padding-block:20px 0;display:flex;flex-direction:column;gap:14px;min-width:0}
/* espaço vazio no fim: deixa o que é novo subir até a linha de leitura mesmo com pouco conteúdo */
.conversa::after{content:"";flex:none;height:100vh}
/* âncora de altura zero: o ponto exato onde começa tudo que é novo (o espaço de 14 entre itens é cancelado) */
[data-ancora]{height:0;margin-bottom:-14px}
.balao{display:flex;gap:12px;align-items:flex-start;min-width:0}
.balao.is-in{animation:sobe .36s var(--curva) both}
.balao__texto{min-width:0;background:var(--superficie);border:1px solid var(--linha);border-radius:10px;padding:14px 18px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden}
.avatar img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 16%;opacity:0;transition:opacity .25s}
.balao--bot.is-ultimo .avatar img{opacity:1}
.fala{margin:0;font-family:var(--f-texto);font-size:clamp(1.1rem,1.04rem + .2vw,1.25rem);font-weight:400;line-height:1.5;color:var(--fala);text-wrap:pretty}
.fala strong{font-family:var(--f-titulo);font-weight:700;color:var(--tinta)}
/* respiro de 40px entre o comentário e a pergunta (14 do espaço normal + 26) */
.balao--bot + .balao--perg,.marco + .balao--perg{margin-top:26px}
.pergunta{flex:1;min-width:0}
.pergunta__q{margin:0;font-family:var(--f-titulo);font-weight:700;font-size:clamp(1.25rem,1.1rem + .5vw,1.4rem);line-height:1.25;letter-spacing:-.015em;color:var(--tinta);text-wrap:balance}
.ajuda{margin:6px 0 0;font-size:.9rem;line-height:1.45;color:var(--ardosia)}
.balao--eu{justify-content:flex-end}
.balao--eu .balao__texto{display:inline-flex;align-items:flex-start;gap:10px;max-width:88%;background:var(--folha-suave);border-color:var(--folha-borda);font-family:var(--f-titulo);font-weight:500;font-size:1.02rem;line-height:1.45;color:var(--tinta);padding:11px 12px 11px 16px}
.editar{flex:none;background:none;border:0;padding:0 2px;font-size:14px;line-height:1.45;color:var(--ardosia);cursor:pointer}
.editar:hover{color:var(--tinta)}
.digitando .balao__texto{display:inline-flex;gap:5px;padding:15px 16px}
.digitando i{width:7px;height:7px;border-radius:50%;background:var(--ardosia);animation:pula 1s infinite ease-in-out}
.digitando i:nth-child(2){animation-delay:.18s}
.digitando i:nth-child(3){animation-delay:.36s}
@keyframes pula{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.recuo{margin-left:52px}
@media (max-width:520px){ .recuo{margin-left:46px} .avatar{width:34px;height:34px} }
/* marcos discretos: "✓ 1 de 3" */
.marco{margin:0;font-family:var(--f-dado);font-size:12.5px;line-height:1.4;color:var(--ardosia)}
.marco strong{font-weight:600;color:var(--tinta)}

/* ··· Opções (T9): linhas brancas de largura total, uma por linha, sem bolinha ··· */
[data-corpo]{margin-top:2px} /* 16px da pergunta até a primeira opção */
.opcoes{display:flex;flex-direction:column;gap:10px}
.opcao{display:flex;align-items:center;gap:12px;width:100%;min-width:0;min-height:64px;text-align:left;padding:14px 20px;background:var(--superficie);border:1px solid var(--linha);border-radius:10px;font-family:var(--f-texto);font-size:clamp(1.05rem,1rem + .2vw,1.125rem);font-weight:500;line-height:1.35;color:var(--tinta);cursor:pointer;transition:border-color .15s,background .15s}
.opcao:hover{border-color:color-mix(in srgb,var(--tinta) 60%,var(--linha))}
.opcao[aria-checked="true"]{border-color:var(--folha);background:var(--folha-suave)}
.opcao[role="checkbox"][aria-checked="true"]::after{content:"✓";margin-left:auto;padding-left:12px;font-weight:700;color:var(--folha)}
.opcao small{display:block;font-family:var(--f-texto);font-size:.9rem;font-weight:400;color:var(--ardosia);margin-top:2px}
.opcoes--duas .opcao b{font-family:var(--f-titulo);font-weight:600;font-size:1.1rem}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}

/* ··· Campos ··· */
.entrada{display:flex;align-items:center;gap:10px;background:var(--superficie);border:1.5px solid var(--linha);border-radius:10px;padding:0 16px;transition:border-color .15s}
.entrada:focus-within{border-color:var(--folha)}
.entrada input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tinta);font-family:var(--f-titulo);font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:550;padding:13px 0}
.entrada__pre,.entrada__pos{font-family:var(--f-dado);font-size:.95rem;color:var(--ardosia)}
.entrada--grande{max-width:340px}
.entrada--grande input{font-size:1.7rem;font-weight:700;padding:14px 0}
.dica{font-family:var(--f-dado);font-size:12px;color:var(--ardosia);margin:8px 0 0}

/* ··· Modo números ··· */
.livro{list-style:none;margin:0;padding:0;position:relative}
.livro::before{content:"";position:absolute;left:11px;top:26px;bottom:26px;width:2px;background:var(--linha)}
.livro > li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--linha)}
.livro > li:last-child{border-bottom:0}
.no{position:relative;z-index:1;width:24px;height:24px;display:grid;place-items:center;background:var(--papel)}
.no svg{width:16px;height:16px}
.no i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ardosia);background:var(--papel)}
.livro__rotulo b{display:block;font-family:var(--f-titulo);font-weight:650;font-size:1rem;line-height:1.25}
.livro__rotulo small{display:block;font-size:.9rem;line-height:1.35;color:var(--ardosia)}
.livro__campo{display:flex;align-items:center;gap:8px}
.livro__campo .entrada{padding:0 12px;border-radius:10px}
.livro__campo input{width:84px;flex:none;padding:10px 0;font-size:1.05rem}
.alterna{display:inline-flex;border:1px solid var(--linha);border-radius:9px;overflow:hidden;background:var(--superficie)}
.alterna button{border:0;background:transparent;padding:10px 11px;font-family:var(--f-dado);font-size:13px;color:var(--ardosia);cursor:pointer;min-width:40px}
.alterna button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.alterna--fixa{padding:10px 12px;font-family:var(--f-dado);font-size:13px;color:var(--ardosia)}
.livro__calc{grid-column:2 / -1;margin:0;font-family:var(--f-dado);font-size:12px;color:var(--folha);min-height:1em}
.livro__calc.is-aviso{color:var(--tomate)}
@media (max-width:520px){
  .livro > li{grid-template-columns:24px minmax(0,1fr)}
  .livro__campo{grid-column:2}
}

/* ··· Modo chute ··· */
.ou{display:flex;align-items:center;gap:12px;font-family:var(--f-dado);font-size:12px;color:var(--ardosia);margin:6px 0 2px}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--linha)}
.chute{max-width:200px}

/* ··· Contato (T19) ··· */
.cartao-form{background:var(--superficie);border:1px solid var(--linha);border-radius:16px;padding:18px}
.form{display:grid;gap:16px}
.campo label,.campo .rotulo-campo{display:block;font-family:var(--f-titulo);font-weight:600;font-size:.93rem;margin-bottom:6px}
.opcional{font-weight:400;color:var(--ardosia)}
.campo input:not(.cru){width:100%;background:var(--papel);border:1.5px solid var(--linha);border-radius:10px;padding:13px 14px;font-family:var(--f-titulo);font-size:1.05rem;font-weight:500;color:var(--tinta);transition:border-color .15s}
.campo input:not(.cru):focus{outline:0;border-color:var(--folha)}
.tel{display:flex;gap:8px}
.ddi{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--papel);border:1.5px solid var(--linha);border-radius:10px;font-family:var(--f-dado);font-size:.95rem;white-space:nowrap}
.ddi:focus-within{border-color:var(--folha);outline:2px solid var(--folha);outline-offset:2px}
.ddi__seta{font-size:10px;color:var(--ardosia)}
.ddi select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;font-size:16px}
.tel input{flex:1;min-width:0}
.dica.is-ok{color:var(--folha)}
.sugestao{display:inline;background:none;border:0;padding:0;font:inherit;color:var(--folha);text-decoration:underline;cursor:pointer}
.proto-encher{justify-self:start;background:none;border:1px dashed var(--ardosia);border-radius:8px;padding:6px 10px;font-family:var(--f-dado);font-size:11.5px;color:var(--ardosia);cursor:pointer}

/* ··· Montando (T20) ··· */
.montando{max-width:440px;margin-inline:auto;padding-block:20px 8px;text-align:center}
.broto{width:120px;height:120px;display:block;margin:0 auto 14px}
.broto .chao{stroke:var(--linha);stroke-width:2;stroke-linecap:round}
.broto .caule{fill:none;stroke:var(--folha);stroke-width:3;stroke-linecap:round;stroke-dasharray:80;stroke-dashoffset:80;animation:desenha 1.3s .2s var(--curva) forwards}
.broto .fl{fill:var(--folha);transform-box:fill-box;transform:scale(0);animation:abre .5s var(--curva) forwards}
.broto .fl1{transform-origin:100% 100%;animation-delay:1s}
.broto .fl2{transform-origin:0 100%;animation-delay:1.3s}
.broto .fr{fill:var(--trigo);transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:abre .5s 2.3s var(--curva) forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
@keyframes abre{to{transform:scale(1)}}
.montando__titulo{font-family:var(--f-titulo);font-weight:750;font-size:1.4rem;letter-spacing:-.015em;margin:0 0 16px}
.passos{list-style:none;padding:0;margin:0 auto;display:grid;gap:10px;text-align:left;width:fit-content;max-width:100%;font-family:var(--f-dado);font-size:13.5px;color:var(--ardosia)}
.passos li{display:flex;align-items:center;gap:10px;transition:color .3s}
.passos li::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--linha);transition:background .3s,border-color .3s}
.passos li.feito{color:var(--tinta)}
.passos li.feito::before{background:var(--folha);border-color:var(--folha);box-shadow:inset 0 0 0 3px var(--papel)}
.montando .botao{margin-top:24px}

/* ··· Painel ao vivo (T16): continua escuro (preto Triad para verde-escuro), como no original ··· */
.painel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 51px);max-height:calc(100vh - 76px);overflow:auto;margin-top:20px;background:radial-gradient(ellipse 90% 220px at 88% 0%,color-mix(in srgb,var(--folha-viva) 13%,transparent),transparent 70%),linear-gradient(180deg,#07070d 0%,#08160f 45%,var(--verde-fundo) 100%);border:1px solid color-mix(in srgb,var(--folha-viva) 22%,transparent);border-radius:20px;padding:28px 26px 24px;display:grid;gap:32px;box-shadow:0 30px 60px -34px var(--sombra);min-width:0}
@media (max-width:979px){ .painel{position:relative;max-height:none;margin-top:12px} }
/* véu escuro com desfoque enquanto o diagnóstico é montado; o aviso de análise fica por cima */
body[data-analisando] .painel::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;background:color-mix(in srgb,var(--painel) 62%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);pointer-events:none}
body[data-analisando] .painel__topo,body[data-analisando] .painel__titulo,body[data-analisando] .giro{position:relative;z-index:2}
.painel__topo{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-maq);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ardosia)}
.painel__marca{color:var(--folha)}
@keyframes pisca{50%{opacity:.25}}
.painel__titulo{margin:-14px 0 0;font-family:var(--f-titulo);font-weight:700;font-size:2rem;line-height:1.05;letter-spacing:-.03em;color:#fff}
.giro{display:flex;align-items:center;gap:8px;margin:-20px 0 0;font-family:var(--f-maq);font-size:12px;color:var(--trigo)}
.giro::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor;animation:pisca 1.6s infinite}
.ficha{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ficha li{display:flex;align-items:center;gap:14px;padding:6px 8px;margin:0 -8px;border-radius:12px}
.ficha__ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--folha) 45%,transparent);color:var(--folha)}
.ficha__ic svg{width:17px;height:17px}
.ficha__corpo{min-width:0;display:grid;gap:1px}
.ficha__k{font-family:var(--f-maq);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ardosia)}
.ficha__v{min-width:0;font-family:var(--f-titulo);font-weight:600;font-size:1.02rem;line-height:1.25;color:#fff}
.ficha li.is-vazio .ficha__v{color:var(--ardosia);font-weight:400}
.ficha li.is-destaque{animation:destaque 1s var(--curva) 3}
@keyframes destaque{50%{background:color-mix(in srgb,var(--folha) 26%,transparent)}}
.perfil-funil{padding:16px 18px 18px;border-radius:16px;color:var(--sobre-folha-escura);background:linear-gradient(150deg,#5cf0a8 0%,#26c576 100%);box-shadow:0 0 36px -10px color-mix(in srgb,var(--folha-viva) 55%,transparent)}
.perfil-funil__cab{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-maq);font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.perfil-funil__cab::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.perfil-funil__corpo{display:flex;align-items:center;gap:12px;margin-top:12px}
.perfil-funil__ic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#04130b;color:var(--folha-viva)}
.perfil-funil__ic svg{width:19px;height:19px}
.perfil-funil__nome{margin:0;font-family:var(--f-titulo);font-weight:800;font-size:1.55rem;line-height:1.05;letter-spacing:-.01em}
.perfil-funil__sub{margin:10px 0 0;font-size:.92rem;line-height:1.45;color:#0a2a18}
.sec-cab{display:flex;align-items:baseline;gap:12px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--linha)}
.sec-cab b{font-family:var(--f-maq);font-weight:500;font-size:12px;letter-spacing:.1em;color:var(--folha)}
.sec-cab h2{margin:0;font-family:var(--f-titulo);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;color:#fff}
.sec-cab span{margin-left:auto;font-family:var(--f-maq);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ardosia)}
#painelFunil .barras{height:190px}
.selos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.selo-item{display:flex;align-items:center;gap:8px;min-width:0;padding:8px 10px;border:1px solid var(--linha);border-radius:10px;font-family:var(--f-titulo);font-size:.82rem;font-weight:550;line-height:1.2;color:var(--ardosia);opacity:.65}
.selo-item::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;border:1.5px dashed var(--ardosia)}
.selo-item.is-ganho{opacity:1;color:var(--tinta);border-color:color-mix(in srgb,var(--folha) 55%,transparent);background:color-mix(in srgb,var(--folha) 12%,transparent)}
.selo-item.is-ganho::before{border:0;background:var(--folha)}
.quadros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quadro{border:1px solid var(--linha);border-radius:12px;padding:12px 14px;display:grid;gap:7px}
.quadro b{font-family:var(--f-maq);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.quadro--f b{color:var(--folha)} .quadro--r b{color:var(--tomate)} .quadro--o b{color:var(--trigo)} .quadro--a b{color:var(--ardosia)}
.esqueleto{height:7px;border-radius:4px;background:var(--trilho)}
.esqueleto + .esqueleto{width:70%}
body[data-analisando] .esqueleto{animation:pisca 1.2s infinite}
.painel__acoes{display:flex;gap:8px;flex-wrap:wrap}
.painel__acoes button{flex:1;padding:9px 12px;border-radius:999px;border:1px solid var(--linha);background:transparent;color:var(--ardosia);font-family:var(--f-dado);font-size:12px;cursor:not-allowed}
.painel__nota{margin:8px 0 0;font-family:var(--f-dado);font-size:11.5px;line-height:1.5;color:var(--ardosia)}

/* ··· Selo conquistado (T15) ··· */
.aviso-selo{position:fixed;z-index:40;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 150px);padding:10px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--folha-viva) 45%,transparent);background:var(--painel);color:var(--sobre-painel);font-family:var(--f-titulo);font-weight:650;font-size:.95rem;box-shadow:0 18px 40px -18px var(--sombra);animation:sobe .4s var(--curva) both}
.aviso-envio{position:fixed;z-index:45;left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));max-width:560px;margin-inline:auto;padding:14px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--tomate) 55%,transparent);background:var(--painel);color:var(--sobre-painel);font-family:var(--f-texto);font-size:.95rem;line-height:1.45;box-shadow:0 18px 40px -18px var(--sombra);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.aviso-envio[hidden]{display:none}
.aviso-envio p{margin:0;flex:1 1 240px}
.aviso-envio .botao{padding:9px 18px;font-size:.92rem;background:var(--folha-viva);border-color:var(--folha-viva);color:var(--sobre-folha);box-shadow:none}
.aviso-selo small{display:block;font-family:var(--f-dado);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--folha-viva)}

/* ··· Relatório ··· */
.relatorio{max-width:760px;margin-inline:auto;padding-block:20px 8px;display:flex;flex-direction:column;gap:56px}
.rel-ficha{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--linha);font-family:var(--f-dado);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ardosia)}
.rel-ficha span:first-child{color:var(--tinta);font-weight:600}
.rel-topo h1{font-family:var(--f-titulo);font-weight:800;font-size:clamp(2rem,1.4rem + 2.6vw,3.2rem);line-height:1.03;letter-spacing:-.03em;margin:0 0 18px}
/* acento manuscrito do relatório: o veredito, na cor do status */
.rel-topo h1 span{display:inline-block;font-family:var(--f-mao);font-weight:400;font-size:.92em;line-height:1.1;letter-spacing:0;color:var(--tomate);text-shadow:0 0 18px color-mix(in srgb,var(--tomate) 40%,transparent);transform:rotate(-2deg)}
.rel-topo h1 span.ok{color:var(--folha);text-shadow:0 0 18px color-mix(in srgb,var(--folha) 45%,transparent)}
.rel-topo__lede{font-size:1.15rem;line-height:1.55;max-width:36em;margin:0 0 18px}
.rel-selos{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.selo{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--linha);border-radius:999px;font-family:var(--f-dado);font-size:12px;color:var(--ardosia)}
.selo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--folha)}
.selo--est{color:var(--tinta);border-color:color-mix(in srgb,var(--trigo) 45%,transparent)}
.selo--est::before{background:var(--trigo)}
.perfil-chip{display:inline-flex;align-items:baseline;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--linha);background:var(--painel);color:color-mix(in srgb,var(--sobre-painel) 70%,transparent);font-family:var(--f-dado);font-size:12px}
.perfil-chip b{font-family:var(--f-titulo);font-weight:750;font-size:.92rem;color:var(--folha-viva)}
.rel-copia{margin:14px 0 0;font-family:var(--f-dado);font-size:12px;color:var(--ardosia)}
.secao__olho{font-family:var(--f-dado);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ardosia);margin:0 0 6px}
.secao__titulo{font-family:var(--f-titulo);font-weight:750;font-size:clamp(1.4rem,1.2rem + .8vw,1.8rem);line-height:1.12;letter-spacing:-.02em;margin:0 0 22px}

/* Haste semente → fruto (assinatura) */
.haste{position:relative;padding-left:44px}
.haste::before{content:"";position:absolute;left:13px;top:30px;bottom:30px;width:2px;background:linear-gradient(var(--ardosia),var(--folha));opacity:.45}
.haste__ponta{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-block:8px}
.haste__ponta > svg{position:absolute;left:-44px;top:8px;width:28px;height:28px;background:var(--papel)}
.haste__ponta b{font-family:var(--f-titulo);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.haste__ponta span{font-family:var(--f-dado);font-size:12.5px;color:var(--ardosia)}
.haste__geral{flex-basis:100%;font-family:var(--f-dado);font-size:12.5px;color:var(--ardosia);margin:6px 0 0}
.haste__geral strong{color:var(--tinta);font-weight:600}
.etapas{list-style:none;margin:0;padding:6px 0;display:grid;gap:22px}
.etapa{position:relative;padding-block:4px}
.etapa::before{content:"";position:absolute;left:-36px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--folha);box-shadow:0 0 0 4px var(--papel),0 0 12px color-mix(in srgb,var(--folha) 60%,transparent)}
.etapa.is-baixo::before{background:var(--papel);border:2.5px solid var(--tomate);box-shadow:0 0 0 4px var(--papel)}
.etapa__linha{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.etapa__nome{font-family:var(--f-titulo);font-weight:650;font-size:1.05rem}
.etapa__taxa{font-family:var(--f-dado);font-weight:600;font-size:1.35rem;font-variant-numeric:tabular-nums;color:var(--folha)}
.is-baixo .etapa__taxa{color:var(--tomate)}
.etapa__pe{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;font-family:var(--f-dado);font-size:12px;color:var(--ardosia)}
.etapa__status{color:var(--folha)}
.is-baixo .etapa__status{color:var(--tomate)}
.regua{position:relative;height:12px;margin:26px 0 9px;background:var(--trilho);border-radius:3px}
.regua__barra{position:absolute;left:0;top:0;bottom:0;width:calc(var(--v) * 1%);background:var(--folha);border-radius:3px;animation:enche 1s .15s var(--curva) both}
.is-baixo .regua__barra{background:var(--tomate)}
.regua__falta{position:absolute;top:0;bottom:0;left:calc(var(--v) * 1%);width:calc((var(--m) - var(--v)) * 1%);background:repeating-linear-gradient(135deg,var(--tomate) 0 2px,transparent 2px 6px);opacity:.5}
.regua__meta{position:absolute;top:-6px;bottom:-6px;left:calc(var(--m) * 1%);width:2px;margin-left:-1px;background:var(--tinta)}
.regua__meta i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding-bottom:4px;font-family:var(--f-dado);font-style:normal;font-size:10.5px;line-height:1;white-space:nowrap;color:var(--tinta)}
@keyframes enche{from{width:0}}
.mini{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.mini li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;font-family:var(--f-titulo);font-size:.88rem;font-weight:550}
.mini .regua{grid-column:1 / -1;height:8px;margin:2px 0 0}
.mini .regua__meta{top:-4px;bottom:-4px}
.mini .regua__meta i{display:none}
.mini em{font-style:normal;font-family:var(--f-dado);font-size:.85rem;font-weight:600;color:var(--folha)}
.mini .is-baixo em{color:var(--tomate)}
.mini .is-vazio em{color:var(--ardosia);font-weight:400}

/* Leitura em 4 quadros */
.quatro{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.quatro__q{border:1px solid var(--linha);border-radius:16px;padding:18px 18px 16px;background:var(--superficie)}
.quatro__q h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-family:var(--f-dado);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.quatro__q h3::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.q-forca h3{color:var(--folha)} .q-fraqueza h3{color:var(--tomate)} .q-oportunidade h3{color:var(--trigo)} .q-alerta h3{color:var(--ardosia)}
.q-fraqueza .lista li::before{background:var(--tomate)} .q-oportunidade .lista li::before{background:var(--trigo)} .q-alerta .lista li::before{background:var(--ardosia)}
.selos--rel{grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))}

/* Pontos fracos */
.fracos{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--tinta)}
.fraco{padding:26px 0;border-bottom:1px solid var(--linha);display:grid;gap:12px}
.fraco__tag{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-dado);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ardosia)}
.fraco__tag .principal{color:var(--tomate);font-weight:600}
.fraco__cabeca{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.fraco h3{font-family:var(--f-titulo);font-weight:750;font-size:1.45rem;letter-spacing:-.015em;margin:0}
.fraco__num{font-family:var(--f-dado);font-size:13px;color:var(--ardosia);white-space:nowrap}
.fraco__num b{font-size:1.15rem;color:var(--tomate);font-weight:600}
.fraco__frase{margin:0;font-size:1.08rem}
.fraco__bloco h4{margin:6px 0 4px;font-family:var(--f-dado);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--folha)}
.fraco__bloco p{margin:0;color:var(--tinta)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lista li{position:relative;padding-left:20px}
.lista li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--folha);transform:rotate(45deg)}
.conjunta{margin-top:24px;padding:18px 20px;border:1px dashed var(--ardosia);border-radius:14px;display:grid;gap:8px}
.conjunta p{margin:0}
.conjunta .secao__olho{margin:0}
.funciona{margin-top:18px;display:flex;gap:12px;align-items:flex-start}
.funciona svg{flex:none;width:22px;height:22px;margin-top:2px}
.funciona p{margin:0}

/* Dinheiro na mesa */
.mesa{background:var(--trigo-suave);border:1px solid color-mix(in srgb,var(--trigo) 30%,transparent);border-radius:20px;padding:clamp(22px,4vw,40px)}
.mesa__valor{font-family:var(--f-titulo);font-weight:800;font-size:clamp(2.6rem,1.8rem + 3.4vw,4.2rem);line-height:1;letter-spacing:-.035em;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.mesa__valor small{font-family:var(--f-dado);font-weight:500;font-size:.9rem;letter-spacing:0;color:var(--ardosia);margin-left:6px}
.mesa__valor--frase{font-size:clamp(1.8rem,1.3rem + 2vw,2.7rem);line-height:1.08;letter-spacing:-.025em}
.mesa__frase{font-size:1.1rem;margin:0 0 24px;max-width:34em}
.partes{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:14px}
.partes li{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.partes__nome{font-family:var(--f-titulo);font-weight:650}
.partes__barra{height:10px;border-radius:3px;background:var(--trigo);width:calc(var(--p) * 1%);animation:enche 1s .2s var(--curva) both}
.partes__valor{font-family:var(--f-dado);font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.partes__valor b{font-size:15px;font-weight:600}
@media (max-width:560px){
  .partes li{grid-template-columns:minmax(0,1fr) auto}
  .partes__barra{grid-column:1 / -1;grid-row:2}
}
.mesa__nota{font-family:var(--f-dado);font-size:12px;line-height:1.6;color:var(--ardosia);margin:0;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--trigo) 45%,transparent)}
.rolagem{overflow-x:auto;margin:0 0 20px}
.tabela{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:360px}
.tabela th{font-family:var(--f-dado);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ardosia);text-align:left;padding:0 10px 8px 0}
.tabela td{font-family:var(--f-titulo);font-weight:600;font-size:1.1rem;padding:10px 10px 10px 0;border-top:1px solid color-mix(in srgb,var(--trigo) 45%,transparent)}
.tabela td:last-child,.tabela th:last-child{text-align:right;padding-right:0}

/* Vídeo do Junior no relatório (T23) */
.video{position:relative;isolation:isolate;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:var(--painel)}
.video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 26%}
.video__veu{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,color-mix(in srgb,var(--painel) 85%,transparent))}
.video__play{position:absolute;inset:0;width:100%;padding:0;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.video__play:focus-visible{outline:2px solid var(--folha-viva);outline-offset:-6px;border-radius:18px}
.video__play:hover .play{transform:scale(1.06)}
.video .play{transition:transform .2s var(--curva)}
.video .pilula{position:absolute;left:16px;bottom:14px;max-width:calc(100% - 32px)}
.video-bloco .cartao__aviso{margin-top:12px;background:var(--trigo-suave);color:var(--tinta)}

/* Chamada final */
.cta{background:radial-gradient(ellipse 70% 170px at 20% 0%,color-mix(in srgb,var(--folha) 17%,transparent),transparent 72%) no-repeat,linear-gradient(180deg,#07070d 0%,var(--verde-fundo) 100%);color:var(--sobre-painel);border:1px solid color-mix(in srgb,var(--folha) 32%,transparent);border-radius:22px;padding:clamp(24px,4.5vw,44px)}
.cta .secao__olho{color:color-mix(in srgb,var(--sobre-painel) 65%,transparent)}
.cta h2{color:#fff;font-family:var(--f-titulo);font-weight:800;font-size:clamp(1.6rem,1.3rem + 1.4vw,2.3rem);line-height:1.08;letter-spacing:-.025em;margin:0 0 12px}
.cta p{margin:0 0 24px;font-size:1.08rem;max-width:32em;color:color-mix(in srgb,var(--sobre-painel) 88%,transparent)}
.cta__botoes{display:flex;flex-wrap:wrap;gap:12px}
.cta .botao--linha{color:var(--sobre-painel);border-color:color-mix(in srgb,var(--sobre-painel) 40%,transparent)}
.cta .botao--linha:hover{background:transparent;border-color:var(--folha);color:var(--folha)}

(function(){
'use strict';

/* ··· FATOS: os fatos da ficha que esta página usa, num lugar só ···

const IC = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';

function volumesDe(nums){
  const abs = [];
  nums.forEach((n, i) => {
    const v = lerNum(n.v);
    abs[i] = v === null ? null : (i === 0 || n.u === 'n') ? v : (abs[i - 1] === null ? null : abs[i - 1] * v / 100);
  });
  return abs;
}
function taxasDe(nums){
  const abs = volumesDe(nums);
  return [1, 2, 3, 4].map(i => abs[i] !== null && abs[i - 1] ? abs[i] / abs[i - 1] * 100 : null);
}

/* ··· Gráfico de colunas do funil (capa, prévia da abertura e painel): da semente ao fruto ···
   A altura é em raiz quadrada: 7 vendas ao lado de 400 leads ficariam com 1 pixel numa escala reta. O número real vem embaixo de cada coluna.
   Tracejado = o funil inteiro na meta: cada etapa converte a taxa da meta, partindo dos leads (400, 200, 100, 75, 15).
   Entre as colunas fica a taxa da etapa: verde bate a meta, coral fica abaixo. Volume null = coluna ainda sem número (só o tracejado). */
const FUNIL_EXEMPLO = [400, 200, 80, 56, 7];
const COLUNAS = ['Leads', 'Com perfil', 'Agendados', 'Conversas', 'Vendas'];
const LEG_META = '<span class="leg"><i></i>na meta</span>';
function graficoBarras(vol, o){
  o = o || {};
  vol = vol || FUNIL_EXEMPLO;
  const nulo = v => v === null || v === undefined;
  const alvo = [nulo(vol[0]) ? FUNIL_EXEMPLO[0] : vol[0]];
  METAS.forEach((m, i) => alvo.push(alvo[i] * m / 100));
  const maxRaiz = Math.sqrt(Math.max.apply(null, alvo.concat(vol.filter(v => !nulo(v)))));
  const alt = v => Math.sqrt(v) / maxRaiz * 100;
  const taxa = i => (!nulo(vol[i]) && !nulo(vol[i + 1]) && vol[i] > 0) ? vol[i + 1] / vol[i] * 100 : null;
  const baixo = i => taxa(i) !== null && taxa(i) < METAS[i] - 1e-9;
  const slots = COLUNAS.map((nome, i) => {
    const v = vol[i], t = i < 4 ? taxa(i) : null;
    const falta = nulo(v) || alvo[i] > v * 1.001;
    return '<div class="barras__slot' + (i > 0 && baixo(i - 1) ? ' is-abaixo' : '') + '" style="--i:' + i + '">' +
      (falta ? '<span class="barras__meta" style="--g:' + alt(alvo[i]).toFixed(1) + '"></span>' : '') +
      (nulo(v) ? '' : '<span class="barras__col" style="--h:' + alt(v).toFixed(1) + '"></span>') +
      (t === null ? '' : '<span class="barras__taxa' + (baixo(i) ? ' is-abaixo' : '') + '" style="--y:' + ((alt(v) + alt(vol[i + 1])) / 2).toFixed(1) + '">' + pct(t) + '</span>') +
      '</div>';
  }).join('');
  const eixo = COLUNAS.map((nome, i) => '<span><b>' + (nulo(vol[i]) ? '·' : num(vol[i], 0)) + '</b><i>' + nome + '</i></span>').join('');
  const desc = COLUNAS.map((nome, i) => nulo(vol[i]) ? '' : num(vol[i], 0) + ' ' + nome.toLowerCase() + (i && taxa(i - 1) !== null ? ' (' + pct(taxa(i - 1)) + ', meta ' + METAS[i - 1] + '%)' : '')).filter(Boolean).join('; ');
  return '<div class="barras' + (o.fixo ? ' barras--fixo' : '') + '" role="img" aria-label="Gráfico de colunas do funil' + (desc ? ': ' + desc : ', ainda vazio') + '">' +
    '<div class="barras__area">' + slots + '</div><div class="barras__eixo" aria-hidden="true">' + eixo + '</div></div>';
}

    case 'causa3': return [v === 'Não' ? 'Bom sinal: o time dá conta de todos os leads que chegam.' : 'Sobra de lead no fim do dia é sinal de que entra mais lead do que o time consegue atender.', '<strong>Causas</strong> ✓ 3 de 3.'];

/* ··· Dinheiro na mesa da conversa (oferta do plano de 90 dias) ···
   Usa os números da pessoa quando o funil está completo; senão, o mesmo cenário de exemplo do relatório. */
function contaConversa(){
  const f = funilPainel(), est = R.lembra === 'Não';
  if (f && !f.exemplo && f.vol.slice(0, 4).every(v => v > 0) && f.vol[4] !== null) {
    const k = calcular({leads:f.vol[0], n:f.vol.slice(1), ticket:lerNum(R.ticket) || CENARIOS.fraco.ticket});
    if (k.extraV > 0) return {k:k, est:false};
  }
  return {k:calcular(est ? CENARIOS.chute : CENARIOS.fraco), est:est};
}
function perfilConversa(){
  const k = contaConversa().k;
  return k.partes.length ? PERFIS[k.partes[0].i] : PERFIL_OK;
}
function antes(id){
  if (id === 'nome') return [bot('Oi! Sou o ' + fato('grafia_junior') + ' e vou guiar você neste diagnóstico.'), bot('São perguntas sobre sua empresa e seu time de vendas. Leva cerca de 8 minutos, e o relatório sai no final.')];
  if (id === 'chute') return [perg('Se fosse chutar, quantos dos leads com perfil marcam a conversa de venda?'), eu('Menos de ' + METAS[1] + '%')];
  if (id === 'causa') return [bot('Uma coisa chamou atenção no agendamento. São três perguntas rápidas para entender o motivo.')];
  if (id === 'contato') {

    return [bot(n ? 'Pronto, ' + esc(nm()) + '! O painel já mostra ' + n + ' de 4 etapas abaixo da meta.' : 'Pronto, ' + esc(nm()) + '! Pelo painel, as 4 etapas batem a meta.'),
      bot('Falta a leitura: a causa provável e o que fazer em cada etapa, e quanto dinheiro fica na mesa. Quem monta é uma IA treinada no meu jeito de diagnosticar. Tem custo, mas fica por minha conta.')];
  }
  if (id === 'montando') return [bot('Recebido, ' + esc(nm()) + '. Estou montando seu diagnóstico agora.')];

      bot('Por isso, quero preparar um plano de ação de 90 dias para a sua empresa: o que fazer, etapa por etapa, para ir atrás desse dinheiro e instalar um sistema de vendas no seu comercial.'),
      bot(fato('analise_gratuidade', 'frase') + '. Depois, vai custar ' + fato('analise_valor') + '.')
    ];
  }
  if (id === 'video-time') return [
    bot('Agora dá o play neste recado rápido de alguém do meu time.'),
    // Vídeo dentro da conversa (como o T23 do original): 16:9, com som na versão final, não trava nada

      '<button type="button" class="video__play" data-acao="aviso" data-alvo="avisoVideoTime" data-aviso="Placeholder: o vídeo de alguém do time do Junior ainda vai ser gravado. Na versão final ele toca aqui, com som, e não trava nada: a chamada para o WhatsApp fica liberada o tempo todo." aria-label="Assistir ao vídeo de alguém do time do Junior"><span class="play" aria-hidden="true"></span></button>' +
      '<span class="pilula">vídeo · alguém do time do Junior</span></div>' +
      '<p class="cartao__aviso" id="avisoVideoTime" role="status" hidden></p></div>',
    bot('Depois, é só mandar esta mensagem no nosso WhatsApp que o seu plano chega por lá.')
  ];
  return [];
}
function resumoNumeros(){
  const rot = ['leads', 'com perfil', 'agendados', 'conversas', 'vendas'];

const CENARIOS = {
  fraco:{leads:400, n:[200, 80, 56, 7], ticket:15000},
  saudavel:{leads:400, n:[220, 120, 96, 21], ticket:15000},
  // por estimativa: pré-qualificação "mais de 50%" (conta como 50%); as outras "menos de X%", que contam como 70% da meta
  chute:{leads:400, taxas:[50, 35, 52.5, 14], ticket:15000}
};
function calcular(c){
  const n = c.n || c.taxas.reduce((a, t) => a.concat(a[a.length - 1] * t / 100), [c.leads]).slice(1);
  const vol = [c.leads].concat(n);
  const taxas = n.map((v, i) => v / vol[i] * 100);
  const fracas = taxas.map((t, i) => t < METAS[i] ? i : -1).filter(i => i > -1);
  const hoje = Math.floor(n[3] + 1e-9);
  const naMeta = Math.floor(c.leads * taxas.reduce((acc, t, i) => acc * (fracas.indexOf(i) > -1 ? METAS[i] : t) / 100, 1) + 1e-9);
  const extraV = naMeta - hoje, extraR = extraV * c.ticket;
  // ponytail: cada etapa leva uma fatia proporcional a ln(meta/taxa); as fatias somam o total e não dependem da ordem das etapas
  const pesos = fracas.map(i => Math.log(METAS[i] / taxas[i]));
  const soma = pesos.reduce((a, b) => a + b, 0);
  const partes = fracas.map((i, k) => ({i:i, share:pesos[k] / soma, r:extraR * pesos[k] / soma, v:extraV * pesos[k] / soma}))
    .sort((a, b) => Math.round(b.r) - Math.round(a.r) || a.i - b.i); // empate: segue a ordem do funil
  return {vol:vol, taxas:taxas, fracas:fracas, hoje:hoje, naMeta:naMeta, extraV:extraV, extraR:extraR, partes:partes, geral:hoje / c.leads * 100};
}

/* ··· Lead score: a conta (regra em LEAD_SCORE, no topo) ···
   Usa só o que a pessoa respondeu (R), nunca os exemplos do protótipo (EX). */
function dinheiroNaMesaInformado(){
  // "sem números informados": modo chute, número faltando ou valor da venda vazio
  if (R.lembra !== 'Sim') return null;
  const vol = volumesDe(R.nums), ticket = lerNum(R.ticket || '');
  if (!ticket || vol.some(v => v === null) || !vol.slice(0, 4).every(v => v > 0)) return null;
  return Math.max(0, calcular({leads:vol[0], n:vol.slice(1), ticket:ticket}).extraR);
}
function calcularLeadScore(){
  const C = LEAD_SCORE, P = C.pontos, ticket = lerNum(R.ticket || '');
  const porFaixa = (lista, v) => { const f = lista.find(x => v >= x.min); return f ? f.pontos : 0; };
  const daTabela = (tab, v) => tab[v] || 0;
  const eliminatorios = [];
  if (C.eliminatorios.faturamento.indexOf(R.faturamento) > -1) eliminatorios.push('faturamento');
  if (C.eliminatorios.vendedores.indexOf(R.vendedores) > -1) eliminatorios.push('vendedores');
  if (ticket !== null && ticket < C.eliminatorios.valorMedioMinimo) eliminatorios.push('valor-medio');
  const leads = R.lembra === 'Sim' ? lerNum(R.nums[0].v) : null;
  const mesa = dinheiroNaMesaInformado(), custoMensal = fato('preco_avancada') / P.dinheiroNaMesa.divisorDoPreco;
  const V = P.vazamento, temCausas = TELAS.some(t => t.id === 'causa');
  const partes = {
    faturamento: daTabela(P.faturamento, R.faturamento),
    valor_medio: ticket === null ? 0 : porFaixa(P.valorMedio, ticket),
    vendedores: daTabela(P.vendedores, R.vendedores),
    leads: leads === null ? P.leads.naoLembra : porFaixa(P.leads.faixas, leads),
    crm: daTabela(P.crm, R.crm),
    cargo: daTabela(P.cargo, R.cargo),
    dinheiro_na_mesa: mesa === null ? P.dinheiroNaMesa.semNumeros : porFaixa(P.dinheiroNaMesa.faixas, mesa / custoMensal),
    vazamento: temCausas ? Math.min(V.maximo, daTabela(V.causa2, R.causa2) + daTabela(V.causa3, R.causa3) + daTabela(V.causa, R.causa)) : V.semPerguntas
  };
  const nota = Object.keys(partes).reduce((a, k) => a + partes[k], 0);
  const faixa = eliminatorios.length ? 'eliminatorio' : C.faixas.find(f => nota >= f.min).faixa;
  return {nota:nota, faixa:faixa, versao:C.versao, partes:partes, eliminatorios:eliminatorios};
}

// Envio ao garçom (entregas/garcom/, v2): POST na mesma origem, em /api/fim-quiz (#101). Endereço

const ROTA_FIM_QUIZ = '/api/fim-quiz';

/* ··· Motor do protótipo ··· */
const palco = $('#palco');
let atual = null, porFluxo = false, primeira = true;
let aba = 'conversa', sinal = false, empurrao = false, selosAntes = new Set(), novosSelos = [], msgSelo = '';
const timers = [];
const limparTimers = () => { while (timers.length) clearTimeout(timers.pop()); };

function render(t){
  if (t.id === 'capa') return telaCapa();
  if (t.id === 'abertura') return telaAbertura();
  if (t.id === 'erro') return telaErro();
  if (t.id === 'plano-exemplo') return telaPlanoExemplo();
  if (t.rel) return telaRelatorio(t);
  return telaChat(t);
}
function mostrar(id, o){
  o = o || {};
  const t = tela(id) || TELAS[0];
  const vemDaConversa = !!(atual && tela(atual).chat);
  atual = t.id; porFluxo = !!o.fluxo;
  limparTimers();
  $('#avisoSelo').hidden = true;
  // selos novos: só quando a pessoa chega respondendo (não pelo seletor)
  const f = funilPainel();
  const agora = ganhos(f && f.taxas);
  novosSelos = porFluxo && t.chat && vemDaConversa ? SELOS.map(s => s.id).filter(s => agora.has(s) && !selosAntes.has(s)) : [];
  msgSelo = novosSelos.length && selosAntes.size === 0 ? 'Boa, ' + esc(nm()) + ': primeiro selo conquistado. Ele fica guardado no painel.' : '';
  if (t.chat) selosAntes = agora; // páginas fora da conversa (ex.: exemplo do plano) não zeram os selos já vistos
  if (porFluxo && t.chat) { aba = 'conversa'; if (t.id !== 'nome') sinal = true; }
  palco.innerHTML = render(t);
  palco.className = t.chat ? 'palco' : 'palco entra';
  document.body.dataset.largura = t.largura || (t.chat ? 'sala' : 'coluna');
  document.body.dataset.aba = aba;
  document.body.toggleAttribute('data-analisando', t.id === 'montando');
  topo(t); protoMarcar(t);
  try { history.replaceState(null, '', '#' + t.id); } catch (e) {}
  const focar = !primeira; primeira = false;
  if (t.chat) conversar(focar);
  else { window.scrollTo(0, 0); const fo = document.getElementById('foco'); if (focar && fo) fo.focus({preventScroll:true}); }
  if (t.id === 'numeros') atualizarLivro();
  if (t.id === 'contato') validarContato();
  if (t.id === 'montando') { montar(); girar(); }
}
function proximaDe(id){
  if (id === 'lembra') return val('lembra') === 'Não' ? 'chute' : 'numeros';
  if (id === 'numeros' || id === 'chute') return 'causa';
  if (id === 'montando') {
    // funil saudável: relatório de crescimento. Quem não se qualifica: relatório com "Tenho interesse" (regra 5).
    // Qualificado com etapa abaixo da meta: oferta do plano de ação de 90 dias, na conversa
    const f = funilPainel(), saud = !!f && !f.exemplo && f.taxas.every((v, i) => v !== null && v >= METAS[i]);
    if (saud) return 'relatorio-saudavel' + (qualificadoFim() ? '' : '-nao');
    return qualificadoFim() ? 'plano' : 'relatorio-nao';
  }
  if (id === 'plano') return val('plano') === 'Quero ver como é' ? 'plano-exemplo' : 'video-time';
  if (id === 'plano-exemplo') return 'video-time';
  const i = TELAS.findIndex(x => x.id === id);
  return TELAS[Math.min(i + 1, TELAS.length - 1)].id;
}
