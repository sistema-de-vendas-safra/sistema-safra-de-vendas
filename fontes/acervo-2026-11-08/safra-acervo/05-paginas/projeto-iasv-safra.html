/"},{t:"é só acessar o youtube ou o instagram do Pablo Marçal que você encontra os mesmos conteúdos.",a:"Cliente em Teutônia (RS)",contra:"Marçal Digital",produto:"mentoria O Jogo da Vida",quando:"abr. 2023",status:"Em réplica",url:"https://www.reclameaqui.com.br/loja-pablo-marcal/mentoria-o-jogo-da-vida-pior-ano-enganoso_mI2NuRDorycQwZHu/"}],ar=["Na venda consultiva, muita gente leva 60 ou 90 dias para decidir. É quem precisa falar com o sócio, quem pediu um tempo, quem compra caro e decide devagar.","Aí o mês vira, a meta zera e o time corre atrás dos leads novos. Quem não comprou fica para trás sem ter dito não. E você já pagou por esse contato: no anúncio, no evento, no tempo do seu time."],at=[{t:"Cada mês vira uma safra",d:"Os leads de julho são acompanhados juntos, separados dos de agosto, e você sabe qual mês rendeu e qual travou."},{t:"Cada safra tem prazo",d:"O prazo sai dos números do seu negócio (na operação do Júnior, são 90 dias). Até ele acabar, ninguém larga o lead."},{t:"Cada etapa tem meta",d:"Lead qualificado, reunião marcada, reunião realizada e venda. Quando a safra trava, você vê em qual etapa, em vez de descobrir só que o mês foi ruim."},{t:"Perdido é só quem disse não",d:"Quem não respondeu continua na lista, com data marcada para o próximo contato."}],an=[{k:"Produto",v:"Implementação Avançada do Sistema de Vendas Safra, 90 dias e 8 entregas. É implementação, dentro do comercial do cliente, nunca mentoria nem curso"},{k:"Preço",v:"R$ 45 mil para as 10 primeiras vagas; depois, R$ 60 mil"},{k:"Continuidade",v:"GSAAS (Gestão de Safra as a Service), opcional: manutenção do CRM e do painel e a Mecanização da Safra, os agentes de IA; níveis e preço em aberto (hipótese: R$ 15 mil por mês)"},{k:"Colheita",v:"Feita pelo time do cliente"},{k:"Análise Estratégica das Safras",v:"A versão da call, a mesma para todos os públicos: valor de R$ 4.997, gratuita para as 10 primeiras vagas e cobrada por R$ 4.997 depois da 10ª venda"},{k:"Promessa e garantia",v:"Promessa pública decidida. Nenhuma promessa em contrato: nenhum resultado, meta ou métrica prometido nem garantido; o contrato traz só o escopo"},{k:"Vagas",v:"As 10 primeiras vendas da Avançada, a R$ 45 mil (vendas da Essencial não contam); a data de início de cada cliente está em aberto"},{k:"Bônus",v:"Curso gravado do Júnior; Análise Estratégica da base de clientes; sessão extra com o Júnior para quem autorizar virar caso documentado"},{k:"Pagamento",v:"Pela Hotmart, à vista ou parcelado; forma de pagamento a definir (proposta: R$ 45 mil à vista ou 6x de R$ 8.250)"},{k:"Dono que fecha sozinho",v:"Sem adicional"},{k:"Segunda compra",v:"Safra de clientes proposta ao Júnior para entrar no método"},{k:"Downsell",v:"Implementação Essencial, por R$ 22.500: entregas 1, 3, 6 e 7 e o curso gravado, em 13 semanas, com acesso ao GSAAS depois; oferecida só depois do não à Avançada"}],as={1:"Os seus últimos meses de leads, separados pelo mês em que cada um chegou. Mostra em que etapa cada safra travou, quantos leads ainda não disseram não e quanto tempo o seu cliente leva para decidir. É nela que você aprova a meta de cada etapa para o seu time.",2:"O seu CRM organizado para mostrar de que mês é cada lead, em que etapa está e como anda a conversa. Ninguém vira perdido sem dizer não.",3:"A régua de contato e os roteiros: quantas tentativas fazer, em que intervalo e com que mensagem, com data marcada para cada contato.",4:"Os leads antigos que nunca disseram não, em ordem de prioridade, retomados pelo seu time com a régua e os roteiros do Playbook de Comunicação Persuasiva.",5:"Uma tela que se atualiza sozinha, com cada safra, etapa e vendedor e o prazo de cada safra à vista.",6:"Oito reuniões de uma hora com o gerente de safra da Triad, para decidir onde o time põe força, e duas calls de venda analisadas por semana.",7:"O jeito de operar, por escrito, para o seu time seguir com ou sem a Triad.",8:"O Júnior apresenta as safras antigas comparadas com o número de antes, os indicadores das novas e a data em que cada uma termina."},ai=[{nome:"Curso gravado do Júnior",d:"As aulas de etapas e métricas que o Júnior já tem, liberadas para o seu time, como apoio para vendedor novo."},{nome:"Análise Estratégica da base de clientes",d:"A mesma análise, feita na semana 12 sobre quem já comprou, para achar quem pode comprar de novo."},{nome:"Sessão extra com o Júnior",d:"Uma sessão individual de estratégia comercial, além dos três encontros, para quem autoriza virar caso documentado."}],al={nome:"Antes da compra: a Análise Estratégica das Safras",d:"Na própria call, em 30 a 45 minutos, você traz os números da sua última safra e sai sabendo em que etapa ela travou. É a mesma para todos e tem valor de R$ 4.997: gratuita para as 10 primeiras vagas, cobrada por esse valor depois da 10ª venda."},ad={nome:"Depois dos 90 dias: o GSAAS",d:"Gestão de Safra as a Service, por assinatura e opcional. As safras novas só fecham no quarto ou quinto mês, e a Triad segue cuidando delas até o fim do prazo, com reunião semanal, calls analisadas, relatório mensal e a manutenção do CRM e do painel. Inclui a Mecanização da Safra: agentes de IA para o lembrete de reunião, o acompanhamento por WhatsApp e a tarefa do dia de cada vendedor."},ac=[{k:"Agência",v:"Triad"},{k:"Sistema (nome público)",v:"Sistema de Vendas Safra: mentalidade de vendas, inteligência humana, de mercado e artificial, processos, dados e tecnologia"},{k:"Método proprietário",v:"Gestão de Leads por Safra"},{k:"Produto de 90 dias",v:"Implementação Avançada do Sistema de Vendas Safra"},{k:"Continuidade",v:"GSAAS (Gestão de Safra as a Service), que inclui a Mecanização da Safra (os agentes de IA)"},{k:"Diagnóstico e porta de entrada",v:"Análise Estratégica das Safras"},{k:"Entregas",v:"Análise Estratégica das Safras, Implementação da Infraestrutura, Playbook de Comunicação Persuasiva, Recuperação de Ativos, Painel de Safras, Treinamento para Otimização da Conversão, Playbook da Gestão de Vendas por Safra e Relatório de Produtividade. A analogia da horta fica na descrição de cada uma, nunca no nome"},{k:"Downsell",v:"Implementação Essencial do Sistema de Vendas Safra: entregas 1, 3, 6 e 7, em 13 semanas, por R$ 22.500, com o curso gravado e acesso ao GSAAS, oferecida só depois do não à Avançada"},{k:"Problema",v:"Gestão Mensal de Leads"},{k:"Fora de uso público",v:"“Método Safra” e “Gestão por Safra”"}],am=[{k:"Postura",v:"O “vendedor chato”: não larga o lead antes do não nem antes do fim do relógio, com data marcada para cada contato."},{k:"Marçal",v:"Só na narrativa da história do Júnior, nunca como aval."},{k:"Grafia pública",v:"“Junior Neves”, sem acento. As peças seguem a voz do Júnior."}],au=["“mentoria”, “curso” ou “ensinar” para a oferta, que é implementação","“Treinamento” e “Playbook” fora dos nomes das entregas","“de R$ 60 mil por R$ 45 mil”","“10x”","os 4% como “métrica de mercado”","o sistema como invenção inédita","aval do Marçal","tema político","totais autodeclarados","as frases gastas do mercado","CRM e “lead mais caro” na Big Idea","meta, métrica ou resultado ligado ao contrato (“metas aprovadas pelo dono”, nunca “metas assinadas”)","o 95% da analogia, enquanto não tiver fonte","“safra” (fora do nome do sistema), “colheita”, “plantio” e “relógio” em promessas, títulos e chamadas antes de o mecanismo ser explicado"],ap=[{k:"Safra",v:"Os leads de um mês de captação, acompanhados juntos."},{k:"Maturação e relógio",v:"O prazo de cada lead para decidir: 90 dias no Júnior, contados do dia em que ele entra, e variável por negócio."},{k:"Estágio",v:"A posição no funil. Só avança."},{k:"Estado",v:"A situação do contato: conversando, tentativa, abandonado, stand-by ou perdido."},{k:"Perdido",v:"Só quem disse não."},{k:"Gestão Mensal de Leads",v:"O problema: o mês vira a régua de tudo, inclusive do lead, e o relatório soma leads de idades diferentes."},{k:"Sistema de Vendas Safra",v:"A solução: o sistema inteiro (mentalidade de vendas, inteligência humana, de mercado e artificial, processos, dados e tecnologia), com a Gestão de Leads por Safra no centro."},{k:"Gestão de Leads por Safra",v:"O método proprietário do sistema: cada mês de captação vira uma safra, com prazo para amadurecer e meta em cada etapa."},{k:"Implementação Avançada do Sistema de Vendas Safra",v:"O produto de 90 dias e 8 entregas (IASV Safra). É implementação, nunca mentoria nem curso."},{k:"Downsell",v:"A segunda opção da oferta, apresentada só a quem disse não à Avançada, na call. Nunca em página, anúncio ou e-mail."},{k:"Implementação Essencial",v:"O downsell: as entregas 1, 3, 6 e 7, sem a tecnologia, com o curso gravado do Júnior, em 13 semanas, por R$ 22.500. Dá acesso ao GSAAS depois."},{k:"GSAAS",v:"Gestão de Safra as a Service: a continuidade por assinatura, que cuida das safras novas depois dos 90 dias, com a manutenção do CRM e do painel e a Mecanização da Safra."},{k:"Mecanização da Safra",v:"Parte do GSAAS: os agentes de IA de lembrete de reunião, acompanhamento por WhatsApp e tarefa diária do vendedor. A implementação não instala os agentes."},{k:"Análise Estratégica das Safras",v:"O diagnóstico (etapa e entrega 1). Na porta de entrada, é a versão da call, a mesma para todos os públicos: valor de R$ 4.997, gratuita para as 10 primeiras vagas e cobrada por esse valor depois da 10ª venda. A completa, com documento e painel, é a entrega 1 da implementação."},{k:"Implementação da Infraestrutura",v:"Entrega 2: o CRM organizado por safra; cada lead com safra, etapa e situação."},{k:"Playbook de Comunicação Persuasiva",v:"Entrega 3: a régua de contato e os roteiros."},{k:"Recuperação de Ativos",v:"Entrega 4: os leads das safras antigas que nunca disseram não, em ordem de prioridade, retomados pelo time do cliente com o Playbook de Comunicação Persuasiva."},{k:"Painel de Safras",v:"Entrega 5: cada safra, etapa e vendedor, com o relógio à vista."},{k:"Treinamento para Otimização da Conversão",v:"Entrega 6: a reunião semanal de safra e a análise de calls."},{k:"Playbook da Gestão de Vendas por Safra",v:"Entrega 7: o jeito de operar, por escrito, para o time seguir sozinho depois dos 90 dias. Na Essencial, chega em duas versões: a de partida e a final."},{k:"Relatório de Produtividade",v:"Entrega 8: as safras antigas comparadas com o número de antes e os indicadores das novas, apresentados pelo Júnior."},{k:"Rúcula, morango e melancia",v:"A analogia da Big Idea: rúcula em 30 dias, morango em 60, melancia em 90. Quase todo comercial só colhe a rúcula. A horta também aparece na descrição de cada entrega, nunca no nome."},{k:"Gerente de safra",v:"Quem conduz o rito semanal do cliente."},{k:"Impressora 3D",v:"A tese do Júnior: o negócio é a máquina de vender."},{k:"Vendedor chato",v:"A postura adotada: persistência com data, sem pressão."},{k:"Rafa, o Dono-Closer",v:"A persona do comprador."}],af={t:"Como é que eu metrifico e digo que o meu time foi bom em vendas no primeiro, no segundo, no terceiro, no quarto mês?",a:"Júnior",ref:"a pergunta que originou o método"},ah=["O relatório do mês mistura leads de idades diferentes, e por isso não diz se o time foi bom.","Uma venda fechada em outubro pode vir de um lead de julho, agosto, setembro ou outubro. Somadas no mês, essas vendas escondem qual safra rendeu, qual travou e em que etapa. Sem essa separação, a conclusão costuma ser genérica: “o time precisa vender mais”."],ag={t:"aquele mês que do nada ninguém sabe explicar",a:"Thiago Reis"},ax=[{a:"Semente",b:"Lead captado"},{a:"Plantio",b:"Entrada do lead na operação"},{a:"Período de cultivo",b:"Tempo de trabalho comercial até o fechamento"},{a:"Colheita",b:"Venda"},{a:"Safra",b:"Grupo de leads captados numa mesma janela"},{a:"Tempo de maturação",b:"Prazo esperado para avaliar a conversão daquela safra"}],av=[{el:"Safra",regra:"O grupo de leads captados em um mês",jr:"Julho de 2026: 989 leads"},{el:"Relógio de maturação",regra:"Prazo de cada lead para decidir, contado do dia em que ele entra, o dia do plantio; varia por negócio",jr:"90 dias desde o dia em que o lead entra. Os leads de julho fecham entre 29/09 e 29/10: quem entrou em 15/07 fecha em 13/10"},{el:"Estágio",regra:"Posição no funil, que só avança: captado, pré-qualificado, agendado, realizado, venda",jr:"Os cinco estágios do painel"},{el:"Estado",regra:"Situação do contato: conversando, tentativa, abandonado, stand-by ou perdido. Perdido só quando o lead diz não",jr:"“Perdido é quem falou não”"},{el:"Metas por etapa",regra:"Taxa mínima esperada em cada passagem do funil",jr:"50% pré-qualificam, 50% agendam, 75% comparecem, 20% fecham"},{el:"Leitura de trás para frente",regra:"Começa no fechamento e recua até a etapa que quebrou",jr:"“Eu sempre tenho que olhar de trás para frente”"}],ab=["Como está cada safra?","Quanto tempo resta para a maturação dela?","Quais metas intermediárias já foram atingidas?","Em qual etapa as oportunidades estão paradas?","Onde concentrar o esforço comercial agora?"],ay=[{etapa:"Pré-qualificação",meta:.5,de:"dos captados"},{etapa:"Agendamento",meta:.5,de:"dos pré-qualificados"},{etapa:"Comparecimento",meta:.75,de:"dos agendados"},{etapa:"Fechamento",meta:.2,de:"das reuniões realizadas"}],aj="Safra de julho, clube de compra de imóveis de leilão nos EUA",ak=989,aN=[{etapa:"Pré-qualificação",real:.128,meta:.5,nota:"127 de 989"},{etapa:"Agendamento",real:.16,meta:.5,nota:""},{etapa:"Comparecimento",real:null,meta:.75,nota:"sem número nas fontes"},{etapa:"Fechamento sobre reuniões realizadas",real:.36,meta:.2,nota:""}],aw="O fechamento passa da meta e a pré-qualificação fica bem abaixo. Em vez de “o time precisa vender mais”, o diagnóstico aponta uma etapa. Depois de reduzir a verba de campanha, o Júnior observou melhora na pré-qualificação.",aS=[{t:"Prova que a leitura por safra localiza a etapa que quebra, numa operação real."},{t:"Não prova resultado em cliente: a leitura por safra ainda é experimental e rodou numa operação só."},{t:"A safra de julho fecha por inteiro em 29/10, quando o último lead de julho completa 90 dias. O fechamento documentado, com números por etapa e print do painel, é a primeira prova publicável. Uso público não obrigatório."},{t:"Os 127 têm duas leituras nas fontes: total de pré-qualificados ou pré-qualificados que não agendaram. Confirmar com o Júnior antes de usar.",g:"nao-avaliavel"}],aq=[{quem:"Growth Machine e Thiago Reis",problema:"“O gargalo nunca foi o topo do funil. É o que acontece depois que o lead entra.”",instalam:"Método 3E; 10X IA com 3 dias de Arena e 6 meses de operação assistida coletiva; SDR por IA",difere:"Leem o mês e o funil; o blog pergunta pelos “leads que já entraram este mês”, sem relógio nem método. Prometem na página e se declaram “obrigação de meio” nos termos."},{quem:"Full Sales System",problema:"“O problema da sua empresa é estrutural, não comportamental.”",instalam:"6 engrenagens, 47 protocolos e um Squad em 12 meses; estrategista dedicado só no plano de topo",difere:"Monta a estrutura inteira, de marketing a RH, sem unidade de leitura no tempo. O Safra é mais estreito e mede cada safra."},{quem:"Lucas Torres (Legacy)",problema:"“Marketing gera oportunidades. Vendas não converte na proporção.”",instalam:"Arquitetura de posicionamento, marca e psicologia da decisão, com condução “até rodar”",difere:"Mecanismo psicológico e de marca. O Safra é operacional e mensurável por etapa; posicionamento fica fora do escopo."},{quem:"DMB (Giovanne Saraiva)",problema:"“Do lead em diante, ninguém conta.”",instalam:"“Implementadora comercial”: conta de trás pra frente e previsão por prazo de cada negócio, ensinadas em grupo",difere:"O mais próximo: tangencia o relógio, mas por negócio, sem coorte. O Safra agrupa por mês de entrada, com sênior nomeado."},{quem:"Diego Vicente (MMV)",problema:"“Seu lead não é o problema.” A rotina é",instalam:"Meta por vendedor, daily, SDR e gerente por IA, evento de 2 dias com Marçal",difere:"Controla a atividade do vendedor; o Safra controla a maturação do lead. IA é meio, não promessa de evento."},{quem:"Antônio da Silva",problema:"Vendedor mediano, falta de processo, conteúdo errado",instalam:"Coloca a empresa no ecossistema dele e vende por ela",difere:"Ele vende pelo cliente; o Safra instala no time do cliente e entrega dados e playbook na saída."}],aA=[{t:"**Novo para o mercado, não para o mundo.** Análise por coorte é prática conhecida de analytics nos EUA. Não alegar invenção inédita."},{t:"**Leitura experimental.** A organização por safras rodou numa operação só, a do Júnior. Falta [PROVA REAL: caso de empresa terceira ao fim de uma safra, com números por etapa e autorização]."},{t:"**O relógio é de cada negócio.** Os 90 dias são da operação do leilão; cada cliente calibra o seu na Análise Estratégica das Safras."},{t:"**Volume mínimo.** Com menos de cerca de 100 leads por mês, a leitura por etapa fica ruidosa.",g:"indicativa"},{t:"**Nome.** “Safra” colide com o Banco Safra na busca. O INPI está fora de pauta por ora."},{t:"**Instalar, não ensinar.** O método não é curso nem mentoria. O curso gravado do Júnior cobre etapas e métricas, não a safra."},{t:"**Persistência com data, sem pressão.** A postura é a do “vendedor chato”: não larga o lead antes do não nem antes do fim do relógio, com data marcada para cada contato. O relógio organiza o follow-up, não autoriza cobrar o lead."}],aE=["máquina de vendas","de trás para frente (como nome)","o problema não é lead (como título)","implementadora","arquitetura de vendas","sem letra miúda","previsibilidade sem número ao lado","IA como manchete","os 4% como métrica de mercado"],aC=["safra","relógio","maturação","plantio","colheita","adubo","cultivo","manejo","o lead é a semente","perdido é quem falou não"],az="Gestão Mensal de Leads",aP="nome decidido",aO="O mês vira a régua de tudo, inclusive do lead: o relatório mistura leads de meses diferentes, esconde a etapa que quebrou e larga o lead antes de ele amadurecer.",aR="Nomeia a prática, não o sintoma: o dono se reconhece nela sem se sentir acusado, porque quase todo comercial é gerido assim.",aT="Sistema de Vendas Safra",aM="nome público",aI="O sistema inteiro, com a Gestão de Leads por Safra como método proprietário: cada mês de leads vira uma safra, com prazo para amadurecer (90 dias na operação do Júnior) e meta em cada etapa.",aD="O mercado está entre o estágio 4 e o 5 de sofisticação (forte): todo concorrente tem método, e o público reage com cinismo. O comprador também chega queimado: das 35 vozes da persona, 28 são reclamações ou processos contra quem vendeu para ele.",a_=[{t:"Nomear o mecanismo é o piso do estágio 4: o Sistema de Vendas Safra vai na primeira linha da promessa."},{t:"Nomear não basta: no estágio 5, só corta o ruído o mecanismo demonstrado. A demonstração é a leitura da última safra do próprio prospect, na call."},{t:"A camada de identidade do estágio 5 é o dono que quer ser medido por venda. Ela entra pela Análise Estratégica e pela medição à vista no Relatório de Produtividade, sem nenhuma promessa em contrato."}],aL=[{tentativa:"Agência e mais lead",fala:"Alcance e impressão não pagam boletos; o combinado eram LEADS qualificados e vendas.",ref:"clínica no interior da Bahia, no Reclame Aqui",mes:"Volume de lead subindo; venda que não veio"},{tentativa:"SDR por IA",fala:"A afirmação de que a SDR IA fecharia no mínimo 10 contratos por mês. A realidade foi completamente diferente.",ref:"empresa de Belo Horizonte, no Reclame Aqui",mes:"Uma meta mensal de contratos"},{tentativa:"Imersão e mentoria",fala:"Superficial, genérico e completamente inútil para a aplicação prática.",ref:"CEO em Salvador, no Reclame Aqui",mes:"Nada mudou no mês seguinte"},{tentativa:"Assessoria comercial",fala:"A assessoria se resume a 2 reuniões mensais que não levam a lugar nenhum de 30 minutos cada uma.",ref:"empresa de Altinópolis, no Reclame Aqui",mes:"Reunião sem número de etapa"},{tentativa:"Ficar fechando sozinho",fala:"Eu sou o CEO e sou o melhor vendedor da empresa.",ref:"CEO de empresa de cerca de R$ 220 mil por mês",mes:"O mês depende dele"}],a$=[{t:"não é porque você fez 'seis em sete' uma vez que fará sempre",a:"Professora que chegou a 12 funcionários e terminou com dívidas",ref:"o caixa oscila"},{t:"De início, tudo bem, porém, a partir de uns 3 meses começaram os problemas.",a:"Cliente de Uberaba, no Reclame Aqui",ref:"o fornecedor desanda perto do terceiro mês"}],aF=["Uma unidade de leitura: a safra, o grupo de leads de um mês.","Um relógio: prazo de maturação de cada lead, contado do dia em que ele entra, o dia do plantio.","Uma regra de saída: o lead só é perdido quando diz não.","Metas por etapa e leitura de trás para frente.","Um painel em uso desde julho de 2026 na operação de leilão do Júnior."],aV=[{quem:"Growth Machine e Thiago Reis",causa:"“Seu vendedor não está improdutivo, o seu processo está”",regua:"Meta mensal; “algo próximo de 600 mil” por mês para 120 vendas"},{quem:"Full Sales System",causa:"“O problema da sua empresa é estrutural, não comportamental.”",regua:"Indicadores “em 30 a 60 dias”"},{quem:"Lucas Torres",causa:"Arquitetura: “Se resolve com arquitetura.”",regua:"Sintoma descrito: “o fechamento segue imprevisível de um mês para o outro”"},{quem:"DMB",causa:"“Do lead em diante, ninguém conta.”",regua:"“8 reuniões até o dia 30”; previsão por prazo de cada negócio"},{quem:"Diego Vicente",causa:"“O problema quase nunca é o vendedor. É a rotina.”",regua:"Meta mensal por vendedor"}],aG=[{t:"**Onde a venda quebrou.** O dono vê o total cair e não sabe de qual safra nem de qual etapa. A conclusão vira “o time precisa vender mais” ou “o tráfego ficou caro”."},{t:"**O lead que ainda estava amadurecendo.** Quando o mês vira, a atenção vai para os leads novos. O lead de 45 dias sai da mesa sem ter dito não, e a mídia que o comprou fica no campo. Confirmar nos dados dos fundadores.",g:"indicativa"},{t:"**Quem merece o crédito.** Nos primeiros meses de um fornecedor novo, as vendas vêm de leads que entraram antes dele; as safras dele só amadurecem perto do terceiro mês. A conta explica o padrão “a partir de uns 3 meses começaram os problemas”. Confirmar nas entrevistas.",g:"indicativa"}],aB=[{k:"Absolve",v:"Não é o time, nem o tráfego, nem só a escolha errada de fornecedor. É a Gestão Mensal de Leads, a régua que mistura as safras. Desmonta “meu time não segue processo” e “o problema é o tráfego caro”."},{k:"Dá esperança",v:"Os leads já pagos das últimas safras ainda estão no campo, e a etapa que quebra aparece com os números que o dono já tem."},{k:"Desqualifica sem atacar",v:"Os concorrentes trocam o processo, mas continuam julgando pelo mês: instalam engrenagem nova e medem com a régua velha."}],aU=[{k:"Problema externo",titulo:"O que ela faz com os números",resumo:"Vende num mês, não vende no outro, compra mais lead para compensar e não sabe por quê.",problemas:[{t:"O lead pago sai da mesa na virada do mês, sem ter dito não.",g:"indicativa"},{t:"As vendas oscilam sem explicação.",g:"moderada"},{t:"Ninguém sabe em que etapa a venda trava: o relatório soma as safras.",g:"forte"},{t:"O custo por venda sobe, e a resposta é comprar mais lead.",g:"indicativa"},{t:"O crédito vai para a safra errada, e o fornecedor desanda no terceiro mês.",g:"indicativa"},{t:"A recompra some do radar.",g:"nao-avaliavel"}],falas:[{t:"aquele mês que do nada ninguém sabe explicar",a:"Thiago Reis, da Growth Machine",ref:"vídeo no Instagram"}],cascata:[{k:"No mês",v:"A meta é perseguida com lead novo. O lead de 30 a 90 dias sai da mesa, e a verba que o comprou vira custo sem retorno. No relatório, isso aparece como “lead frio”."},{k:"No trimestre",v:"Compra-se mais lead para repor as vendas abandonadas. O custo por venda sobe, a margem cai, e as decisões miram o motivo errado: corta-se a campanha que amadurecia e troca-se o fornecedor justo quando as safras dele iam fechar."},{k:"No ano",v:"O negócio entra numa esteira: precisa de cada vez mais lead para vender o mesmo, a base já paga envelhece no CRM e o dono não consegue planejar o ano seguinte."}]},{k:"Problema interno",titulo:"O que ela faz o dono sentir",resumo:"Ele não sente “gestão mensal”. Sente que paga por algo que some, que está sozinho e que nada do que compra funciona.",problemas:[{t:"Desperdício e impotência: paga por lead e não sabe onde ele morre.",g:"forte"},{t:"Insegurança com o caixa: nunca sabe se o mês fecha.",g:"moderada"},{t:"Solidão: se ninguém sustenta o lead até o fim, a venda grande volta para ele.",g:"indicativa"},{t:"Desconfiança: cada fornecedor novo, julgado pelo mês, decepciona perto do terceiro mês.",g:"moderada"},{t:"Culpa e vergonha: passa a achar que o problema é ele ou o time, e esconde dos pares.",g:"indicativa"}],reclamacoes:[{t:"Está parecendo jogo do Tigrinho do Marketing!",a:"Clínica em Xique-Xique (BA)",contra:"V4 Company",produto:"assessoria de marketing",quando:"ago. 2025",status:"Em réplica",url:"https://www.reclameaqui.com.br/v4-company/v4-company-denunciada-promessa-de-marketing-virou-digital-r-53-mil-de_HlWWZIjVYPSQt_rt/"},{t:"não gostaria de expor essa experiência",a:"Empresa de infoproduto em São José dos Campos (SP)",contra:"V4 Company",produto:"assessoria de marketing",quando:"dez. 2023",status:"Resolvido",url:"https://www.reclameaqui.com.br/v4-company/pegaram-meu-dinheiro-e-nao-entregaram-nada_LK9gBlzhVGfXmPiy/"}],cascata:[{k:"Nas decisões",v:"Decide sob a pressão do fim do mês: dá desconto para fechar, aperta o time no dia 25, compra lead no dia 1. Cada decisão alivia o mês e piora o trimestre."},{k:"Nas relações",v:"Desconfia do time, e o time passa a trabalhar para a reunião do mês, não para o lead. O vendedor bom cansa e sai. Com fornecedores, o ciclo se repete: chega, decepciona perto do terceiro mês e é trocado."},{k:"Na identidade",v:"Queria ser empresário e continua operador, sem conseguir se ausentar. E fica cínico: passa a duvidar de qualquer método, inclusive do que resolveria o problema. É o custo mais alto."}]},{k:"Problema filosófico",titulo:"Por que isso é errado",resumo:"Dá ao dono uma causa maior que a dor dele e dá à Triad um ponto de vista para defender em público.",frase:"O lead não é perdido porque o mês acabou. Perdido é quem disse não.",fraseNota:"Nasce da regra do Júnior, “perdido é quem falou não”, e casa com a frase-assinatura da promessa.",outras:["Ninguém deveria pagar duas vezes pela mesma venda.","O tempo de decisão é do cliente, não do calendário.","Ninguém deveria ser julgado por uma régua que mistura safras: nem o vendedor, nem o fornecedor, nem o dono."],cascata:[{k:"Na cultura do comercial",v:"Se o lead vence no fim do mês, o vendedor pressiona até o dia 30 e abandona no dia 1: as duas coisas que o comprador rejeita. A postura do “vendedor chato” é o oposto das duas."},{k:"No mercado",v:"A categoria normaliza o desperdício: o lead vira descartável, “lead frio” vira desculpa, e a solução vendida é sempre mais lead, mais processo ou mais IA, medidos pelo mês."},{k:"No dono",v:"Ele internaliza a régua: se não vendeu no mês, a culpa é dele ou do time. É essa crença que a Big Idea desmonta: “Você já pagou pelas suas próximas vendas.”"}]}],aW=[{c:"externo",t:"O mês vira, e o lead que não decidiu sai da mesa."},{c:"externo",t:"As vendas oscilam, e o dono compra mais lead ou aperta o time."},{c:"interno",t:"Ele se sente sozinho, desconfiado e culpado."},{c:"externo e interno",t:"Chama ajuda de fora, que é julgada pela mesma régua e decepciona perto do terceiro mês."},{c:"filosófico",t:"Conclui que o problema é ele, o time ou o tráfego, e volta a gerir pelo mês."}],aH=[{k:"Separar",v:"Cada mês de captação vira uma safra, inclusive as dos últimos 3 a 6 meses, reconstruídas a partir do export do CRM ou da planilha."},{k:"Dar relógio",v:"Cada safra ganha um prazo de maturação calibrado com os dados do negócio. O lead só vira perdido quando diz não."},{k:"Pôr meta em cada etapa",v:"Pré-qualificação, agendamento, comparecimento e fechamento ganham um piso, aprovado pelo dono como linha de base na Análise Estratégica."},{k:"Ler de trás para frente",v:"Do fechamento até a etapa que quebrou, safra por safra."},{k:"Trabalhar a safra antes do prazo",v:"O rito semanal leva o esforço para a safra perto do fim e abaixo da meta."}],aQ=[{esconde:"Onde a venda quebrou",mostra:"A etapa e a safra, lidas de trás para frente"},{esconde:"O lead ainda amadurecendo",mostra:"O relógio de cada safra e o lead que ainda não disse não"},{esconde:"Quem merece o crédito",mostra:"O resultado de cada safra no fim do seu próprio prazo"}],aJ=[{af:"O relatório do mês mistura safras",tipo:"Lógica: o desenho das safras sobrepostas e a conta do relógio",hoje:"Existe",falta:"Nada"},{af:"Dá para ver em qual safra e etapa a venda quebra",tipo:"Demonstração: painel do leilão, safra de julho",hoje:"Parcial",falta:"[PROVA REAL: print da safra de julho fechada em 29/10, com números por etapa e autorização do Júnior]"},{af:"Funciona com os números do prospect",tipo:"Demonstração ao vivo: a versão rápida da Análise Estratégica da última safra dele, na call",hoje:"Desenhada",falta:"Planilha e roteiro da versão rápida"},{af:"Há dinheiro parado em lead que não disse não",tipo:"Demonstração: pré-qualificados de julho que não agendaram",hoje:"Parcial",falta:"Confirmar os 127 com o Júnior; [PROVA REAL: receita recuperada de leads dados como perdidos num cliente fundador]"},{af:"Funciona fora da operação do Júnior",tipo:"Social: caso com nome e número",hoje:"Não existe",falta:"[PROVA REAL: caso de cliente fundador ao fim de uma safra, com números por etapa e autorização]"},{af:"Não é invenção de guru",tipo:"Autoridade externa: análise de coorte é prática conhecida de analytics",hoje:"Achado sem citação",falta:"Uma fonte publicável sobre análise de coorte"},{af:"Quem criou usa",tipo:"Origem: o método nasceu de uma pergunta do Júnior na própria operação",hoje:"Existe",falta:"Nada; responde ao critério “vocês usam o que vendem?”"},{af:"As regras são reais",tipo:"Processo: estados, régua de contato, stand-by com data, perdido só com um não",hoje:"Existe",falta:"Nada"},{af:"Os outros falharam por medir pelo mês",tipo:"Reversa: a conta do terceiro mês",hoje:"Lógica pronta",falta:"Confirmar nas 8 a 10 entrevistas"}],aX=["Mostra em qual etapa a sua venda quebrou, com os seus números.","O seu lead só é perdido quando diz não."],aK=["Aumento de conversão ou de faturamento.","Percentual de receita recuperada.","Qualquer número de melhora antes dos primeiros casos (CONAR)."],aY="Você vai vender mais.",aZ="Traga os números dos seus últimos três meses. A gente mostra onde a sua venda travou e quanto ainda dá para vender.",a0="É a chamada da Análise Estratégica, dentro da regra de vocabulário.",a1=[{t:"O sintoma, na voz do comprador: um mês bom e outro ruim, e o fornecedor que desanda perto do terceiro mês."},{t:"As causas que ele já pagou para resolver: mais lead, tráfego, time, processo novo."},{t:"Gestão Mensal de Leads, nomeada e mostrada no desenho."},{t:"O custo, nas três camadas: o lead pago morrendo antes de amadurecer e a conta do terceiro mês; o dono sozinho, desconfiado e sem controle do caixa; “perdido é quem disse não”."},{t:"Sistema de Vendas Safra, nomeado antes de ser descrito, depois da rúcula, do morango e da melancia."},{t:"As etapas, com especificidade: relógio, estados, meta por etapa."},{t:"A prova: o painel do leilão e, depois, os casos dos fundadores."},{t:"O benefício e a medição à vista no Relatório de Produtividade."},{t:"A chamada para a Análise Estratégica das Safras, a porta de entrada."}],a2=12,a3=15,a5=["Prova social de cliente: depende dos fundadores.","Padrão do terceiro mês confirmado pelo comprador: depende das entrevistas.","Nome registrável como marca: INPI fora de pauta por ora."],a4=[{d:"Par de nomes do problema e da solução",s:"decidido",v:"Gestão Mensal de Leads para o problema; Sistema de Vendas Safra para a solução."},{d:"“Método Safra” como marca do produto",s:"decidido",v:"Deixa de ser nome público."},{d:"Painel do leilão como prova pública",s:"decidido",v:"Uso público não obrigatório; mostrar numa call privada está em aberto."},{d:"Quem conduz a versão rápida da Análise Estratégica na call",s:"pendente",v:"O Júnior ou um closer treinado."},{d:"A frase filosófica principal do problema",s:"pendente",v:"A recomendada ou outra das estudadas na camada filosófica."}],a6=["O dono reconhece o problema quando vê o desenho das safras sobrepostas.","A queda perto do terceiro mês do fornecedor é efeito, ao menos em parte, da Gestão Mensal de Leads.","O dono se reconhece no nome “Gestão Mensal de Leads” sem se sentir acusado (testar nas entrevistas).","A frase “Perdido é quem disse não” provoca concordância imediata no dono (testar nas entrevistas).","Leads de 30 a 60 dias saem da mesa na virada do mês sem ter dito não (medir nos fundadores)."],a8="Você já pagou pelas suas próximas vendas. Elas estão em quem nunca disse não e ficou para trás quando o mês virou. O sistema de vendas por safra respeita o tempo de amadurecimento de cada contato, não o calendário mensal. São mais vendas com a mesma verba, cada venda custando menos e quem já comprou voltando a comprar.",a9=["A rúcula fica pronta para colher em cerca de 30 dias; o morango, em cerca de 60; a melancia, em cerca de 90. Uma planta não é melhor que a outra: cada uma tem o seu tempo.","95% dos negócios que geram leads e têm time de vendas agem como o agricultor que só colhe a rúcula. Se o lead não comprou no mês, sai da lista, e o time vai plantar de novo com lead novo. O morango e a melancia, que ainda estavam amadurecendo, morrem no pé.","Na venda consultiva, pouco lead é rúcula. Morango é quem pediu um tempo ou precisa falar com o sócio; melancia é quem compra caro e decide devagar. O comprador que a Triad mira vende acima de R$ 10 mil: terreno de morango e de melancia."],a7=[{f:"Você já pagou pelas suas próximas vendas.",faz:"Vira uma crença. O dono acha que a próxima venda exige investimento novo; a frase diz que ele já investiu. Abre a pergunta “como assim?”.",colheita:"A semente já está na terra. Ele pagou a semente, o adubo e o plantio quando investiu em anúncio, evento e tempo de equipe. O que falta não é plantar: é colher."},{f:"Elas estão em quem nunca disse não e ficou para trás quando o mês virou.",faz:"Mostra onde está o dinheiro e nomeia a causa sem jargão: a virada do mês. Também absolve o time: o calendário empurrou a atenção para o lead novo.",colheita:"São o morango e a melancia deixados no pé porque o produtor só colheu a rúcula no dia 30. Não estavam perdidos, estavam verdes."},{f:"O sistema de vendas por safra respeita o tempo de amadurecimento de cada contato, não o calendário mensal.",faz:"Apresenta o sistema e o contraste com o comercial comum. É a única frase que fala de método, e fala em uma linha.",colheita:"A safra é o canteiro. Os contatos de cada mês são plantados juntos e acompanhados juntos, com o seu tempo de colheita: a rúcula sai aos 30 dias, o morango aos 60, a melancia aos 90."},{f:"São mais vendas com a mesma verba, cada venda custando menos e quem já comprou voltando a comprar.",faz:"Entrega os três benefícios, na ordem de força: vender mais, gastar menos e vender mais vezes.",colheita:"Mais quilos do mesmo canteiro, cada quilo mais barato, e a planta bem cuidada volta a dar fruto. O último benefício depende da segunda compra, que ainda não existe no método e agora também está na promessa central."}],oe=[{uso:"Título de anúncio",frase:"Você já pagou pelas suas próximas vendas."},{uso:"Abertura de VSL",frase:"Você já pagou pelas suas próximas vendas. Só não sabe onde elas estão."},{uso:"Pergunta de prospecção",frase:"Quantos dos seus ‘perdidos’ nunca disseram não?"},{uso:"Dor",frase:"Você está pagando duas vezes pela mesma venda."},{uso:"Chamada",frase:"Antes de buscar contato novo, colha quem nunca disse não.",nota:"Ainda usa “colha”, que a regra de vocabulário tira das chamadas."}],oa=["Decisão sobre a segunda compra no método. Sem ela, a frase 4 termina em “cada venda custando menos”.","Prova real antes de a promessa de benefício ir a público (CONAR): [PROVA REAL: vendas colhidas de leads que nunca disseram não, num cliente fundador].","Teste nas entrevistas: ler a ideia em voz alta e pedir que o dono explique o que entendeu e com qual tipo de lead se identifica: rúcula, morango ou melancia."],oo="Para o dono de empresa que já tem leads, já tem time e vende acima de R$ 10 mil.",or="Em 90 dias, a Triad instala o Sistema de Vendas Safra no seu comercial para o seu time vender gastando menos, vender mais e vender mais vezes para o mesmo cliente.",ot="Um sistema que respeita o tempo de decisão de cada cliente, não o fim do mês. Você passa a saber, toda semana, em que etapa a venda trava e quem ainda pode comprar. E nenhum lead sai da lista antes de dizer não.",on="Como vender para os leads que você já pagou, sem comprar mais lead nem trocar o seu time.",os="Seu lead só sai da lista quando disser não.",oi=[{n:1,formato:"Contraste, para palco ou abertura de vídeo",t:"Enquanto a maioria dos donos compra mais lead para salvar o mês, quem respeita o tempo de decisão de cada cliente vende mais, gasta menos e volta a vender para quem já comprou."},{n:2,formato:"Compromisso do Júnior, para abrir a call ou a VSL, na voz dele",t:"Me dá 3 semanas. Eu te mostro em que etapa a sua venda trava e quantos dos leads que você já pagou ainda podem comprar. Fechou?"},{n:3,formato:"“Mesmo que”, para página e e-mail",t:"Em 90 dias, o seu time vende mais, gastando menos, e volta a vender para quem já comprou. Mesmo que ele nunca tenha seguido processo, mesmo com o tráfego cada vez mais caro e mesmo que você já tenha pago caro por consultoria que entregou reunião, não venda."},{n:4,formato:"Proximidade, para a chamada da Análise Estratégica das Safras",t:"Você está a uma análise de distância de saber quanto dinheiro ficou parado nos leads dos seus últimos três meses."},{n:5,formato:"Anúncio curto",t:"Antes de comprar mais lead, venda para os que você já pagou. Um sistema de vendas que respeita o tempo de cada cliente, sem trocar o seu time."}],ol=[{tipo:"Externa",crenca:"“O problema é o tráfego caro.”",resposta:"“Gastando menos” e a linha de apoio (“sem comprar mais lead”)"},{tipo:"Interna",crenca:"“Meu time não segue processo.”",resposta:"“Para o seu time vender”: o time é o mesmo, com sistema novo; e a variação 3"},{tipo:"Sobre o veículo",crenca:"“É mais uma mentoria.”",resposta:"“A Triad instala no seu comercial”"}],od=["Aprovação da promessa pelo Júnior e pelo Euclides.","Quem assina: a Triad, como na promessa decidida, ou o Júnior em primeira pessoa (variação 2, na call).","Regra de vocabulário: depois da promessa decidida, ela continua valendo para colheita, plantio e relógio em títulos e chamadas?","A safra de clientes entra no método? Sem ela, “vender mais vezes para o mesmo cliente” fica sem sustentação na entrega."],oc=["Nas entrevistas, ler o título e a variação 2 e pedir que expliquem o que entenderam, o que esperariam receber e o que acham que “Safra” quer dizer.","Levar a promessa ao advogado, junto com o contrato."],om=[{t:"Os três benefícios juntos pesam mais para esse dono do que “sem comprar mais lead”.",g:"indicativa"},{t:"O nome Sistema de Vendas Safra na primeira linha não afasta quem ainda não sabe o que é safra. Testar nas entrevistas.",g:"indicativa"},{t:"A variação 2, com o Júnior se comprometendo com um prazo curto, converte melhor na call do que a promessa de 90 dias. Testar.",g:"indicativa"}],ou="Em 90 dias, a Triad instala o Sistema de Vendas Safra no seu comercial para o seu time vender gastando menos, vender mais e vender mais vezes para o mesmo cliente.",op=[{k:"Núcleo",v:"Implementação Avançada do Sistema de Vendas Safra: 90 dias, 8 entregas, gerente de safra e três encontros com o Júnior. É implementação, nunca mentoria nem curso"},{k:"Bônus",v:"Curso gravado do Júnior para o time; Análise Estratégica da base de clientes"},{k:"Bônus pela troca",v:"Uma sessão extra com o Júnior para quem autoriza virar caso documentado"},{k:"Preço",v:"R$ 45 mil para as 10 primeiras vagas; depois, R$ 60 mil"},{k:"Pagamento",v:"Pela Hotmart, à vista ou parcelado; forma de pagamento a definir (proposta: R$ 45 mil à vista ou 6x de R$ 8.250)"},{k:"Vagas",v:"As 10 primeiras vendas da Avançada, a R$ 45 mil (vendas da Essencial não contam); a data de início de cada cliente está em aberto"},{k:"Porta de entrada",v:"Análise Estratégica das Safras na versão da call, a mesma para todos os públicos: valor de R$ 4.997, gratuita para as 10 primeiras vagas e cobrada por R$ 4.997 depois da 10ª venda"},{k:"Garantia",v:"Nenhuma: nenhuma promessa em contrato, que traz só o escopo. O risco cai com a Análise Estratégica feita antes da compra"},{k:"Continuidade",v:"GSAAS (Gestão de Safra as a Service), opcional, oferecido no Relatório de Produtividade: manutenção do CRM e do painel e a Mecanização da Safra, os agentes de IA que a implementação não instala"},{k:"Segunda opção",v:"Implementação Essencial, por R$ 22.500: o downsell, só depois do não à Avançada. Ver abaixo"}],of=["Fatura de R$ 150 mil a R$ 1,5 milhão por mês.","Recebe leads todo mês (cerca de 100 ou mais, a validar).","Tem duas ou mais pessoas vendendo, o dono incluído.","Tem o histórico dos leads dos últimos 3 meses, em CRM ou planilha."],oh=["Ainda não tem leads chegando: precisa de marketing antes.","Quer curso ou treinamento de vendedor.","Quer que alguém venda por ele.","Vende sem conversa, como no balcão ou no e-commerce."],og=["**A oferta é forte em mecanismo e fraca em probabilidade percebida.** Ainda não há caso de cliente, e não há garantia.","**A autoridade do Júnior existe, mas ainda não é percebida.** Ele passou anos nos bastidores dos lançamentos de Pablo Marçal e foi Head da Staage, no Grupo Primo. Para o dono que compra gestão comercial, essa autoridade ainda é de marketing digital, não de vendas, e terá de ser construída: conteúdo do Júnior sobre gestão comercial, o painel do leilão e os primeiros casos documentados. Na comunicação, Marçal entra só na história do Júnior, nunca como aval.","**O que segura a oferta é a Análise Estratégica das Safras.** O comprador vê o mecanismo funcionar com os números dele antes de pagar os R$ 45 mil, e, nas 10 primeiras vagas, sem pagar pela Análise.","**Para quem disser não, há o downsell.** A Implementação Essencial, por R$ 22.500, em 13 semanas, com o curso gravado do Júnior e acesso ao GSAAS depois, oferecida só depois do não à Avançada."],ox="Em 90 dias, a Triad instala o Sistema de Vendas Safra no seu comercial para o seu time vender gastando menos, vender mais e vender mais vezes para o mesmo cliente.",ov=[{t:"**Põe o nome do sistema na promessa.** A regra de vocabulário não vale para o nome Sistema de Vendas Safra. Vale para colheita, plantio e relógio em títulos e chamadas, a confirmar."},{t:"**Promete benefício, não só processo.** Vender gastando menos, vender mais e vender mais vezes são os benefícios da Big Idea. O “para” se lê como a finalidade da instalação, e nenhum número aparece. Pelo CDC (art. 30) e pelo CONAR, cada benefício precisa ser comprovável quando for a público: [PROVA REAL: vendas recuperadas e custo por venda, antes e depois, num cliente fundador]."},{t:"**“Vender mais vezes para o mesmo cliente” depende da safra de clientes,** que ainda não está no método e espera o Júnior. Hoje, só o bônus da Análise Estratégica da base de clientes sustenta essa parte."},{t:"**Diferencia dos concorrentes** pelo nome do sistema e pelos três benefícios juntos. Não repete “sem depender de você” nem “previsibilidade” e não usa multiplicador."}],ob="A promessa ganha força porque nomeia o sistema e entrega os três benefícios logo na primeira linha. Por isso a prova do primeiro caso fica mais urgente.",oy=[{k:"Resultado desejado",lado:"num",hoje:7,leitura:7,porque:"Vender gastando menos, vender mais e vender mais vezes é forte e concreto, mas ainda sem número."},{k:"Probabilidade percebida",lado:"num",hoje:3,leitura:6,porque:"Sem caso, sem garantia e sem autoridade comercial pública. A Análise Estratégica mostra o mecanismo com os números do prospect."},{k:"Tempo até o resultado",lado:"den",hoje:4,leitura:3,porque:"Primeiro valor na semana 3 e Colheita a partir da semana 5. Com a Análise Estratégica antes da compra, o primeiro valor vem antes de pagar."},{k:"Esforço do cliente",lado:"den",hoje:3,leitura:3,porque:"A Triad monta tudo; o cliente dá os dados, 1 hora por semana, e o time faz as ligações."}],oj=[{o:"Não sei onde a minha venda trava.",r:"Análise Estratégica das Safras (entrega 1)"},{o:"O relatório do mês não me diz nada.",r:"Implementação da Infraestrutura, o CRM por safra, e Painel de Safras (entregas 2 e 5)"},{o:"Não sei quanto dinheiro está parado.",r:"Análise Estratégica das Safras e Recuperação de Ativos (entregas 1 e 4)"},{o:"Meu time larga o lead quando o mês vira.",r:"A regra “perdido só com um não”, na Implementação da Infraestrutura, e a régua de contato do Playbook de Comunicação Persuasiva (entregas 2 e 3)"},{o:"Meu time não segue processo.",r:"Playbook de Comunicação Persuasiva e Treinamento para Otimização da Conversão (entregas 3 e 6); a automação por agentes de IA fica no GSAAS, com a Mecanização da Safra"},{o:"Vendedor novo não sabe as etapas nem as metas.",r:"Bônus: curso gravado do Júnior"},{o:"O follow-up depende da memória do vendedor.",r:"Playbook de Comunicação Persuasiva e Treinamento para Otimização da Conversão (entregas 3 e 6); o acompanhamento automático por agentes de IA fica no GSAAS, com a Mecanização da Safra"},{o:"Metade das reuniões não acontece.",r:"Playbook de Comunicação Persuasiva e Treinamento para Otimização da Conversão (entregas 3 e 6); o lembrete automático de reunião por agentes de IA fica no GSAAS, com a Mecanização da Safra"},{o:"Meu CRM é uma bagunça ou uma planilha.",r:"Implementação da Infraestrutura (entrega 2)"},{o:"Trocar de CRM dá trabalho.",r:"Depende da decisão de tecnologia, em aberto. A resposta ideal: “funciona no CRM que você já usa”",aberto:!0},{o:"Não tenho tempo para gerir o comercial.",r:"A Triad conduz a reunião; o cliente dá 1 hora por semana"},{o:"R$ 45 mil sem saber se funciona é muito.",r:"Análise Estratégica antes da compra, gratuita para as 10 primeiras vagas; parcelamento pela Hotmart"},{o:"Já paguei caro por mentoria que não entregou.",r:"Não é mentoria nem curso: 8 entregas com critério de pronto, e o Júnior em três encontros"},{o:"Vou ficar sozinho depois de assinar.",r:"Gerente de safra com nome, a reunião semanal do Treinamento para Otimização da Conversão e a sessão extra com o Júnior"},{o:"Vocês usam o que vendem?",r:"O sistema roda no leilão do Júnior; painel mostrado na call (a decidir)",aberto:!0},{o:"E se eu sair, meus dados ficam com vocês?",r:"Dados e Playbook da Gestão de Vendas por Safra ficam com o cliente (regra proposta)"},{o:"Meu cliente compra uma vez e some.",r:"Bônus: Análise Estratégica da base de clientes"},{o:"Meu sócio não vai aprovar.",r:"O sócio na call; a Análise Estratégica em números vira o argumento interno"},{o:"Não quero mais aula nem conteúdo.",r:"O núcleo é operação; o curso entra só como apoio ao time"},{o:"Eu sou o único que fecha venda.",r:"Não resolvido de propósito. A Recuperação de Ativos e o Playbook de Comunicação Persuasiva tiram parte da carga, mas a oferta não promete trocar o dono-vendedor",fora:!0}],ok=[{item:"Núcleo",nome:"Implementação Avançada do Sistema de Vendas Safra",oque:"90 dias, 8 entregas, gerente de safra e três encontros com o Júnior",valor:"R$ 60 mil (preço depois das 10 primeiras vagas)",nota:""},{item:"Bônus 1",nome:"Curso gravado do Júnior, liberado para o time",oque:"As aulas de etapas e métricas que ele já tem, como apoio para vendedores novos",valor:"[Confirmar se já foi vendido avulso e por quanto; se nunca foi, não atribuir valor]",nota:"Nota 5 de 6: custo quase zero; o risco é parecer ensino, por isso nunca em destaque."},{item:"Bônus 2",nome:"Análise Estratégica da base de clientes",oque:"A Análise Estratégica feita sobre quem já comprou, para achar quem pode comprar de novo; entregue na semana 12",valor:"R$ 4.997, o valor da Análise Estratégica das Safras, gratuita para as 10 primeiras vagas",nota:"Nota 4 de 6: cerca de 20 horas de analista e gerente; é a única peça que hoje sustenta o “vender mais vezes para o mesmo cliente” da promessa."},{item:"Pela troca",nome:"Sessão extra com o Júnior",oque:"Uma sessão individual de estratégia comercial, além dos três encontros",valor:"[Confirmar o valor de uma sessão avulsa do Júnior]",nota:"Nota 5 de 6: o tempo do Júnior é o recurso mais escasso; funciona como bônus limitado de verdade."}],oN=["Os números por etapa antes e depois, só agregados (nunca a lista de leads, por causa da LGPD).","O nome da empresa ou só o setor, à escolha do cliente.","Um depoimento em vídeo sobre o que aconteceu."],ow="R$ 45 mil para as 10 primeiras vagas, até a 10ª venda; depois, R$ 60 mil.",oS="O “depois, R$ 60 mil” só vale se R$ 60 mil virar o preço cobrado de verdade depois da 10ª venda (CDC e CONAR). Nunca anunciar “de R$ 60 mil por R$ 45 mil”. A urgência é só essa: nenhuma data, nenhum prazo inventado.",oq="Pela Hotmart, à vista ou parcelado, com taxa reduzida em negociação; a forma de pagamento está a definir. Proposta: R$ 45 mil à vista ou 6x de R$ 8.250 (R$ 49.500 no total, 10% a mais). Alternativa: R$ 42.750 à vista e 6x de R$ 7.500, que mantém R$ 45 mil na parcela mas corta a margem.",oA="Sem preço quebrado: em serviço de alto valor para dono de empresa, R$ 44.997 soa como varejo.",oE=[{k:"O preço depois das 10 primeiras vagas",v:"R$ 60 mil."},{k:"A alternativa que ele conhece",v:"Um head comercial contratado custa cerca de R$ 14 mil por mês de salário, segundo o Júnior. Em 3 meses, cerca de R$ 42 mil só de salário, mais encargos, e ele chega sem método e sem CRM."},{k:"O dinheiro parado nas safras antigas",v:"Calculado na Análise Estratégica com os números do próprio prospect. É a âncora mais forte, porque é dele."}],oC="Valor parado = leads que nunca disseram não × taxa de fechamento realista × ticket médio",oz={leads:300,taxa:.03,ticket:15e3},oP="Exemplo ilustrativo, só para mostrar a fórmula. Não usar em peça.",oO="Se a Análise Estratégica mostrar menos de cerca de três vezes o preço parado nas safras antigas, a recomendação honesta é não vender agora. Recusar quem não tem safra para colher aumenta a confiança de quem tem e protege os primeiros casos.",oR=[{k:"Valor",v:"R$ 4.997: gratuita para as 10 primeiras vagas e cobrada por R$ 4.997 depois da 10ª venda."},{k:"Formato",v:"A versão da call: a versão rápida sobre a última safra do prospect, feita na própria reunião, de 30 a 45 minutos. É a mesma para todos os públicos, orgânico e pago, frio, morno e quente."},{k:"E a completa",v:"A Análise completa das safras, com documento e painel, é a entrega 1 da implementação (semana 3). Não é porta de entrada vendida à parte nas 10 primeiras vagas."}],oT="Premissas em revisão com o Euclides e a Cyntia, a começar pelas horas de tecnologia: custo direto de cerca de R$ 23.610 por implementação, 13% de impostos, 4% de taxas e aquisição de 10% de comissão mais a mídia por venda, que é o custo por lead dividido pela conversão do funil: R$ 2.400 no cenário base (R$ 90 por lead e as metas por etapa do Júnior, 3,75% de lead em venda). Os números abaixo valem até a revisão.",oM=[{k:"Margem de contribuição",a:"R$ 13.740",b:"R$ 26.190"},{k:"Sobra depois da aquisição",a:"R$ 6.840 (15%)",b:"R$ 17.790 (30%)"},{k:"Preço ÷ custo direto",a:"1,9 vez",b:"2,5 vezes"}],oI="O GSAAS a R$ 15 mil por mês deixa cerca de R$ 8.850 por mês por cliente (conta em revisão). As 10 primeiras vagas, a R$ 45 mil, se pagam como fábrica de casos e de clientes de GSAAS, não pela margem da implementação. Abaixo de metade dos clientes no GSAAS, a operação vive da margem fina.",oD="No funil real do leilão de julho (0,55% de lead em venda), a mídia por venda passa de R$ 16 mil e a implementação a R$ 45 mil dá prejuízo. Por isso a pré-qualificação decide a conta.",o_="Proposta: preço do GSAAS travado por 12 meses para quem entra nas 10 primeiras vagas.",oL="O comprador pergunta: “Qual métrica de entrega está no contrato? É venda, ou é alcance?” (padrão em duas fontes). A resposta: nenhum resultado no contrato; o escopo das 8 entregas por escrito e a medição à vista no Relatório de Produtividade. A promessa pública fala em benefício, sem número, e o contrato continua só com o escopo.",o$="Ninguém pede garantia de forma espontânea, e nenhum concorrente direto oferece garantia de verdade. Não prometer e dizer isso com clareza é melhor do que prometer e desmentir, como a Growth Machine.",oF=[{k:"Prova antes da compra",v:"A Análise Estratégica mostra o mecanismo com os números do prospect."},{k:"“O que a Triad não promete”",v:"Um bloco na página, na VSL e na call."},{k:"Escopo escrito",v:"O contrato descreve só o escopo: as 8 entregas, com data e critério de pronto. Nenhum resultado prometido."},{k:"Medição à vista",v:"O Relatório de Produtividade compara as safras antigas com o número de antes, sem meta prometida."},{k:"Regra de venda",v:"Só vende quando a Análise Estratégica mostra cerca de três vezes o preço parado."},{k:"Saída limpa",v:"Dados, acessos e o Playbook da Gestão de Vendas por Safra ficam com o cliente."}],oV="Não prometemos um número de vendas. Quem promete número sem conhecer a sua operação está chutando. Não vendemos curso nem aula. Não vendemos pelo seu time e não trazemos lead novo. O que fazemos: analisamos os seus últimos meses de leads, mostramos em que etapa a venda trava e instalamos um jeito de operar em que nenhum lead sai da lista antes de dizer não. Em 90 dias, com data marcada para cada entrega.",oG="Pelo CDC (art. 49), quem contrata fora do estabelecimento tem 7 dias para desistir, quando a relação é de consumo. Numa venda para empresa que usa o serviço no próprio negócio, pode não se aplicar. Um advogado define a cláusula antes da primeira venda.",oB=[{tipo:"Escassez",como:"10 primeiras vagas a R$ 45 mil, até a 10ª venda da Avançada; vendas da Essencial não contam",real:"A capacidade de entrega tem limite, e o preço sobe depois da 10ª venda"},{tipo:"Prazo",como:"Nenhuma data nem prazo: o preço de R$ 45 mil vale até a 10ª venda",real:"Depois da 10ª venda, o preço de R$ 45 mil não volta"},{tipo:"Aumento de preço",como:"Depois da 10ª venda, R$ 60 mil",real:"Desde que R$ 60 mil seja cobrado de verdade dali em diante"},{tipo:"Bônus limitado",como:"A sessão extra com o Júnior só para quem autoriza o caso",real:"O tempo do Júnior é o recurso mais escasso da Triad"},{tipo:"Custo de esperar",como:"“Cada mês que vira, mais um mês de leads sai da lista sem ter dito não”",real:"Calculado na Análise Estratégica com os números dele"}],oU=[{k:"Gerente de safra",h:"cerca de 590 horas em 13 semanas",s:"Cerca de 2 gerentes em tempo integral, se as 10 implementações correrem ao mesmo tempo. Hoje nenhum tem nome"},{k:"Analista",h:"cerca de 420 horas",s:"Cerca de 1 pessoa em tempo integral"},{k:"Tecnologia",h:"cerca de 700 horas, quase todas nas 6 primeiras semanas (em revisão)",s:"De 3 a 4 pessoas no começo, com o CRM ainda em beta"},{k:"Júnior",h:"cerca de 100 horas, mais as calls de venda",s:"Um kickoff na semana 1 e uma apresentação da Análise Estratégica na semana 3 de cada cliente; com inícios próximos, elas se acumulam nas mesmas semanas"}],oW=["Versão rápida da Análise Estratégica da última safra dele: onde travou e quantos leads nunca disseram não. Valor de R$ 4.997, gratuita para as 10 primeiras vagas.","A conta do que está parado. Se der menos de cerca de três vezes o preço, a call termina numa recomendação honesta de não comprar agora.","O mecanismo: o mês mistura safras; a rúcula, o morango e a melancia, e o agricultor que só colhe a rúcula. O 95% só entra como número quando tiver fonte.","As quatro etapas e as 8 entregas, sempre ligadas ao que apareceu na Análise Estratégica dele.","Os dois bônus: curso para o time e Análise Estratégica da base de clientes.","O bloco “O que a Triad não promete”.","As âncoras: R$ 60 mil depois das 10 primeiras vagas, o head contratado, o valor parado nas safras dele.","O preço das 10 primeiras vagas: R$ 45 mil, pela Hotmart, à vista ou parcelado.","A troca pelo caso, com a sessão extra com o Júnior.","As 10 primeiras vagas: o preço de R$ 45 mil vale até a 10ª venda.","O pedido: reservar a vaga.","Se a resposta for não, entra a Implementação Essencial, por R$ 22.500. Nunca antes do não."],oH=["Abertura com a Big Idea: “Você já pagou pelas suas próximas vendas.”","O mecanismo, com a rúcula, o morango e a melancia.","A promessa decidida e a promessa de prazo.","As quatro etapas e o que ele recebe.","É para você / não é para você.","O que a Triad não promete.","A chamada para a Análise Estratégica das Safras: valor de R$ 4.997, gratuita para as 10 primeiras vagas. O preço da implementação fica para a call."],oQ=[{k:"Equação de valor no alvo",s:"nao",n:"Numerador 10 a 13 (alvo 14 a 20), denominador 6 a 7 (alvo 2 a 4)"},{k:"Retorno de pelo menos 3 para 1",s:"parcial",n:"Depende da Análise Estratégica de cada cliente; virou regra de venda"},{k:"15 a 30 obstáculos mapeados",s:"sim",n:"20, com 17 resolvidos"},{k:"5 a 7 bônus",s:"escolha",n:"3, por escolha"},{k:"Preço de pelo menos 10 vezes o custo",s:"escolha",n:"1,9 vez, com o custo em revisão; a conta fecha pela continuidade"},{k:"Âncora de 3 a 10 vezes o preço",s:"parcial",n:"Só com o valor parado nas safras do cliente"},{k:"À vista e parcelado",s:"sim",n:"Pela Hotmart; a forma está a definir"},{k:"Preço quebrado",s:"escolha",n:"Não, por escolha"},{k:"Garantia forte",s:"escolha",n:"Não: nenhuma promessa em contrato"},{k:"3 ou 4 urgências reais",s:"sim",n:"Se a capacidade for confirmada"},{k:"Teste com 10 donos do perfil",s:"nao",n:"Pendente"},{k:"Ordem: valor, preço, bônus, urgência",s:"sim",n:""}],oJ=["Regra de vocabulário depois da promessa decidida: continua valendo para colheita, plantio e relógio em títulos e chamadas, ou cai inteira?","Pagamento pela Hotmart: R$ 45 mil à vista ou 6x de R$ 8.250 (recomendado), ou a alternativa com desconto à vista; a forma está a definir.","Data de início de cada cliente.","Contrato: só o escopo das 8 entregas, sem nenhuma promessa de resultado; dados com o cliente; revisão de advogado (CDC, arts. 30 e 49), agora incluindo a promessa decidida.","Preço real do curso gravado e de uma sessão do Júnior, para usar como referência, ou nenhum valor atribuído.","Preço do GSAAS travado por 12 meses para os clientes das 10 primeiras vagas?","Mostrar o painel do leilão numa call privada?","A regra de só vender quando a Análise Estratégica mostrar cerca de três vezes o preço parado.","Revisar as horas de tecnologia e a conta da implementação com o Euclides e a Cyntia."],oX=[{t:"A Análise Estratégica antes da compra compensa a falta de garantia.",g:"indicativa"},{t:"A promessa decidida soa crível para o dono que já se queimou, mesmo sem caso publicado. Testar nas entrevistas.",g:"indicativa"},{t:"Pelo menos metade dos 10 primeiros clientes autoriza o caso em troca da sessão com o Júnior.",g:"indicativa"},{t:"Depois da 10ª venda, o dono aceita pagar R$ 4.997 pela Análise Estratégica da call.",g:"indicativa"}],oK=[{k:"O que é",v:"O método do Sistema de Vendas Safra sem a tecnologia: análise, régua, condução semanal e playbook"},{k:"Nome",v:"Implementação Essencial do Sistema de Vendas Safra"},{k:"Para quem",v:"O mesmo dono da Avançada, quando ela não cabe no caixa agora ou quando a Análise Estratégica mostra pouco valor parado para ela se pagar"},{k:"Quando entra",v:"Só depois do não à Avançada, na call. Nunca em página, anúncio ou e-mail"},{k:"Quanto tempo",v:"13 semanas, no mesmo calendário da Avançada"},{k:"Bônus",v:"Curso gravado do Júnior, liberado para o time"},{k:"Quanto custa",v:"R$ 22.500; forma de pagamento a definir"},{k:"Depois",v:"O GSAAS, opcional, ou subir para a Avançada com o valor pago como crédito (proposta)"}],oY="Na Avançada, a Triad monta o CRM e o painel e organiza a retomada dos leads antigos. Na Essencial, quem organiza e retoma é o time do cliente, com a Triad conduzindo.",oZ=[{n:"1",e:"Análise Estratégica das Safras",av:"Sim, semana 3",es:"Sim, semana 3",entra:!0},{n:"2",e:"Implementação da Infraestrutura",av:"Sim, semana 4",es:"Não: o cliente organiza o próprio CRM ou planilha, seguindo o Playbook da Gestão de partida",entra:!1},{n:"3",e:"Playbook de Comunicação Persuasiva",av:"Sim, semana 5",es:"Sim, semana 5",entra:!0},{n:"4",e:"Recuperação de Ativos",av:"Sim, semanas 5 a 13",es:"Não: o time retoma os leads antigos com os números da Análise e os roteiros do Playbook de Comunicação Persuasiva, sem a lista priorizada",entra:!1},{n:"5",e:"Painel de Safras",av:"Sim, semana 6",es:"Não",entra:!1},{n:"6",e:"Treinamento para Otimização da Conversão",av:"Sim, semanas 6 a 13",es:"Sim, semanas 6 a 13",entra:!0},{n:"7",e:"Playbook da Gestão de Vendas por Safra",av:"Sim, semana 12",es:"Sim, em duas versões: partida na semana 4 e final na semana 12",entra:!0},{n:"8",e:"Relatório de Produtividade",av:"Sim, semana 13",es:"Não: a medição fica nas atas do Treinamento para Otimização da Conversão",entra:!1},{n:"",e:"Encontros com o Júnior",av:"Três",es:"Nenhum (proposta)",entra:!1},{n:"",e:"Bônus",av:"Curso gravado, Análise Estratégica da base de clientes, sessão pela troca",es:"Curso gravado do Júnior, liberado para o time",entra:!0},{n:"",e:"GSAAS depois",av:"Sim, opcional",es:"Sim, opcional; formato e preço a definir, porque a Essencial não instala o CRM nem o painel",entra:!0}],o0=["Organizar o CRM ou a planilha por safra até a semana 5, seguindo o Playbook da Gestão de partida, e registrar todo lead novo a partir daí. Fica descrito no escopo como condição do Treinamento para Otimização da Conversão.","Retomar, com o próprio time, os leads antigos que nunca disseram não, usando a régua e os roteiros do Playbook de Comunicação Persuasiva.","Como na Avançada: liberar os dados dos últimos 3 a 6 meses, nomear um responsável, reservar 1 hora por semana e ter base legal para falar com os leads antigos."],o1={t:"A assessoria se resume a 2 reuniões mensais que não levam a lugar nenhum de 30 minutos cada uma.",a:"Empresa de Altinópolis, mais de R$ 70 mil em 10 meses",ref:"Reclame Aqui"},o2=[{parado:"R$ 135 mil ou mais (3 vezes R$ 45 mil)",oferta:"A Avançada. Se o dono disser não (por caixa ou por momento), a Essencial, com crédito para subir"},{parado:"Menos de R$ 135 mil",oferta:"A recomendação honesta de não comprar a Avançada agora, porque ela não se paga com folga. Depois do não, a Essencial"}],o3=["Só depois do não à Avançada, na mesma call ou no retorno. Nunca lado a lado com ela, nem em página, anúncio ou e-mail.","A mesma comissão de 10% nas duas, para quem vende não ganhar mais empurrando a Essencial (proposta).","O motivo do não fica registrado (preço, valor parado ou momento), para medir se a Essencial está tirando venda da Avançada.","Vendas da Essencial não contam para as 10 vagas: só vendas da Avançada as preenchem."],o5=[{k:"Preço",v:"R$ 22.500"},{k:"Reuniões e calls",v:"8 reuniões e 16 calls do Treinamento para Otimização da Conversão"},{k:"Custo direto",v:"R$ 9.200"},{k:"Receita sem impostos e taxas",v:"R$ 18.675"},{k:"Comissão de 10%",v:"R$ 2.250"},{k:"Sobra depois da comissão",v:"R$ 7.225 (32% do preço)"}],o4=[{t:"**Parecer a assessoria que o comprador já rejeita.** Sem execução da Triad dentro da operação, fica perto de “reunião sem venda”. O que segura: o Treinamento para Otimização da Conversão toda semana, metas aprovadas pelo dono na Análise e número por etapa em cada ata.",g:"moderada"},{t:"**Tirar venda da Avançada.** A R$ 22.500, a sobra por venda fica perto da Avançada, e o incentivo de vender a Essencial no lugar dela cresce. O que segura: só depois do não, a régua da Avançada pelo valor parado, a mesma comissão nas duas, o motivo do não registrado e o crédito para subir.",g:"moderada"},{t:"**Resultado pior e culpa no método.** O resultado depende da disciplina do time. O que segura: o CRM organizado por safra até a semana 5 como condição do Treinamento para Otimização da Conversão, descrita no escopo.",g:"moderada"},{t:"**Prova fraca.** Sem o Relatório, a Essencial gera prova pior. A primeira prova pública continua vindo das Avançadas, e a Essencial fica fora da troca pelo caso documentado (proposta).",g:"forte"}],o6=["Forma de pagamento da Essencial.","O Playbook da Gestão de Vendas por Safra em duas versões.","Quem apresenta a Análise Estratégica: o gerente de safra (recomendado) ou o Júnior.","Sem encontros com o Júnior; o curso gravado é o único bônus.","Formato e preço do GSAAS para quem fez a Essencial, que não instala o CRM nem o painel.","Crédito para subir até a semana 6.","Se a Essencial tem piso de valor parado para ser oferecida.","Teto de Essenciais nas 10 primeiras vagas, junto com a contratação dos gerentes."],o8=[{k:"Em uma frase",v:"Em 90 dias, a Triad instala o Sistema de Vendas Safra no comercial do cliente, para o time dele vender gastando menos, vender mais e vender mais vezes para o mesmo cliente"},{k:"O que é",v:"Um jeito novo de gerir o comercial: cada mês de leads vira uma safra, com prazo para amadurecer e meta em cada etapa"},{k:"O que muda",v:"O dono passa a saber em que etapa a venda trava e para de largar o lead que ainda não disse não"},{k:"Quanto tempo",v:"90 dias (13 semanas)"},{k:"Depois",v:"Opcional: o GSAAS (Gestão de Safra as a Service), por assinatura mensal, com a manutenção do CRM e do painel e a Mecanização da Safra"}],o9=[{k:"Safra",v:"Os leads que entraram num mesmo mês."},{k:"Relógio",v:"O prazo para a safra amadurecer. No negócio do Júnior são 90 dias; cada cliente tem o seu, calculado com os dados dele."},{k:"Etapas",v:"Pré-qualificação, agendamento, comparecimento e fechamento. Cada uma tem meta."},{k:"Perdido",v:"Só quem disse não. Quem não respondeu ainda está no campo."}],o7=[{nome:"Análise Estratégica das Safras",ini:1,fim:3,oque:"As safras dos últimos 3 a 6 meses são analisadas, e o relógio do negócio é calculado",quem:"A Triad, com os dados do cliente"},{nome:"Preparo do solo",ini:3,fim:6,oque:"Implementação da Infraestrutura (o CRM por safra), Playbook de Comunicação Persuasiva (régua de contato e roteiros) e Painel de Safras",quem:"A Triad"},{nome:"Colheita",ini:5,fim:13,oque:"Recuperação de Ativos: o time volta a falar com quem nunca disse não nas safras antigas",quem:"O time do cliente, com o roteiro da Triad"},{nome:"Plantio",ini:6,fim:13,oque:"As safras novas entram com relógio e meta; começa o Treinamento para Otimização da Conversão, a reunião semanal de safra",quem:"O time do cliente e o gerente de safra da Triad"}],re=[{sem:3,t:"Apresentação da Análise Estratégica"},{sem:7,t:"Balanço de 45 dias"},{sem:13,t:"Relatório de Produtividade"}],ra=[{n:1,nome:"Análise Estratégica das Safras",oque:"Em que etapa cada safra travou, quantos leads estão parados e qual é o relógio do negócio; as metas de cada etapa aprovadas pelo dono",analogia:"Antes de plantar, o agricultor percorre a lavoura: vê o que vingou, o que secou e quanto tempo cada cultura leva para dar fruto. É aqui que o dono descobre se o negócio dele é rúcula, morango ou melancia.",ini:3,fim:3,pronto:"Foi apresentada ao dono, que aprovou as metas de cada etapa"},{n:2,nome:"Implementação da Infraestrutura",oque:"O CRM organizado por safra. Cada lead tem safra, etapa e situação, e ninguém vira perdido sem dizer não",analogia:"Terra compactada não segura semente: antes de plantar, o solo é revolvido e corrigido. Cada lead volta para o lugar certo antes de o time voltar a trabalhar.",ini:4,fim:4,pronto:"Todo lead novo entra certo por 5 dias úteis seguidos"},{n:3,nome:"Playbook de Comunicação Persuasiva",oque:"A régua de contato e os roteiros, que definem quantas tentativas, em que intervalo e com que mensagem",analogia:"Adubo na dose e no intervalo certos faz a planta crescer até a colheita: demais queima, de menos não alimenta. O playbook define quantas vezes, de quanto em quanto tempo e com que mensagem o time volta ao lead.",ini:5,fim:5,pronto:"Aprovado pelo responsável e em uso pelo time"},{n:4,nome:"Recuperação de Ativos",oque:"Os leads das safras antigas que nunca disseram não, em ordem de prioridade, retomados pelo time do cliente com a régua e os roteiros do Playbook de Comunicação Persuasiva",analogia:"Parte da lavoura dos meses passados ainda está no pé, madura, esperando quem colha. Antes de plantar de novo, o time colhe o que já estava lá.",ini:5,fim:13,pronto:"Cada lead da lista tem uma situação final"},{n:5,nome:"Painel de Safras",oque:"Cada safra, etapa e vendedor, com o relógio visível",analogia:"O agricultor sabe o que está em cada canteiro e quantos dias faltam para colher. O painel põe isso na tela.",ini:6,fim:6,pronto:"Atualiza sozinho e é lido na reunião semanal"},{n:6,nome:"Treinamento para Otimização da Conversão",oque:"A reunião semanal de safra e a análise de calls, com 8 reuniões de 1 hora e 2 calls analisadas por semana, com ata de decisões e responsáveis",analogia:"Lavoura não se planta e se abandona: alguém passa por ela toda semana, tira a praga e corrige o que precisa.",ini:6,fim:13,pronto:"8 atas com decisões e responsáveis"},{n:7,nome:"Playbook da Gestão de Vendas por Safra",oque:"O jeito de operar, documentado para o time seguir com ou sem a Triad",analogia:"O que se aprende plantando passa de uma estação para a outra. O playbook guarda o jeito de operar para o time seguir sozinho depois dos 90 dias.",ini:12,fim:12,pronto:"Entregue e revisado com o responsável"},{n:8,nome:"Relatório de Produtividade",oque:"As safras antigas comparadas com o número de antes, os indicadores das novas e a data em que cada uma termina, apresentados pelo Júnior",analogia:"No fim da estação, o agricultor pesa o que colheu e compara com a safra anterior.",ini:13,fim:13,pronto:"Apresentado pelo Júnior"}],ro=["Liberar os acessos (CRM ou planilha, WhatsApp, agenda) em até 5 dias úteis.","Exportar os leads dos últimos 3 a 6 meses, com data de entrada, origem, etapa e valor.","Nomear uma pessoa responsável pela operação e reservar 1 hora por semana para a reunião de safra.","A partir da semana 6, registrar todo lead no CRM.","Ter base legal para voltar a falar com os leads antigos (LGPD), conferida na semana 1."],rr=["Gerar leads: tráfego, criativos ou conteúdo.","Contratar ou recrutar vendedores.","Treinar técnica de venda além dos roteiros e da análise de calls do Treinamento para Otimização da Conversão.","Vender pelo cliente: a Colheita e o Plantio são feitos pelo time dele.","Mudar a oferta, o preço ou o produto do cliente.","Integrações fora do padrão, orçadas à parte."],rt=[{quando:"Antes",t:"Rafa tem uma empresa de serviços e vende acima de R$ 10 mil. Tem três vendedores e ele mesmo fecha as vendas maiores. Um mês vende bem, o outro mal, e ninguém sabe dizer por quê. No fim do mês, o time larga quem não comprou e corre atrás dos novos."},{quando:"Semanas 1 a 3",t:"Rafa libera o CRM e a planilha dos últimos meses. A Triad separa os leads pelo mês em que entraram e analisa cada safra do fechamento para trás. Na semana 3, Rafa vê em que etapa cada safra travou e quantos leads das safras antigas nunca disseram não."},{quando:"Semanas 4 e 5",t:"Antes de voltar a esses leads, a Triad prepara o terreno. Primeiro vem a Implementação da Infraestrutura: o CRM passa a ter cada lead com safra, etapa e situação. Depois, o Playbook de Comunicação Persuasiva: a régua de contato e os roteiros dizem quantas tentativas fazer, em que intervalo e com que mensagem. Só então os leads antigos entram na Recuperação de Ativos."},{quando:"Semanas 5 a 13",t:"O time volta a falar com esses leads, com roteiro novo. Cada lead novo entra certo no CRM, e o painel mostra o relógio de cada safra. Toda semana, uma reunião de uma hora decide onde o time põe força: na safra perto do fim e abaixo da meta."},{quando:"Semana 13",t:"O Relatório de Produtividade mostra as safras antigas comparadas com o número de antes, os indicadores das novas  no seu lugar”; Lucas: “conduz junto, não no seu lugar”.",g:"forte"},{t:"**IA comercial virou mercadoria.** SDR por IA na Growth Machine, gerente por IA no evento do Diego, IA de análise de call na Full Sales, copiloto indicado pelo Concer. IA não sustenta R$ 45 a 60 mil como manchete.",g:"forte"},{t:"**Os rivais diretos são três.** Em formato, a Full Sales; em ecossistema e preço, a Growth Machine; em alcance, Lucas Torres, com mecanismo de psicologia e marca.",g:"moderada"},{t:"**O dono com time não conversa no Instagram dos concorrentes.** Em 2.065 comentários amostrados, ele é exceção. A qualificação acontece em página, formulário e call.",g:"forte"},{t:"**Os concorrentes exibem origem de venda; o Júnior exibe bastidor de lançamento.** A ponte de autoridade tem de vir de prova de operação (painel de safra, clientes fundadores), não do perfil.",g:"forte"}],rX=[{t:"**Mercado no estágio 4 a 5 de sofisticação.** Todos têm mecanismo nomeado e o mesmo inimigo: vendedor estrela, improviso, motivação, desconto.",g:"moderada"},{t:"**Dois mercados com a mesma palavra.** Quem comenta é o vendedor de ponta, mesmo nos perfis que falam com o dono. O dono compra high ticket por diagnóstico, evento e mídia paga.",g:"forte"},{t:"**Palavra-chave no comentário é o motor universal.** Só converte com promessa concreta: “AULÃO” rendeu 2.496 comentários à Carol; o “DESAFIO” vago do Thiago Reis, de 0 a 4.",g:"forte"},{t:"**O alcance é emprestado.** Política, clipe de terceiro e collab rendem de 4 a 14 vezes mais que a aula própria (forte nos números, amostra pequena).",g:"forte"},{t:"**A eleição invadiu três dos cinco perfis.** Deu o maior engajamento e a maior hostilidade (forte que ocorre, indicativo no efeito).",g:"indicativa"},{t:"**A prova está inflada em todos.** Números que não batem entre bio, site e vídeo, e superlativos sem fonte: risco de CONAR e de credibilidade.",g:"forte"},{t:"**O preço é escondido.** Só a ANEV e o Growth Play publicam preço; todo o resto passa por live,
