.219",posts:"8,7 por semana",engaj:"0,02%",plays:"515 (0,8% da base)"},{handle:"@thiagoreis",seguidores:"1.130.966",posts:"27 entre 04/10 e 19/10",engaj:"0,01% (não comparável)",plays:"15.977 (1,4% da base)",nota:"23 de 30 posts ocultam curtidas."}],resumo:["É o concorrente mais completo do território: escada do gratuito (lives diárias, desafio, diagnóstico) a programas de 90 dias (PEC) e 6 meses (10X IA), com software próprio de IA comercial (Prospct.ai, GS Engage, Station IA).","O carro-chefe de 2026 é o 10X IA: diagnóstico, 3 dias presenciais na Arena e 6 meses de “operação assistida” com assessoria coletiva semanal, vendido por aplicação, com preço revelado só no diagnóstico.","O discurso é de execução, mas os termos de uso tratam tudo como “mera obrigação de meio” e a página da Arena diz: “A implementação é do seu time”.","O ICP declarado é o da Triad. Safra e coorte estão livres; o blog chega perto ao perguntar pelos leads “que já entraram este mês”, sem relógio nem método.","O alcance vem do Thiago e de mídia paga. O perfil da empresa tem mediana de 515 plays e carrega uma acusação pública de “assédio”, repetida em 8 posts."],ofertaTopo:{nome:"10X IA",texto:"Diagnóstico profundo da operação, 3 dias na Arena “com os seus números na mesa, ao lado de outros donos no mesmo estágio” e 6 meses de Station IA, GS Engage, Growth Play e assessorias coletivas semanais.",preco:"Oculto: “Condições e formato da próxima turma são apresentados no diagnóstico gratuito.” Âncora indireta: o exemplo de R$ 50 mil por 90 dias num artigo do blog, que não é preço publicado.",executa:"O time do cliente. O consultor de negócios faz o onboarding e acompanha a adoção do software.",garantia:"Nenhuma na página. Termos de uso: “mera obrigação de meio e não obrigação de fim”."},escada:[{produto:"Lives “Treinamento de Vendas ao Vivo”",formato:"YouTube, de segunda a sexta, 8h",preco:"Grátis",condicoes:"1 hora por dia, com grupo de WhatsApp"},{produto:"Diagnóstico gratuito (“sessão estratégica”)",formato:"Call de 30 minutos",preco:"“100% gratuito e sem compromisso”",condicoes:"Versão para IA: “receita entre R$ 3M e R$ 15M”"},{produto:"Desafio Escala Comercial",formato:"3 aulas online ao vivo",preco:"Gratuito",condicoes:"27 a 29/10, 19h; entrega o “Plano de Crescimento 2027”"},{produto:"Growth Play",formato:"Streaming de cursos e mentorias",preco:"R$ 134,88 por mês ou R$ 997 à vista no anual",condicoes:"7 dias de garantia incondicional"},{produto:"Prospct.ai",formato:"SDR de IA por voz e WhatsApp",preco:"Por crédito consumido; “3x mais barato que 1 SDR”",condicoes:"Operações acima de 10.000 leads por mês; não fecha venda"},{produto:"Imersão Closer",formato:"Presencial em SP, 2 dias",preco:"“depende do tamanho do seu time e da turma”",condicoes:"Para quem tem 2 ou mais vendedores"},{produto:"Arena de Crescimento",formato:"3 dias presenciais com mentores",preco:"Não informado",condicoes:"“processo comercial 100% implementado”, e na mesma página “o escopo da Arena termina no evento”"},{produto:"PEC (Programa de Expansão Comercial)",formato:"90 dias: Arena e mentoria online",preco:"Sem página. No blog: “Seu projeto de 90 dias = R$ 50 mil” (exemplo)",condicoes:"Em 2025: “Garantia de resultado” (OCR de post)"},{produto:"10X IA",formato:"Diagnóstico, Arena e 6 meses",preco:"Revelado no diagnóstico",condicoes:"Processo seletivo; garantia não declarada"},{produto:"Livro “Antes do Primeiro Cliente” (Thiago)",formato:"365 leituras, Literare Books",preco:"Não consta",condicoes:"Pré-venda desde 15/10, vendido como ideia para o kickoff de 2027"}],promessas:[{t:"A única Máquina de Vendas que te entrega mais receita menos esforço",ref:"página inicial"},{t:"Escale 10X mais rápido a sua operação comercial",ref:"10X IA"},{t:"3 dias para instalar. 6 meses para o time rodar sozinho.",ref:"10X IA"},{t:"Sua empresa pode vender sem depender de você",ref:"Arena"},{t:"SEU TIME CRESCEU. A VENDA, NÃO.",ref:"Desafio Escala Comercial"},{t:"Em apenas 90 dias, tenha uma operação de vendas capaz de aumentar seu faturamento em até 30%.",ref:"PEC, 2025"}],ideia:"Vender é executar processo todo dia: “Resultado você não controla diretamente. Execução, sim.” (Thiago Reis)",problema:[{t:"Seu vendedor não está improdutivo, o seu processo está",ref:"post"},{t:"O gargalo nunca foi o topo do funil. É o que acontece depois que o lead entra.",ref:"10X IA"},{t:"Tem critério de entrada nas etapas, mas não tem critério de saída.",ref:"blog, 5 vazamentos"},{t:"O problema começa quando a empresa acredita que precisa de mais leads, quando, na verdade, precisa melhorar a capacidade de conversão do próprio time.",a:"Thiago Reis"}],solucao:"Processo antes de ferramenta (“automatizar processo ruim só faz a bagunça acontecer mais rápido”), o Método 3E (Estrutura, Execução, Eficiência) e IA “assistida”. No perfil do Thiago: atividade medida, daily de 15 minutos e o ritual diário do livro.",inimigos:"O “guruzinho de internet”, a “agência baratinha, fuleirinha”, as consultorias que “entregam planos e desaparecem”, o vendedor “herbívoro” e o “coach motivacional”.",funil:["Mídia paga: “A Growth mensalmente investe em algo próximo de 600 mil” para impactar 20 milhões de pessoas, gerar 4 mil oportunidades, 1.200 no funil e 120 vendas (transcrição de reel de 14/10; cerca de R$ 5 mil por venda, pela conta da pesquisa).","Palavra-chave no comentário: DIAGNÓSTICO, CONVERSÃO e MAPA na empresa; DESAFIO e ESPERA no perfil do Thiago.","Topo: lives das 8h, desafio gratuito com grupo de WhatsApp e blog que sempre fecha em diagnóstico gratuito.","Etapas: SDR inbound, closer em “reuniões de diagnóstico consultivo” com HubSpot, depois CS e mentores.","Filtros: aplicação e “Processo seletivo” (10X IA), operação comercial ativa (Arena), 2 ou mais vendedores (Imersão Closer)."],prova:{forca:"Alta em volume e em nomes de clientes, baixa em consistência.",itens:[{p:"38 cases nomeados, como Instituto ELOS, Base Viral, Limborço, Sicoob, V4 Company e Nexmuv",s:"Empresas verificáveis; números autodeclarados"},{p:"Matéria no Metrópoles; livro Demanda Infinita",s:"Verificáveis em princípio"},{p:"“+R$ 3.4 BI em receita gerada” (bio do Thiago)",s:"Autodeclarado"},{p:"“25% da receita da Growth Machine vem de oportunidades ‘perdidas’ nos últimos 90 dias” (blog)",s:"Autodeclarado"}],contradicoes:["Receita gerada para clientes: R$ 2 bi, R$ 2,2 bi, R$ 3,4 bi e R$ 3,6 bi, conforme a página.","Empresas atendidas: 4.000, 5.000 e mais de 8.000.","Time de mais de 140 pessoas contra mais de 50; fundação em 2017 contra 2018.","Os três mesmos comentários de 2023 aparecem sob todos os artigos de 2026 do blog: prova social de template (forte)."]},publico:{conclusao:"Os comentários não mostram o ICP. A audiência orgânica da empresa é pequena e em parte interna; no perfil do Thiago, quem comenta é vendedor e público de massa (contas de negócio, cerca de 4%). Já as páginas miram exatamente o ICP da Triad (forte).",cits:[{t:"Como é que eu faço pra vocês pararem de me incomodar?? [...] Isso é um assédio nojento!!!",a:"@sued_sarkis"},{t:"Irmão na boa!!! Sábado uma hora dessa, ligando para quem já pediu 30 vezes para sair da sua lista !! Na boa meu velho, chega!!",a:"@leonavarrooficial",ref:"no perfil de Thiago Reis"},{t:"CAC e receita, sempre, e de preferência por canal e por coorte. CPL baixo com conversão baixa só empurra o custo para o time de vendas.",a:"@growth.conf",ref:"a única “coorte” do acervo"},{t:"Gatilho mais velho que o sol do dia kkk esse coach ai de vendas kkkk pelamor",a:"@rodrigoaiosa",ref:"no perfil de Thiago Reis"}]},territorios:{a:{s:"livre",e:"Ninguém trata o mês de captação como coorte com relógio próprio. Thiago nomeia o sintoma sem a ferramenta: “aquele mês que do nada ninguém sabe explicar”."},b:{s:"ocupa",e:"“Meça a conversão por etapa”; “Onde o funil vaza, onde o time trava, onde a receita some” (10X IA)."},c:{s:"tangencia",e:"Discurso de “lado a lado”; a entrega é evento, software e encontro coletivo: “A implementação é do seu time”."},d:{s:"ocupa",e:"Prospct.ai (SDR de IA), cadência e scripts. Não vendem CRM."},e:{s:"tangencia",e:"“Assessorias Coletivas Semanais”. O próprio blog conta que só 2% usavam a consultoria de acompanhamento de um programa de alto valor."},f:{s:"ocupa",e:"Imersão Closer com certificação; Growth Play com trilhas de SDR, closer e gestor."},g:{s:"ocupa",e:"10X IA, Arena, Imersão Closer e Desafio falam com o dono, em linguagem de B2B e SaaS."},h:{s:"ocupa",e:"“Preencha a aplicação”; funil de SDR e closer; sessão estratégica pela DM."},i:{s:"tangencia",e:"O PEC prometia “Garantia de resultado” (2025); os termos dizem “mera obrigação de meio e não obrigação de fim”."}},forcas:["Ecossistema do ticket de R$ 134,88 ao upgrade de R$ 250 mil, com espaço próprio de eventos.","Mídia paga declarada e time comercial próprio.","Stack de IA com cases (Limborço, Ademicon, FINACI).","Um blog que já articula a dor da Triad: receita de lead que já entrou “custa entre cinco e dez vezes menos” do que a de lead novo.","Fundador com 1,1 milhão de seguidores e captação por palavra-chave que se mede."],fraquezas:["Promete execução sem execução individual.","Acusação pública de “assédio” e queixas de insistência no perfil do Thiago.","Números de escala que não batem entre si.","Contradição sobre IA: “Operação 100% automatizada” no Prospct contra “autonomia completa é um mito” no blog.","Dependência do Thiago; o perfil institucional não tem tração.","Fala a língua de B2B e SaaS, que serve mal ao dono do interior com venda consultiva (indicativa)."],brechas:["Execução individual e sênior, o “gerente do gerente”, contra o acompanhamento coletivo e o caso dos 2%.","Dizer com clareza o que não promete, contra a garantia que a página anuncia e os termos negam (“não garantimos qualquer resultado concreto”).",{t:"Safra como mecanismo novo: a conversão por etapa já tem dono; a coorte com maturação, não.",g:"forte"},{t:"Persistência com data marcada, sem pressão (o “vendedor chato”), contra a acusação pública de assédio."},"Ser a dona do “mês que ninguém sabe explicar”: cada mês tem relógio próprio.",{t:"Preço: o exemplo de R$ 50 mil por 90 dias fica ao lado dos R$ 45 mil da Triad. Sem diferença clara de execução, o comprador compara direto.",g:"forte"}],copiar:["A narrativa dos “5 vazamentos” (conversão por etapa, o custo do lead que já entrou, os “próximos 60 dias”), contada como leitura de safra.","O filtro de faturamento no nome do evento ou da VSL, e entregas do mês 1 com nome, como as 6 da Arena.","Palavra-chave com entrega concreta: o roteiro da daily rendeu 48 comentários, a “dica exclusiva”, de 0 a 4.","O bloco “o que este livro não promete”, na VSL e na página."],evitar:["Garantia na página desmentida pelos termos.","Os termos gastos como promessa principal; só como ponte de reconhecimento.","Números que mudam de peça para peça. Até haver caso auditável, [PROVA REAL: caso de cliente com números por etapa].","Recorte de terceiros e política para inflar alcance."],gastos:["Máquina de Vendas","previsibilidade","diagnóstico gratuito","sessão estratégica","gargalo","raio-x da operação","vendedor herói","vender sem depender de você","IA só acelera a bagunça","vazamento no funil","SDR de IA 24/7","10x","lado a lado","Plano de Crescimento","100 ligações por dia","desafio de três noites"],lacunas:["Preços de 10X IA, Arena, PEC, Imersão Closer, Prospct.ai e GS Engage.","A resposta do FAQ do 10X IA: “A Growth Machine executa as vendas por mim?”.","A oferta vendida no fim do desafio e os eventos de novembro e dezembro.","Reclamações de não entrega (Reclame Aqui), churn e renovação.","Se os 600 mil são reais e só mídia, e quais produtos compõem as 120 vendas."],campo:{seg:"64 mil (empresa) e 1,13 milhão (Thiago)",oferta:"10X IA: diagnóstico, 3 dias de Arena e 6 meses de “operação assistida”, com software e assessoria coletiva semanal, por aplicação",preco:"Oculto. Exemplo no blog: “Seu projeto de 90 dias = R$ 50 mil”",executa:"O time do cliente",comenta:"Vendedores, contas da casa, política"},pos:{x:8.2,y:4.4}},{id:"fullsales",nome:"Full Sales System",curto:"Full Sales",camada:"Direto",ameaca:"Alta",quem:"Yuri Barbosa, sócio fundador da Full Sales System (FSS) com Vinícius de Sá e Matheus Matuta. Vende ao dono de operação de “R$75k a R$5M+/mês”, com foco declarado em “R$300k e R$2M/mês”.",contas:[{handle:"@yuribarbosaoficial",seguidores:"114.392",posts:"29 por semana (janela de 8 dias)",engaj:"0,03%",plays:"2.811 (2,5% da base)"}],resumo:["Escada de três produtos: Treinamento Comercial (Professional, Business e Enterprise), Aceleração Full Sales (12 meses) e High Sales & Equity. Nenhum tem preço público: “Sem preço na página de propósito”.","Funil: bio, página com filtro explícito e CTA único (“Quero falar com um especialista”), reunião 1:1 por Zoom e cadência contra falta na call.","É o concorrente mais próximo da Triad em ICP, funil e formato: instalação, treinamento e tecnologia, com CRM, painel e IA de análise de call.","Exclui quem “espera que alguém faça a implementação no seu lugar”. Não tem garantia nem mecanismo de tempo ou de coorte.","No Instagram, 9 dos 30 posts recentes são campanha eleitoral; o conteúdo de vendas fica entre 576 e 1.452 plays."],ofertaTopo:{nome:"Aceleração Full Sales e High Sales & Equity",texto:"Aceleração: ciclo de 12 meses, 18 calls individuais, encontros quinzenais com os sócios e um Gestor de Sucesso, CRM implementado. High Sales & Equity: “Estrategista de Crescimento e Gestão dedicado”, acompanhamento semanal dos heads, 47 protocolos e CRM incluso.",preco:"Não publicado. Pista indireta, que não é preço da FSS: o exemplo de negociação de R$ 100 mil e “10 mil por mês”.",executa:"Squad, estrategistas, gestores e sócios, “lado a lado”. A gestão continua sendo do cliente.",garantia:"Nenhuma. Só expectativa: “começa a melhorar indicador em 30 a 60 dias”."},escada:[{produto:"Conteúdo com isca",formato:"Palavras-chave ESCALAR e ANC",preco:"Gratuito",condicoes:"Sem página coletada"},{produto:"Treinamento Comercial · Professional",formato:"Universidade comercial EAD com gamificação",preco:"Sem preço",condicoes:"Até 5 licenças; treino diário de 2 a 4 vezes"},{produto:"Treinamento Comercial · Business",formato:"Professional, mais tutorias e análise de call",preco:"Sem preço",condicoes:"“Mais escolhido”; 2 análises de call por mês; IA de análise de call (8 logins)"},{produto:"Treinamento Comercial · Enterprise",formato:"Business, mais formação de heads",preco:"Sem preço",condicoes:"Mastermind de heads semanal; 12 licenças"},{produto:"Aceleração Full Sales",formato:"Instalação guiada com assessoria",preco:"Sem preço",condicoes:"12 meses; 18 calls individuais; encontros quinzenais"},{produto:"High Sales & Equity",formato:"Proximidade com os sócios e o Squad",preco:"Sem preço",condicoes:"Estrategista dedicado; CRM incluso; duração não declarada"}],promessas:[{t:"Nós instalamos os processos comerciais completos na sua operação e treinamos seu time na aplicação, pra você crescer sem depender de talentos.",ref:"título do site"},{t:"Empresários me seguem aqui para fechar vendas de alto valor sem depender de follow up.",ref:"bio"},{t:"eu ajudo o empresário a vender mais e melhor",ref:"posts"}],ideia:"“O problema da sua empresa é estrutural, não comportamental.” e “O problema não está no vendedor. Nem no tráfego. Estão nos processos comerciais que faltam.”",problema:[{t:"Tudo depende do vendedor estrela",ref:"site, os vazamentos"},{t:"Tudo está na cabeça, nada está no papel",ref:"site"},{t:"Tráfego pago é caixa-preta cara",ref:"site"},{t:"automatizar o problema só te dá problema com dashboard bonito.",ref:"site, sobre as “4 mentiras”"}],solucao:"As “6 engrenagens” conectadas “na ordem certa” (funis, indicação e recompra, RH comercial, escada de valor, closers, setters), sobre os 3 pilares Instalação, Treinamento e Tecnologia, com o Squad executando junto.",inimigos:"O vendedor estrela, o “treinamento solto, contratação solta, tráfego solto e CRM solto”, o curso, o “PDF que aperta a mão e some” e o “achismo”.",funil:["Bio com o botão “Agendar Reunião” e um diagnóstico com UTM; a página do site repete um CTA único 10 vezes.","Pop-up de saída: “Sua empresa depende de pessoa ou de processos comerciais?”.","Reunião 1:1 com especialista, por Zoom (“leve quem precisar”), com escassez por agenda: “Vagas limitadas por mês.”","Cadência depois do agendamento: 4 e-mails, SMS no dia, ligação de lembrete e grupo de WhatsApp com SDR e closer.","Filtro explícito: “Você fatura R$75k+/mês de forma consistente” e “volte daqui 6 meses, vai estar pronto”."],prova:{forca:"Alta em volume e em endosso, média em verificabilidade.",itens:[{p:"“700+ clientes com processos instalados”; “R$ 850 milhões em resultados gerados para os clientes”",s:"Autodeclarado"},{p:"Endosso de Alfredo Soares (G4) e de Fernando Miranda (Staage e V4): “+37% nas vendas da V4 Company”",s:"Verificável em tese; número autodeclarado"},{p:"“Mais de 70% dos nossos cases dobraram ou triplicaram receita em 6 a 12 meses”",s:"Autodeclarado; o denominador não é definido"},{p:"“★★★★★ 4.9”",s:"Sem fonte"}],contradicoes:["R$ 87 milhões contra R$ 110 milhões ou mais em faturamento próprio dos sócios, na mesma página.","3 anos de empresa (vídeo) contra 10 anos (site); “700+ clientes” contra “mais de 675 empresários” no grupo."]},publico:{conclusao:"Quem comenta não é o ICP da Triad (forte para os comentários, moderada para a base): eleitores (cerca de 80%), candidatos a vendedor e profissionais de pré-vendas. O ICP aparece no site, não na conversa do Instagram.",cits:[{t:"Você contrataria alguém que vota no Lula? @yuribarbosaoficial",a:"@eusoujacksonborges"},{t:"Mais melhor não moço 🤦🏼‍♀️ Assassinou o português aí !!!",a:"@dicasdebebel"},{t:"👏👏👏 Mandei direct!",a:"@lizfelicianoo"}]},territorios:{a:{s:"livre",e:"Nenhuma menção. A FSS fala de “processos” e “engrenagens”, não de tempo nem de coorte."},b:{s:"ocupa",e:"“Painel gerencial”; “Você olha o painel na segunda-feira e sabe quanto vai fechar até o fim do mês”; taxa de agendamento e no-show."},c:{s:"tangencia",r:"Ocupa o “feito com”; livre o “feito para”",e:"“instalam lado a lado com você, em sprints de execução conjunta”, mas exclui quem “espera que alguém faça a implementação no seu lugar”."},d:{s:"ocupa",r:"Ocupa em parte",e:"CRM incluso, IA de análise de call e painel. Sem SDR por IA, agente de WhatsApp ou follow-up por IA."},e:{s:"ocupa",e:"Ciclo de 12 meses, Gestor de Sucesso, estrategista dedicado no plano de topo. Não é head as a service: a gestão continua com o cliente."},f:{s:"ocupa",e:"Engrenagem RH Comercial (“onboarding que entrega closer pronto em 30 dias”), três planos de treinamento e recrutamento próprio."},g:{s:"ocupa",e:"“operações de R$75k a R$5M+/mês”; o foco em R$ 300 mil a R$ 2 milhões cobre quase toda a faixa do Rafa."},h:{s:"ocupa",e:"CTA único para reunião 1:1, sem preço na página, cadência anti no-show."},i:{s:"livre",e:"Nenhuma garantia; só prazos de expectativa (“a dobra de faturamento nos cases costuma vir entre 6 e 12 meses”)."}},forcas:["Página de venda completa e bem amarrada: dor, mentiras, virada, produto, engrenagens, prova, escada, filtro e FAQ.","Filtro de faturamento explícito, com “volte daqui 6 meses”.","Cadência anti no-show já operando.","Endossos do ecossistema (G4, V4 e Staage) e time comercial próprio com cinco funções.","Uso da parcela na negociação de ticket alto."],fraquezas:["Política em 9 de 30 posts; o próprio Yuri admite: “Eu sei que eu vou perder muito seguidor”.","Números inconsistentes na mesma página.","Muito ensino: EAD, “universidade comercial”, treinos diários e gamificação.","O dono continua com o trabalho: precisa implementar e tomar “decisões difíceis”.","Tensão no discurso: “Squad executando junto” contra “não é pra quem espera que alguém faça no seu lugar”."],brechas:["“Feito para e dentro”, com responsabilidade de gestão: o “gerente do gerente” que assume a rotina comercial.","Não ensinar: “zero aula para o seu time; gestão rodando toda semana”, alinhado à regra do Júnior.",{t:"Mecanismo de tempo e coorte: a FSS vende engrenagens sem dimensão temporal.",g:"forte"},"IA que opera, não só analisa, apresentada como braço da gestão, sem cair na mentira número 4 da FSS (“trocar de CRM e implementar automação”).","Mostrar o escopo por escrito, entrega a entrega, em vez de repetir “sem letra miúda”.",{t:"Neutralidade e sobriedade: um especialista sem polêmica e com números consistentes.",g:"indicativa"},"Alerta de rede: Fernando Miranda (Staage) endossa a FSS. Mapear essa relação antes de citar Staage como prova."],copiar:["O bloco “É pra você se / NÃO é pra você se”, com faturamento mínimo e “volte daqui 6 meses”, adaptado: leads entrando, 2 ou mais vendedores, venda consultiva acima de R$ 10 mil.","A cadência anti no-show (e-mails, SMS, ligação de lembrete, grupo com SDR e closer) no funil de aplicação e call.","A FAQ “Posso convidar meu sócio?” e o foco de faturamento declarado.","A apresentação pela parcela, para tickets como R$ 45 mil."],evitar:["“processos comerciais”, “vendedor estrela”, “máquina de receita previsível”, “não é curso” e “sem letra miúda”.","A lista “4 mentiras” como estrutura, que já é marca dela.","Política, números inconsistentes e escada inflada de treinamento: o ICP rejeita conteúdo."],gastos:["processos comerciais","vendedor estrela","vender sem depender de talentos","máquina de receita previsível","previsível, escalável e lucrativo","vender mais e melhor","instalar processos","não é curso","estrutural, não comportamental","Sem letra miúda e sem pegadinha"],lacunas:["As perguntas do formulário de aplicação (páginas não coletadas).","Preço, contrato, garantia ou multa de qualquer produto.","Duração do High Sales & Equity e o que significa “Equity”.","Datas do Full Sales Experience; Reclame Aqui e anúncios."],campo:{seg:"114 mil",oferta:"Aceleração Full Sales (12 meses, 18 calls individuais, encontros quinzenais) e High Sales & Equity (estrategista dedicado, CRM incluso)",preco:"“Sem preço na página de propósito”",executa:"Squad “lado a lado”; exclui quem quer que façam por ele",comenta:"Eleitores (cerca de 80%), candidatos a vendedor"},pos:{x:9.3,y:6.1}},{id:"lucas",nome:"Lucas Torres (Legacy)",curto:"Lucas Torres",camada:"Direto",ameaca:"Média a alta",quem:"Empresário verificado, fundador do Grupo Legacy. Vende por aplicação a Consultoria Estratégica para quem fatura “acima de R$ 100 mil por mês” e tem time comercial.",contas:[{handle:"@lucastorres",seguidores:"341.969",posts:"10 por semana",engaj:"0,22%",plays:"136.540 (39,9% da base)",nota:"A maior mediana de plays do conjunto."}],resumo:["No papel é o formato mais parecido com o da Triad: “Análise Estratégica” (diagnóstico), “Arquitetura” e “Condução” (implantação com o time até rodar).","A dor nomeada é a da Triad: “Marketing gera oportunidades. Vendas não converte na proporção.”","O mecanismo é outro: psicologia da decisão, posicionamento e marca. Em 30 posts e 3 páginas, nenhuma menção a CRM, IA, SDR, painel, meta por etapa ou safra, e nada de preço, prazo ou garantia.","Maior alcance do conjunto, mas quem comenta é público de massa e nenhum post chama para venda. Quatro reels comerciais sugerem distribuição paga (moderada).","Capta com o quiz Raio-X Legacy, que devolve “Nota Comercial”, “3 gargalos” e “a conta da sua meta” e já pergunta: “Você já investiu em mentoria ou consultoria antes? O que faltou para dar certo?”."],ofertaTopo:{nome:"Consultoria Estratégica",texto:"“o processo comercial completo da sua empresa, do posicionamento e da construção de marca que preparam a decisão até a primeira conversa e o fechamento, instalado no seu time e acompanhado de perto até rodar sem depender de você.”",preco:"Não há preço em todo o corpus.",executa:"Ele, “conduzido por quem vendeu”. Nenhuma equipe aparece. “A consultoria conduz junto, não no seu lugar”.",garantia:"Nenhuma. Prazo não declarado (“até rodar”)."},escada:[{produto:"Raio-X Legacy",formato:"Quiz de “10 perguntas rápidas”, cerca de 3 minutos",preco:"“O diagnóstico é gratuito.”",condicoes:"Pede nome, e-mail e WhatsApp antes do resultado"},{produto:"Mentoria com aulas",formato:"Não descrita",preco:"Não coletado",condicoes:"Só aparece como rótulo de depoimentos"},{produto:"Palestras",formato:"Não descrito",preco:"Não coletado",condicoes:"Citadas em legendas"},{produto:"Consultoria Estratégica",formato:"Aplicação, avaliação, conversa e três etapas",preco:"Não publicado",condicoes:"Acima de R$ 100 mil por mês e time comercial; “Nem todas avançam para a próxima etapa.”"}],promessas:[{t:"Ensino empresários a vender com mais autoridade, margem e previsibilidade",ref:"bio"},{t:"Sua empresa cresceu. A arquitetura de vendas precisa acompanhar.",ref:"site"},{t:"Descubra o que trava o crescimento da sua empresa",ref:"quiz"}],ideia:"“A venda não acontece no discurso. Ela acontece no sistema nervoso do cliente.” e “Nada disso se resolve com mais leads, mais script ou mais pressão sobre o time. Se resolve com arquitetura.”",problema:[{t:"Marketing gera oportunidades. Vendas não converte na proporção.",ref:"site: “o fechamento segue imprevisível de um mês para o outro”"},{t:"O comercial ainda depende do dono.",ref:"site"},{t:"A decisão do cliente se arrasta.",ref:"site"},{t:"Se o seu processo tem defeito, 100 ligações produzem 100 conversas defeituosas.",ref:"transcrição de vídeo"}],solucao:"Uma arquitetura que junta posicionamento, marca e processo, com condução lado a lado com o time. No conteúdo, enquadrar preço e decisão pela psicologia do consumo: “venda cara não se justifica se enquadra”.",inimigos:"Volume sem processo, insistência (“Quanto mais você insiste, mais você repede seus clientes”, grafia original), desconto, o “talento em vendas”, os “scripts enlatados” e o “treinamento genérico”.",funil:["Topo: reels de alto alcance sem nenhum CTA de venda; a conta não é comercial e tudo depende do link da bio.","Porta 1, aplicação: formulário curto, análise de cada aplicação e convite para a conversa por WhatsApp ou e-mail.","Porta 2, Raio-X Legacy: 10 perguntas, captura de nome, e-mail e WhatsApp, saída com nota, 3 gargalos, a conta da meta e o potencial de faturamento.","LGPD (indicativa): “Seus dados servem só para enviar o resultado” contradiz “ajuda nosso time a te atender melhor”.","Quatro reels comerciais com 0,03% a 0,05% de curtidas sobre plays, contra 0,89% na conta: distribuição paga ou teste (moderada)."],prova:{forca:"Fraca como prova de resultado da consultoria; forte como autoridade percebida.",itens:[{p:"“R$ 1,4 bi em vendas conduzidas ao longo da carreira”",s:"Autodeclarado; ora é dele, ora é do método"},{p:"“4.000+ negociações de alto valor fechadas”; “20 anos”",s:"Autodeclarado"},{p:"Depoimentos do grupo da mentoria, “Nomes preservados”",s:"Não coletados; anônimos por declaração"},{p:"Ciência e marcas citadas (Kahneman, MIT, Uber, Stanley)",s:"Autoridade emprestada; precisão não verificável"}],contradicoes:["Nenhum case de cliente com nome, setor ou número, nem logo ou mídia."]},publico:{conclusao:"Na média, não é o ICP: o comentário típico vem do consumidor final. O ICP pode estar entre os que assistem calados e entrar pelo Raio-X (não avaliável).",cits:[{t:"Orçamentos planilhados no valor de 7.369 jogado pra 7500. Isso é correto?",a:"@flcirilo"},{t:"Roteiro de ChatGPT kkkkkk",a:"@filipebritto.design"},{t:"E porque você não faz isso já que é tão facil 🤷‍♂️você só sabe falar falar bonitinho 🤔",a:"@bludelivery_br"}]},territorios:{a:{s:"livre",e:"Nenhuma menção em posts, páginas ou quiz."},b:{s:"tangencia",e:"“Onde a oportunidade nasce, onde ela morre e por quê” e “Clientes necessários por mês, no seu ticket”: leitura e conta reversa no agregado, sem meta por etapa."},c:{s:"ocupa",e:"“instalado no seu time e acompanhado de perto”. Ressalvas: “conduz junto, não no seu lugar” e a bio “Ensino empresários”."},d:{s:"livre",e:"Nenhuma ocorrência de CRM, IA, SDR, closer ou painel."},e:{s:"tangencia",e:"Acompanha “até o processo rodar sem depender do dono”; não há recorrência nem figura de head as a service."},f:{s:"tangencia",e:"Ensina empresários; não fala em recrutar nem formar vendedores."},g:{s:"ocupa",e:"“acima de R$ 100 mil por mês e tem um time comercial, mesmo que pequeno”."},h:{s:"ocupa",e:"Aplicação, avaliação (“Nem todas avançam”) e conversa; postura de “seleção”."},i:{s:"livre",e:"Nenhuma. A palavra “garantia” só aparece a propósito da Stanley."}},forcas:["Distribuição: a maior mediana de plays do conjunto, 10 posts por semana, roteiro e acabamento consistentes.","Página bem construída: “É para você se / Não é para você se”, processo de aplicação explicado, escassez por seleção.","Quiz que entrega valor na hora e ainda coleta a objeção de quem já se queimou.","Afinidade cultural com o Rafa: fé, disciplina, família e “Espiritualidade Aplicada à Performance”."],fraquezas:["Nenhum case de consultoria; números de carreira autodeclarados.","Público de massa, com céticos, e zero conversa de venda nos posts.","Alcance comercial possivelmente pago (moderada).","Escopo difuso: marketing, marca, processo, neuropsicologia e espiritualidade na mesma oferta.","Risco percebido alto: sem preço, prazo, garantia nem entregável nomeado, para quem já se queimou."],brechas:["Número no lugar de narrativa: gestão por safra, meta por etapa e leitura de trás para frente.","Continuidade: ele sai quando o processo “roda”; a Triad segue com o GSAAS.","Escopo sem letra miúda: publicar o que entra, o prazo e o critério de pronto de cada entrega.",{t:"Quiz que pede leads, agendados, realizados e vendas por mês e mostra em que etapa o funil quebra. Pela regra de vocabulário, “safra” só entra depois de o mecanismo ser explicado."},"Prova de operação: painel e safra reais, com autorização, onde ele mostra Stanley e Lululemon.","IA dentro da operação: livre nele, mas desgastada por Diego Vicente e pela Growth Machine. Meio, não promessa.","Ameaça: se ele puser painel, CRM e IA na “Condução”, ocupa a proposta da Triad com cinco vezes o alcance mediano do Júnior."],copiar:["O bloco “É para você se / Não é para você se”, com corte de faturamento e de time, incluindo algo como “não é para quem quer aprender a vender”.","Quiz de 3 minutos com saída numérica e a pergunta sobre experiências anteriores, com perguntas por etapa e finalidade de dados honesta.","O roteiro “caso conhecido, princípio com nome, traz para o seu negócio, pergunta”, trocando a marca de luxo por bastidor de operação comercial.","Escassez por seleção, não urgência agressiva."],evitar:["Posicionamento e marca no escopo da Triad: é o território dele, e o Júnior e o Otavio vêm do branding.","Números de carreira sem case, e alcance sem CTA."],gastos:["processo previsível","previsibilidade","estruturação e condução comercial","arquitetura de vendas","arquitetura de decisão","sem depender do dono","empresário de elite","Análise Estratégica","diagnóstico gratuito em 3 minutos","Nota Comercial","venda é seleção"],lacunas:["As perguntas do Typeform e os critérios de avaliação.","Preço, prazo, cadência, equipe e entregáveis da consultoria; recorrência depois que o processo “roda”.","Se os 4 reels anômalos são anúncio ou teste; a verba de mídia.","O que é o Grupo Legacy (empresas, CNPJ, equipe) e a relação com o G4 Club."],campo:{seg:"342 mil",oferta:"Consultoria Estratégica (análise, arquitetura e condução “até rodar”), por aplicação, para quem fatura acima de R$ 100 mil por mês",preco:"Não publicado",executa:"Ele, “conduz junto”",comenta:"Consumidor final, fãs"},pos:{x:8.4,y:5.6}},{id:"dmb",nome:"DMB (Giovanne Saraiva)",curto:"DMB",camada:"Direto",ameaca:"Média",quem:"Giovanne Saraiva, fundador da DMB, nome de 2026 da Destruindo Metas (Máquina de Prospecção, Hunters Black, High Club, DME). Agora se apresenta como “Implementadora Comercial”.",contas:[{handle:"@giovannesaraiva",seguidores:"249.433",posts:"17,8 por semana",engaj:"0,08%",plays:"7.352 (2,9% da base)"},{handle:"@dmb.sales",seguidores:"3.811",posts:"2,0 por semana",engaj:"0,46%",plays:"1.490",nota:"Ficou dois meses sem postar (julho a setembro)."}],resumo:["O perfil pessoal gera a demanda; a conta da empresa é vitrine institucional e não move audiência.","Em outubro de 2026, o conteúdo fala ao dono B2B com gerente, vendedores e SDR: previsão de vendas, conta de trás pra frente, comparecimento, comissão, régua de desconto e onboarding.","A prova vem quase toda de mentoria em grupo com donos de agência de marketing pequena. A de “implementação dentro da operação” se resume a um caso (Gabriela Cardoso).","Nenhum preço é público e não há garantia. A IA comercial aparece pouco.","Coorte e safra não aparecem, mas ele tangencia o relógio: “Negócio que não andou em 2 semanas sai” da previsão."],ofertaTopo:{nome:"Programas de implementação comercial",texto:"“estrutura processo, discurso e time comercial”. Escopo declarado: “posicionamento, oferta, processo comercial, aquisição, abordagem, discurso de vendas, gestão e experiência do cliente”. Rotina vista nos prints: grupo de WhatsApp por cliente, cronograma, calls com Giovanne, roteiros R1 e R2.",preco:"Não publicado.",executa:"O cliente, em grupos e calls: “ainda não conseguir implantar r1 e r2” (depoimento).",garantia:"Nenhuma."},escada:[{produto:"Planilhas e KIT COMERCIAL DMB",formato:"Iscas por palavra-chave (#8044, #4088, KITDMB)",preco:"Grátis",condicoes:"Entregues no direct"},{produto:"Diagnóstico Comercial",formato:"Call de 30 minutos com “plano prático”",preco:"“100% gratuito”",condicoes:"“Estamos abrindo aplicações”"},{produto:"Hunters Black (2022)",formato:"Aceleração que os clientes chamam de “mentoria”",preco:"Não informado",condicoes:"Um cliente cita “9 meses de mentoria”"},{produto:"High Club",formato:"Mastermind “mais premium”; encontro de 3 dias em SP",preco:"Não informado",condicoes:"Sem data"},{produto:"DME (Destruindo Metas Experience)",formato:"Imersão presencial",preco:"Não informado",condicoes:"Entrega de placas por faturamento"},{produto:"Programas de implementação comercial",formato:"Escopo não público",preco:"Não informado",condicoes:"“comente #IMPLEMENTAR”"}],promessas:[{t:"Venda mais, Viva mais",ref:"bio"},{t:"execução, método e previsibilidade para negócios B2B",ref:"post"},{t:"A DMB entra na água com você.",ref:"post"},{t:"plano prático de como gerar, converter e reter receita",ref:"post"}],ideia:"“a gente não vive de palco, a gente vive de implementação” e “A MAIORIA DAS ASSESSORIAS DE VENDAS ENSINA A SUA EMPRESA A NADAR E ACOMPANHA DA BEIRA DA PISCINA.”",problema:[{t:"Do lead em diante, ninguém conta.",ref:"post"},{t:"faturamento é indicador atrasado",ref:"post"},{t:"o problema não é a falta de leads no funil",ref:"outro post diz o oposto para o pequeno: duas mensagens para dois públicos (moderada)"}],solucao:"Regras operacionais “instaladas”: conta de trás pra frente até a meta diária, previsão só com proposta apresentada e data de decisão combinada, comparecimento de “8 em cada 10”, comissão parcelada e régua de desconto (“Até 5%, o vendedor decide”).",inimigos:"O “Guru de Vendas No Instagram”, as assessorias que ensinam “da beira da piscina”, a “Planilha de Excel”, o mito “Vender é dom” e o dono que vira gargalo.",funil:["Palavra-chave no comentário com isca no direct (#8044, #4088, KITDMB, #bolten). Num dos posts, os 9 comentários amostrados são “#4088”.","Diagnóstico: “Comenta #1410 que meu time agenda um Diagnóstico Comercial gratuito: 30 minutos pra achar o ponto cego e sair com um plano de ação”.","Closer com ancoragem por choque: um valor alto “pra assustar o cliente e depois mostrar o preço real” (depoimento de mentorado).","Nenhum filtro público de faturamento ou de time; o ICP só aparece como critério interno de prospecção."],prova:{forca:"Alta em volume e em prova social de grupo, média em verificabilidade.",itens:[{p:"Trajetória no LinkedIn: Head of Inside Sales na ReachLocal e na Mobcall; gerente comercial",s:"Verificável"},{p:"Top 20 influenciadores de vendas da Favikon",s:"Verificável"},{p:"“+2 mil operações comerciais estruturadas”, “+R$460M gerados”",s:"Autodeclarado"},{p:"Cerca de 39 prints de WhatsApp com contratos e MRR",s:"Autodeclarado por terceiros"}],contradicoes:["Os números crescem de fonte para fonte: 1.000 casos, 8 mil alunos, 2 mil operações; R$ 50 milhões, 300 milhões, 460 milhões.","Nenhum caso com antes e depois por etapa do funil."]},publico:{conclusao:"Os comentários não mostram o ICP (indicativa). Os virais atraem críticos de patrão; as iscas, leads anônimos. Os depoimentos mostram outro público: o “dono pequeno de agência que precisa prospectar”.",cits:[{t:"Na qualificação do SDR tem alguma dica para saber se o lead possui condições financeiras e prioridade para estar investindo?",a:"@otaviohribeiro_"},{t:"E registra o motivo de perda no CRM.",a:"@oroberto.sampaio"},{t:"A maioria vende como plano pratico mas eh 90% motivacional e pitch de vendas",a:"cliente, sobre eventos",ref:"página de depoimentos"}]},territorios:{a:{s:"tangencia",e:"O conceito está livre (sem coorte, safra ou maturação), mas ele ocupa a previsibilidade: “Negócio que não andou em 2 semanas sai da previsão”; “Riqueza é saber em outubro quanto entra em dezembro.”."},b:{s:"ocupa",e:"Conta reversa até “7 REUNIÕES” por dia; “eu faço a conta de trás pra frente”; “Cada passagem aponta um problema diferente”."},c:{s:"ocupa",r:"Ocupa no discurso",e:"“Implementadora Comercial”, “A DMB entra na água com você”. A prova, porém, é de ensino: turmas, cronograma, “mentoria”."},d:{s:"tangencia",e:"CRM próprio e parceria com a Bolten; não oferece SDR por IA, agentes nem análise de call."},e:{s:"tangencia",e:"“suporte”, calls e mastermind; sem gerente as a service."},f:{s:"ocupa",e:"Onboarding, remuneração, demissão e “fluxo de contratação” no kit."},g:{s:"ocupa",e:"O conteúdo de 2026 fala ao dono (“manda pro teu gerente comercial”); a prova histórica está abaixo do ICP."},h:{s:"ocupa",e:"“abrindo aplicações”, diagnóstico de 30 minutos e closer."},i:{s:"livre",e:"Nenhuma garantia."}},forcas:["Credencial nativa de gestão comercial (Head of Inside Sales), que o Júnior não tem em público.","17,8 posts por semana, com conteúdo prático e numérico.","Comunidade com ritual: placas, palco, grupos.","Funil de isca que converte comentário em direct (1.603 curtidas)."],fraquezas:["Implementação prometida, ensino entregue: o cliente executa sozinho.","Prova concentrada em agências pequenas e em MRR baixo.","Números autodeclarados e crescentes; dependência total do fundador.","Ancoragem de choque na venda, que o ICP da Triad rejeita.","Sem preço, garantia nem métrica de entrega."],brechas:["Safra e maturação como mecanismo próprio: a previsão dele é por negócio, não por coorte.","Execução comprovada dentro da operação: operador, rotina e números por etapa. Ele só tem um caso de longo prazo.","IA comercial com SDR, agentes e análise de call, livre nele.","Escopo claro e o bloco “o que a Triad não promete”, para responder ao “sem letra miúda” do Rafa.","Filtro explícito de faturamento e de time, que ele não usa em público."],copiar:[{t:"O carrossel “regra que eu instalo”, com números, uma decisão de dono e uma planilha por palavra-chave. Para o Júnior, a “Planilha da Safra”, usada depois de o mecanismo ser explicado."},"O diagnóstico como porta de entrada, com filtro de faturamento e de time antes da call.","O ritual de reconhecimento (placas, prints de “tocar o sino”), com uma prova melhor: a curva da safra antes e depois, por etapa."],evitar:["“implementadora”, “entra na água”, “de trás pra frente”, “conta reversa” e “previsibilidade” como promessa principal.","A provocação a favor do dono e o conteúdo político.","O ângulo “anti-guru”, que ele já usa."],gastos:["Implementadora Comercial","entra na água com você","máquina de prospecção","máquina comercial","previsibilidade","processo engole o talento","Vender é dom","conta reversa","de trás pra frente","diagnóstico comercial gratuito","plano prático","dono gargalo","aceleradora de vendas B2B"],lacunas:["Preços, duração e contrato de todos os produtos.","O que são NEXUS, BLACK e High Club; o significado da sigla DMB e a data da troca de marca.","Anúncios pagos, páginas de venda e o tamanho da equipe que entrega.","Casos do posicionamento de 2026: os depoimentos vão até junho de 2025."],campo:{seg:"249 mil (pessoal) e 3,8 mil (empresa)",oferta:"“Implementadora Comercial”: programas sem escopo público, porta de diagnóstico de 30 minutos",preco:"Não publicado",executa:"O cliente, em grupos e calls",comenta:"Críticos de patrão, leads de isca"},pos:{x:7.4,y:3.6}},{id:"diego",nome:"Diego Vicente (MMV)",curto:"Diego Vicente",camada:"Adjacente",ameaca:"Média, com risco de rede",quem:"Ex-diretor comercial do grupo de Pablo Marçal (“Em 2025 eu assumi a direção do setor comercial do Pablo”). Vende o MMV, imersão de 2 dias em Alphaville assinada “Diego Vicente & Pablo Marçal”.",contas:[{handle:"@diegovicente_",seguidores:"104.928",posts:"cerca de 13,5 por semana em outubro",engaj:"0,01%",plays:"840 (0,8% da base)"}],resumo:["Escada: Playbook em PDF (R$ 19,90), ingressos Select e Elite do MMV (preço não coletado), diagnóstico que leva a uma “implementação comercial”, treino de time e palestra.","Já promete o núcleo da Triad: SDR por IA (“a Marina, nossa IA”) e um gerente comercial que “já é uma IA”, para “sair de lá do evento com isso aqui funcionando dentro da sua operação”.","O alcance orgânico é quase nulo para 105 mil seguidores; só escapam o carrossel com Marçal e um reel político.","A prova é farta e inconsistente (1.500, 2.000 ou 2.500 empresas; 20, 25 ou 36 anos de trajetória) e depende de Marçal.","Para a Triad, é menos um rival de formato e mais o sinal de que “estruturação comercial com IA” já está gasto."],ofertaTopo:{nome:"MMV, Método Multiplicador de Vendas",texto:"Evento de treinamento vendido com linguagem de implementação (forte): “Dois dias dedicados a implementar na sua empresa o sistema de vendas”, em três engrenagens: Atração, Conversão e Performance. “Este não é um evento motivacional”.",preco:"Não aparece. A única pista: “tem uma condição especial pra esse evento”.",executa:"Diego no palco. A implementação de verdade é outro produto, vendido no diagnóstico e fechado por ele (moderada).",garantia:"“Garantia incondicional”: reembolso se, ao fim da imersão, o participante não identificar que o método vai ajudar."},escada:[{produto:"Playbook Times de Elite",formato:"PDF",preco:"R$ 19,90 (linktree)",condicoes:"O checkout pede nicho, cargo, número de vendedores e faixa de faturamento"},{produto:"MMV, ingressos Select e Elite",formato:"Imersão de 2 dias, 9h às 19h, Alphaville",preco:"Não coletado",condicoes:"30 e 31/10; diferença declarada: o “nível de acesso direto”"},{produto:"Diagnóstico Comercial",formato:"Reunião com estrategista; formulário de 10 páginas",preco:"Gratuito (implícito)",condicoes:"“empresas com time de vendas”"},{produto:"Implementação comercial",formato:"Serviço, formato não descrito",preco:"Não coletado",condicoes:"Fechada em duas reuniões, paga por Pix"},{produto:"Treino de time",formato:"Tutoria de vendas in company",preco:"Não coletado",condicoes:"“Se vc não treina sei time eu posso treinar!”"},{produto:"Palestra",formato:"Por formulário",preco:"“proposta personalizada”",condicoes:"O formulário qualifica orçamento e decisor"}],promessas:[{t:"Ajudo empresários a estruturar o comercial e vender com previsibilidade.",ref:"bio"},{t:"o método para o seu comercial vender sem depender de você",ref:"post"},{t:"além de sair com toda a sua estruturação comercial feita, vc vai aprender a ter o seu gerente comercial pronto na sua operação",ref:"legenda de post"}],ideia:"Copiar o sistema comercial do ecossistema Marçal, com origem “da trincheira”: “Nasceu de 20 anos de gestão comercial e empresarial, antes de eu subir em qualquer palco”.",problema:[{t:"O problema não é o mercado. É a ausência de um sistema de vendas de alta performance na sua empresa.",ref:"página do MMV"},{t:"Seu time travou? O problema quase nunca é o vendedor. É a rotina.",ref:"post"},{t:"Seu lead não é o problema.",ref:"post"},{t:"Lead novo num processo quebrado é só mais dinheiro jogado fora.",ref:"post"}],solucao:"Meta por vendedor com 20% a mais, daily duas vezes por dia, controle da atividade (“Você não controla o faturamento do vendedor. Controla o que o gera.”), recrutamento, remuneração e treino. Agora, SDR, gerente e painel com IA.",inimigos:"O improviso (“você não tem processo. Você tem improviso”), o “Vendedor bonzinho”, o desconto, o treinamento pontual e a dependência do dono.",funil:["Palavra-chave no comentário, com DM pela equipe: “MMV” (8 posts) leva ao evento; “COMERCIAL” (8 posts), ao diagnóstico.","Isca paga que qualifica: o Playbook de R$ 19,90 coleta faturamento, número de vendedores e cargo (forte).","SDR por IA “sozinha, autônoma” junto com SDRs humanos; a call é vendida como “consultoria” para reduzir falta.","Fechar na call: “99% das nossas reuniões a gente nem faz follow-up”; piso de 30% de conversão para closers."],prova:{forca:"Moderada em volume, fraca em consistência. A âncora é Marçal; só há um caso com nome e número.",itens:[{p:"Direção comercial de Marçal em 2025; mentor em “RCI e SPR7”",s:"Autodeclarado, só em canais do próprio Diego"},{p:"“+ de 2.000 empresas ativadas”, “+ de 500 milhões em vendas”",s:"Autodeclarado, sem critério de contagem"},{p:"Caso André e Leo, precatórios: “Antes: 18 cessões em 1 ano. Depois: 28 cessões em 1 semestre.”",s:"Depoimento em vídeo com rosto; o caso mais forte"}],contradicoes:["1.500 empresários, 2.000 empresas e 2.500 empresas, conforme a página.","36 anos na Via Terra Jeans contra “mais de 25 anos de trajetória” e “20 anos de gestão”."]},publico:{conclusao:"Quem comenta não é o ICP: repete a palavra-chave, torce na política ou trabalha com vendas. Quase nenhum dono fala de dor.",cits:[{t:"9, 10, 15 meses pra formar um closer? Não moço, deixa que eu contrato e treino pra vocês então… Ferramenta só vai funcionar pra closer bom, ia não vai nunca se comparar com o feeling de um vendedor bem treinado…",a:"@eusougustavoandrade"},{t:"Fazemos exatamente dessa forma, Diegão. Consultoria gerando bastante valor pra galera na reunião independente se vão fechar com a gente ou não 🫡",a:"@eusounikolasribeiro"},{t:"Qual a escala dela? 😂🚀",a:"@lisiebranco"}]},territorios:{a:{s:"livre",e:"Sem nenhuma menção. As metas são por período corrido: “próximos 10 dias”, “meta do mês”."},b:{s:"tangencia",e:"Meta por vendedor, controle de atividade, piso de 30% e painel de SDR e closer. Não lê o funil de trás para frente."},c:{s:"tangencia",r:"Tangencia (ocupa no discurso)",e:"“Dois dias dedicados a implementar”; o visível é evento e PDF."},d:{s:"ocupa",e:"SDR por IA “Marina”, gerente comercial que “já é uma IA”, painel e CRM, prometidos para funcionar depois do evento."},e:{s:"tangencia",e:"O “gerente comercial pronto” é uma IA. Ele defende que “o dia a dia tem que ser feito interno”."},f:{s:"ocupa",e:"Playbook com recrutamento, remuneração e treinamento; engrenagem Performance; treino diário."},g:{s:"ocupa",e:"“empresas com time de vendas”; “Seu lead não é o problema”."},h:{s:"ocupa",e:"Formulário de 10 páginas, SDR humana e por IA, closer, fechamento na call."},i:{s:"tangencia",e:"Só a garantia de satisfação do evento; a implementação não tem garantia nem métrica publicada."}},forcas:["Bastidor operacional crível: a IA marcando reunião, o painel e o Pix, na língua de SDR, closer e no-show.","Escada completa, com entrada barata que já qualifica.","Palco e rede do ecossistema Marçal; volume de produção muito alto."],fraquezas:["Alcance: 0,8% de plays sobre seguidores e 129 comentários em 30 posts (forte).","Números que mudam de página para página.","Sobrepromessa: gerente por IA “funcionando” depois de 2 dias de palco (moderada).","Dependência de Marçal: o único post comercial que engaja tem o nome dele.","Venda pressionada: “você volta na dor dele e bate”, o que o Rafa rejeita."],brechas:["Meses dentro da operação, não 2 dias de palco, com critério de pronto escrito.","Safra e maturação estão livres: ele trabalha “10 dias” e “meta do mês”.","Leitura por etapa, de trás para frente, com estados do lead.","IA como meio: se vem de brinde no ingresso, não sustenta R$ 45 a 60 mil; precisa aparecer operando o número da safra.",{t:"Persistência com data marcada, sem pressão (o “vendedor chato”), contra a cultura publicada dele."},"Prova consistente: um número por caso, com fonte e data.",{t:"Alerta de rede: o Júnior vende o Master Marketing Club com Marçal, e Diego é o braço comercial do mesmo ecossistema. Concorrência ou parceria.",g:"nao-avaliavel"}],copiar:["Isca de ticket simbólico com formulário que mede o ICP (faturamento, vendedores, cargo).","Vídeo curto de bastidor operando (painel, agente agendando), com número consistente e autorização do cliente.","A call vendida como consultoria e as regras de reunião que ele publica: decisores presentes, decisão na call, diagnóstico que gera valor."],evitar:["Prometer IA ou gerente “funcionando” em prazo de evento. Prometer o que se entrega em 90 dias.","Números de escala que mudam entre páginas e política na marca do Júnior.","Como manchete: “previsibilidade”, “máquina de vendas”, “vender sem depender de você”, “Seu lead não é o problema”, “gerente comercial IA”."],gastos:["vender com previsibilidade","estruturar o comercial","máquina de vendas","vender sem depender de você","Times de Elite","alta performance","diagnóstico comercial","implementação comercial","SDR e gerente comercial com IA","painel","80/20","Seu lead não é o problema"],lacunas:["Preços do Select e do Elite e a diferença real entre eles; páginas 2 a 10 do formulário.","Escopo, preço, prazo e equipe da “implementação comercial”.","Se Marçal participa desta edição; o vínculo entre a Terras Raras e o grupo Marçal.","A relação atual entre Diego e o Júnior."],campo:{seg:"105 mil",oferta:"Imersão MMV de 2 dias, assinada com Pablo Marçal (30 e 31/10), e “implementação comercial” vendida no diagnóstico",preco:"Não publicado; playbook a R$ 19,90",executa:"Evento; implementação sem escopo público",comenta:"Palavra-chave, política, vendedores"},pos:{x:7,y:2.2}},{id:"antonio",nome:"Antônio da Silva (Grupo Silva)",curto:"Antônio da Silva",camada:"Adjacente",ameaca:"Média",quem:"Fundador do Grupo Silva (“Fundador da MAIOR holding de vendas brasileira”), com sede em Sorocaba e Votorantim (SP). Vende ao dono a estruturação comercial e de conteúdo e, ao candidato a emprego, uma formação de vendedor.",contas:[{handle:"@umantoniodasilva",seguidores:"1.093.044",posts:"26,9 por semana",engaj:"0,10%",plays:"15.972 (1,5% da base)"}],resumo:["Dois públicos na mesma marca: ao dono, o Grupo Silva, sem preço público (autodeclara “pacotes meus acima de R$50 mil”); ao candidato a emprego, a Formação de Vendedor Home Office de R$ 297.","O “head comercial as a service” a R$ 5.500 por mês em 12 meses não aparece em público. Vale como oferta privada feita ao Otavio, não como âncora de mercado (correção da pesquisa de concorrência).","A prova é volumosa (cerca de 80 prints de WhatsApp com @ de clientes), mas de experts e profissionais liberais fazendo as primeiras vendas, não de empresas com time e leads.","O feed é de massa (riqueza, família, fé, política). A demanda B2B vem do formulário da bio e de tráfego pago: “mais de 2 milhões de reais no mês” (transcrição).","Já fala a tese do Júnior (“processo comercial acima do talento do vendedor”) e a identidade do Rafa (cristão, interior, família)."],ofertaTopo:{nome:"Grupo Silva, “Operação (ORGÂNICO+COMERCIAL)”",texto:"Grupos “Operação [cliente]” com CS, gerente, key account, treinadora e roteirista; ritos de SDR e closer às segundas e “Fechamento semanal comercial” às sextas; análise de call e ajuste de prospecção e de proposta.",preco:"Não publicado. Indício autodeclarado: “pacotes meus acima de R$50 mil” (destaque).",executa:"Time de CS e treinadores. Quem vende é o cliente: “SAIU A PRIMEIRA VENDA!!!”.",garantia:"Nenhuma ao dono. Ele é contra garantia em contrato."},escada:[{ , reunião com closer e contrato: “46 agendas pra hoje”; “12, 13 executivos na pauleira para fechar contrato”.","Trocou metade de 35 SDRs por “SDR de IA”.","Único filtro público: “dono de CNPJ”."],prova:{forca:"Alta em volume e em bastidor, baixa em auditabilidade.",itens:[{p:"Cerca de 80 prints de WhatsApp de clientes com @, valor e Pix",s:"Semiverificável"},{p:"“Fatura R$10 milhões por mês no grupo.” “Tem mais de 200 colaboradores no grupo.”",s:"Autodeclarado"},{p:"“fazia R$100 mil por mês quando entrou Esse mês bateu R$650 mil”",s:"Autodeclarado; o único com origem e chegada"},{p:"Sede física e imersão presencial",s:"Indício de operação real"}],contradicoes:["Time de 80, 200 ou 1.000 pessoas, conforme a fonte.","Ticket médio implícito de R$ 3.700 a R$ 6.250 contra “pacotes acima de R$50 mil”.","Prova de experts iniciantes contra “3 clientes meus faliram esse mês. Um com faturamento de R$60 milhões por mês”."]},publico:{conclusao:"Massa B2C aspiracional e política (forte). Donos que se declaram são menos de 2%, e a dor deles é contratar e supervisionar.",cits:[{t:"queremos o “como” de maneira estruturada, com método para profissionalizar, através de processos, analises, kpis, rotinas treinamentos, gestao",a:"Lucimar, cliente",ref:"destaque do perfil"},{t:"O raso já não nos atende mais hoje.",a:"Lucimar, cliente",ref:"destaque do perfil"},{t:"Tento contratar tem 85 dias. Já levei até bronca",a:"@kharolynna"},{t:"Cara 2 semanas atrás vc estava rodando anúncio contratando SDR pra trabalhar home office",a:"@eu.sou.caio"}]},territorios:{a:{s:"livre",e:"Nenhuma menção a coorte, safra ou janela de maturação."},b:{s:"tangencia",e:"“métricas”, “kpis, rotinas”, “Fechamento semanal comercial”; sem método público de leitura do funil."},c:{s:"tangencia",r:"Ocupa no discurso; tangencia na entrega",e:"“deixe eu vender para você”, mas a entrega visível é feita com o cliente e pesada em treino; quem vende é o cliente."},d:{s:"tangencia",e:"Usa SDR de IA e IA no tráfego em casa; não há evidência de que venda IA ou CRM ao cliente."},e:{s:"ocupa",r:"Ocupa (moderada)",e:"Gerente de CS, key account, rito semanal de SDR e closer, análise de call. Não usa o nome “head as a service”."},f:{s:"ocupa",r:"Ocupa (forte)",e:"“Eu monto time de vendas para empresas. Recruto, treino e acompanho vendedor todos os dias.”"},g:{s:"tangencia",e:"Fala com o “dono de CNPJ”, mas a prova é de experts e profissionais liberais começando no digital."},h:{s:"ocupa",e:"Formulário, SDR e closers internos."},i:{s:"livre",r:"Livre no B2B",e:"“Se você libera e botar uma garantia em contrato, toda reunião que ele fizer, ele vai botar a garantia em contrato.”"}},forcas:["Alcance massivo e cadência industrial (26,9 posts por semana).","Volume de prova com nome e @ de clientes.","Operação física com time grande e ritos semanais.","História de origem forte e identidade (cristão, família, interior) que conversa com o Rafa.","Funil de recrutamento próprio que abastece os closers dele e os dos clientes."],fraquezas:["ICP difuso: curso de R$ 297 para quem busca emprego e pacotes de R$ 50 mil ao dono, na mesma marca.","Prova de primeiras vendas pequenas, não de conversão de time existente.","Números inconsistentes e sinais de reputação.","Instabilidade de modelo (“Impactou de imediato meu fluxo de caixa”), urgência de contador (risco no CONAR) e política."],brechas:["Safra e leitura de trás para frente: ele fala de “processo” de forma genérica.","Saída limpa por escrito: ao sair, o cliente leva os dados e o Playbook da Gestão de Vendas por Safra.","Empresa que já vende, com time e leads: a prova dele é de quem está começando.","Senioridade contra operação de massa (“1.600 contratos por mês”): o Júnior na call e na gestão.","Conteúdo técnico para o dono: ele declara não fazer (“Eu não posto nenhum conteúdo técnico”).","IA dentro da operação do cliente: ele usa em casa, mas não vende a implementação."],copiar:["O formato de prova: o print do grupo “Operação [cliente]” com @, valor e data, por tipo de resultado, trocando “primeira venda” por antes e depois por etapa.","O rito visível (acompanhamento de segunda, fechamento de sexta): na Triad, a reunião semanal de safra.","A chamada “deixe eu vender para você” prova que o mercado compra execução: prometer gestão, não aula."],evitar:["A tese “processo acima do vendedor” como diferencial: já é dele. O Júnior desce um nível, ao mecanismo e ao número.","Urgência de contador, número de holding sem lastro e mistura de público.","Disputar identidade (fé, família, política) com quem tem 1 milhão de seguidores nesse registro."],gastos:["holding de vendas","ecossistema","coloque sua empresa no Grupo","deixe eu vender para você","time de elite","cultura de vendas","processo comercial","time previsível","SDR de IA","estruturação comercial","toca o sino"],lacunas:["Perguntas e filtros do formulário da bio.","Preço, duração, contrato e garantia do Grupo Silva para o dono.","O que é o “novo modelo” que ele anunciou.","6 dos 11 destaques, Biblioteca de Anúncios e Reclame Aqui."],campo:{seg:"1,09 milhão",oferta:"Estruturação comercial e de conteúdo com time de CS; formação de vendedor home office",preco:"Formação a R$ 297. Ao dono, não publicado (“pacotes meus acima de R$50 mil”, autodeclarado)",executa:"CS e treinadores; quem vende é o cliente",comenta:"Massa B2C, política"},pos:{x:4.2,y:4.2}},{id:"fabio",nome:"Fábio Oliveira (Vendedorismo)",curto:"Fábio Oliveira",camada:"Adjacente",ameaca:"Baixa",quem:"“Criador do Vendedorismo e CEO da Ventrium”, cofundador e ex-CEO do Salesclube. Autoridade de palco e de instituição (Sebrae, FENINJER, UFES, NBS e Faesa), não de funil digital. Veio do telemarketing.",contas:[{handle:"@fabiooliveira.sf",seguidores:"60.028",posts:"0,8 por semana",engaj:"0,09%",plays:"1.989 (3,3% da base)",nota:"Quase 4 semanas sem postar até a coleta."}],resumo:["Vende B2B e por parceiros: consultoria Ventrium para franqueadoras e lojistas, treinamento in company “neurocomportamental”, imersões, MBA e conselho empresarial (The Board). Nenhum preço público.","“Vendedorismo” é marca guarda-chuva com a tese “Venda com alma. Cresça sem moer gente.” Aposentou “máquina de vendas” e fala em “Arquitetura de Receita”.","Instagram fraco e disperso: 5 dos 6 posts mais recentes são de um projeto musical; os virais (de 152 mil a 260 mil plays) são de fevereiro de 2025.","Não há registro de cargo de diretor comercial (correção feita na verificação da pesquisa).","Mesmo com ameaça baixa no digital, já ocupa a narrativa do “dono que é o melhor vendedor” e a leitura do funil “de trás pra frente”."],ofertaTopo:{nome:"Consultoria Ventrium (inferência moderada)",texto:"“execução comercial aplicada em alta performance”. O único case é o de uma franqueada da Cacau Show: “Organizamos CRM, relacionamento, operação, treinamento do time”. No palco, descreve a “Fase 03” (Delegação) e a “Fase 04” (Aceleração).",preco:"Não divulgado.",executa:"Consultoria, com 1 case.",garantia:"Nenhuma."},escada:[{produto:"E-book Time Comercial",formato:"Checkout Greenn",preco:"“1x de R$ 0,00” (não avaliável)",condicoes:"Sem nome do produto no checkout"},{produto:"Consultoria Ventrium",formato:"Consultoria e execução comercial aplicada",preco:"Não divulgado",condicoes:"Franqueador ou lojista; “Chama no direct”"},{produto:"Programas neurocomportamentais",formato:"In company de um dia",preco:"Não divulgado",condicoes:"Palavra-chave VNC"},{produto:"VENDEDORISMO na prática",formato:"Projeto imersivo com NBS e Faesa",preco:"Não divulgado",condicoes:"“menos de 40 vagas”"},{produto:"MBA Gestão na Prática",formato:"Presencial; ele ministra a imersão de vendas",preco:"Não divulgado",condicoes:"“mais de 20 horas de imersão”"},{produto:"The Board (NBS)",formato:"Conselho empresarial em Vitória (ES)",preco:"Não divulgado",condicoes:"Edição até dezembro"}],promessas:[{t:"Venda com alma. Cresça sem moer gente.",ref:"post"},{t:"Máquina vende. Arquitetura sustenta. Hoje eu não falo mais em máquina de vendas. Falo em Arquitetura de Receita",ref:"post"},{t:"Pressão entrega Dia das Mães. Método entrega década.",ref:"post"}],problema:[{t:"Se o dono é o melhor vendedor, a empresa não tem operação comercial. Tem um talento com CNPJ em volta.",ref:"post"},{t:"O negócio cresce até o tamanho do dono. E para.",ref:"post"},{t:"venda é de trás pra frente, sempre",ref:"vídeo com 260.049 plays"}],solucao:"Método, indicador e ritual em vez de pressão. Mede a taxa de fechamento sobre propostas, não a conversão sobre leads (que “serve pra porra nenhuma”), e cuida do estado do vendedor: “Venda é transferência de entusiasmo”.",inimigos:"A pressão que “mói gente”, o dono-herói, a máquina de vendas pura e o coach sem método.",funil:["Fragmentado: formulário Yay Forms, e-book, WhatsApp, palavras-chave diferentes por oferta (VNC, VENDEDORISMO) e “Chama no direct”.","Aquisição real (forte): palco, eventos e parceiros; 17 de 30 posts têm coautor.","Nenhum filtro de faturamento ou de time; o site não renderiza conteúdo."],prova:{forca:"Moderada em autoridade, fraca em resultado: um único case com número.",itens:[{p:"“Três exits. Um turnaround.”; “20 anos, três empresas construídas e vendidas”",s:"Autodeclarado"},{p:"Palcos: Sebrae Nacional, FENINJER, UFES, Gramado Summit",s:"Verificável"},{p:"Case da franqueada Cacau Show (“maior vendedora de loja única do Brasil”)",s:"A fala é verificável; o prêmio é autodeclarado pela cliente"}],contradicoes:["1.100 operações comerciais estruturadas (bio) contra mais de 500 (legenda da FENINJER)."]},publico:{conclusao:"Não é o ICP (forte): rede de relacionamento, participantes de eventos e vendedores ou lojistas pequenos. Só a mãe responde por 20% dos comentários amostrados.",cits:[{t:"Valeu @fabiooliveira.sf … em poucos minutos nos mostrou quanto dinheiro estamos deixando na mesa 👊🏻",a:"@gledsonrigon"},{t:"esse ponto de sustentar sem moer gente é o que mais falta discutir. previsibilidade de verdade vem de processo bem estruturado, não de esforço individual",a:"@gerenc.ia_"},{t:"geralmente vem uma pressa, uma pressão descomunal para que você dê a resposta, para que assine o contrato, para que fale alguma coisa..",a:"@cinthiamararizzolv"}]},territorios:{a:{s:"livre",e:"Nenhuma menção."},b:{s:"tangencia",r:"Tangencia (forte no discurso)",e:"Taxa de fechamento por etapa e “venda é de trás pra frente, sempre” (260 mil plays). É discurso de palco, não produto."},c:{s:"tangencia",e:"“Organizamos CRM, relacionamento, operação, treinamento do time”: um único case."},d:{s:"tangencia",e:"CRM no case; IA para “aculturamento” no Sebrae; sem SDR por IA nem agentes."},e:{s:"tangencia",e:"The Board, com encontros periódicos; nenhum head ou gerente as a service."},f:{s:"ocupa",r:"Ocupa a formação",e:"Treinamentos in company, MBA e imersão; recrutamento só tangencia."},g:{s:"tangencia",e:"Fala ao dono (joalheiros, franqueadoras), mas também a Sebrae, estudantes e MBA."},h:{s:"tangencia",r:"Tangencia (não avaliável)",e:"Formulário na bio, não coletado; nenhuma call, preço ou filtro visível."},i:{s:"livre",e:"Nenhuma menção."}},forcas:["Trajetória com nomes de mercado (Salesclube, Salesfarm) e acesso institucional.","Frases de palco memoráveis.","Tom ético e cristão que conversa com o Rafa (“Deus me colocou nesse caminho”).","Já provou que aula técnica curta viraliza (260 mil plays)."],fraquezas:["Funil digital quase inexistente: checkout com “1x de R$ 0,00”, site sem conteúdo, CTAs dispersos.","Instagram parado e desfocado (música, família, palco).","Números inconsistentes e um único case.","Dependência de palco e parceiros; oferta pulverizada entre ensino e consultoria."],brechas:["Execução contínua dentro da operação: o máximo dele é “suporte estratégico” e conselho periódico.","Gestão por safra: ele mede a etapa, não a coorte nem o tempo: “não basta medir a etapa, tem que medir a safra”.","Funil para o dono via Instagram, que ele não trabalha.","Prova de resultado com número no lugar da autoridade."],copiar:["O diagnóstico do dono-herói (“um talento com CNPJ em volta”) como abertura de VSL, sem repetir as frases dele, que já estão em uso.","O formato do vídeo de 260 mil plays: uma conta simples na tela, uma frase de ruptura e a correção da métrica. Serve para o Júnior apresentar a safra.","O aforismo binário como dispositivo de copy (“Pressão entrega X. Método entrega Y.”), com conteúdo próprio."],evitar:["“máquina de vendas”, que até o proponente aposentou, e “crescer sem moer gente” ou “venda com alma”, que são dele.","CTAs dispersos e perfil misturado (música, família, palco) num perfil que vende high ticket.","Número inconsistente entre peças."],gastos:["máquina de vendas","previsibilidade","crescer sem moer gente","venda com alma","Arquitetura de Receita","operação comercial estruturada","o dono é o melhor vendedor","venda é de trás pra frente","taxa de conversão não serve"],lacunas:["Preço e escopo de qualquer produto.","Perguntas do formulário Yay Forms (coleta bloqueada).","A origem do alcance de fevereiro de 2025 e o motivo da queda.","Datas de eventos comerciais entre outubro e dezembro."],campo:{seg:"60 mil",oferta:"Consultoria Ventrium para franqueadoras e varejo; palco e MBA",preco:"Não publicado",executa:"Consultoria, com 1 case",comenta:"Rede pessoal, eventos"},pos:{x:5.4,y:3}},{id:"concer",nome:"Thiago Concer",curto:"Thiago Concer",camada:"Vocabulário",ameaca:"Baixa",quem:"Treinador e palestrante de vendas de massa, embaixador da RD Station, da EQI e da Viver de IA. Monetiza o vendedor pela ANEV e a empresa pela palestra; o dono com time ele encaminha a parceiros.",contas:[{handle:"@thiagoconceroficial",seguidores:"1.005.042",posts:"31,5 por semana",engaj:"0,06%",plays:"11.297 (1,1% da base)"}],resumo:["Nos 27 posts de 14 a 20/10, nenhum CTA leva a produto próprio. Os únicos comerciais apontam para parceiros: “Comente CURSO RD” e o LiveCoach da Viver de IA.","Fala com dono e gestor em cerca de 12 de 30 posts, mas quem comenta é vendedor, corretor e trabalhador no debate da 6x1.","Prova de palco forte (Sicredi, Sebrae, Bayer, BASF, Ford citados; 1.200 corretores na Lojacorr) e endosso da RD e da TOTVS. Os números de alcance divergem: 300 mil, 500 mil e 1M+ treinados.","Faz a pergunta do dono (“Você sabe responder por que sua equipe não está vendendo mais?”) e não vende a resposta.","Livres para a Triad: safra, implementação dentro da operação e o “gerente do gerente”."],ofertaTopo:{nome:"ANEV (volume) e palestra (maior ticket provável)",texto:"ANEV, A Nova Escola de Vendas: quatro formações gravadas, comunidade, especializações por setor, scripts e suporte por WhatsApp; o aluno executa sozinho. Palestra: formulário, conversa de alinhamento e proposta, com “Agenda limitada a 100 eventos por ano”.",preco:"ANEV: “12x de R$ 149,90 ou R$ 1.499 à vista”. Palestra sob proposta.",executa:"O aluno.",garantia:"ANEV: “7 dias de garantia”, o mínimo do CDC."},escada:[{produto:"Aulas gratuitas por palavra-chave",formato:"LIGAÇÃO, “aula”, menu de 1 a 6",preco:"Gratuito",condicoes:"Link pela DM"},{produto:"Curso Rotina de Alta Performance",formato:"RD University, 11 aulas",preco:"Gratuito (“meu treinamento gratuito”)",condicoes:"Isca da parceria com a RD"},{produto:"Livros (Alta Books)",formato:"Vendas Não Ocorrem Por Acaso; Vendedor Bonzinho Não Fica Rico",preco:"Não consta",condicoes:""},{produto:"ANEV",formato:"Formação gravada, comunidade, scripts, suporte",preco:"R$ 1.499 à vista ou 12x de R$ 149,90",condicoes:"7 dias de garantia; 12 meses de acesso"},{produto:"Palestra e in company",formato:"Presencial ou online, até 1h15 de palco",preco:"Sob proposta",condicoes:"Briefing 1:1 com ele"},{produto:"Consultoria comercial B2B",formato:"Sem página nem escopo",preco:"Não consta",condicoes:"“50+ operações comerciais por ano” (autodeclarado)"}],promessas:[{t:"A melhor formação de vendedores profissionais do Brasil",ref:"ANEV"},{t:"Resultado para a sua equipe. Não mais um discurso motivacional.",ref:"página de palestras"},{t:"Venda não acontece por acaso. Foi gente que aprendeu método e aguentou ouvir não até virar sim.",ref:"post"}],problema:[{t:"Vendedor sem rotina depende de memória, urgência e improviso.",ref:"post"},{t:"muita oportunidade não esfriou. Ela ficou sem acompanhamento.",ref:"post"},{t:"Liderar não é ficar cobrando resultado no fim do mês sem entender o que aconteceu durante o caminho.",ref:"post"},{t:"A operação comercial inteira dependia da memória de pessoas e da boa vontade do dono.",ref:"post"}],solucao:"Playbook, atividade mínima diária “com número”, indicador de “Atendimento, proposta, follow-up e conversão do dia”, role-play de 15 minutos e “colocar IA na operação. Agora.”",inimigos:"A motivação, o líder do “áudio de 5 minutos com Bora, time!”, o “review de pipe baseado em achismo”, o desconto e o “Sempre funcionou assim.”",funil:["Palavra-chave com DM: LIGAÇÃO (1.175 comentários), “aula” (1.307), menu de 1 a 6 (780); “TÁ NO LINK DA BIO” para o LiveCoach.","A ANEV vai direto ao checkout, sem aplicação; nenhum dos 30 posts a cita como CTA.","Os filtros do ICP da Triad estão nos parceiros: a RD pede cargo, tamanho do time e funcionários; a Viver de IA, faturamento e time."],prova:{forca:"Alta em autoridade de palco e de parceiros; baixa em resultado comercial: nenhum caso com conversão antes e depois (forte).",itens:[{p:"1 milhão de seguidores, perfil verificado; dois livros pela Alta Books",s:"Verificável"},{p:"Palestra para “1.200 corretores” na Lojacorr",s:"Evento verificável; número autodeclarado"},{p:"“+600 empresas”, “NPS médio acima de 90”",s:"Autodeclarado"}],contradicoes:["Treinados: 300 mil (bio), mais de 500 mil (ANEV) e 1M+ (página de links).","Favikon: “nº1 do Brasil” contra “No Top 10”."]},publico:{conclusao:"Não é o ICP (forte): o dono com time e leads aparece em menos de 5% dos comentários.",cits:[{t:"Os “superiores” tem ego aflorado e chama atenção de vendedor muitas vezes na frente do time e ainda em grupos de WhatsApp. Constrangedor!!!!",a:"@branco360"},{t:"‘sempre funcionou assim’ é a frase que mais ouvi em empresa que depois descobriu que o processo inteiro morava na cabeça de uma pessoa só.",a:"@reginaldonegocia"},{t:"Q Papinho hein,vendedor cursos !",a:"@paulocarotiniofficial"}]},territorios:{a:{s:"livre",e:"Pensa em mês e dia: “Se você só descobre no dia 25 que não vai bater a meta, já era”."},b:{s:"tangencia",e:"Gargalos e indicador por etapa, sem método nem oferta."},c:{s:"tangencia",e:"Vende ensino; a execução é só alegada (“Ele opera o que ensina”)."},d:{s:"ocupa",r:"Ocupa, via parceiros",e:"RD Station CRM; LiveCoach com copiloto, nota de 0 a 100 e painel."},e:{s:"tangencia",e:"Só “times que estamos acompanhando”."},f:{s:"ocupa",e:"ANEV, OSV e livros; vagas de emprego na comunidade."},g:{s:"tangencia",e:"Fala com o dono, mas vende ao vendedor e ao contratante de evento."},h:{s:"tangencia",e:"Palestra por proposta; o “Agende uma apresentação” é da Viver de IA."},i:{s:"livre",e:"Só os 7 dias de garantia, o mínimo do CDC."}},forcas:["Volume de 4 posts por dia sobre 1 milhão de seguidores.","Palco com prova social e endosso da RD e da TOTVS.","Conteúdo de gestão concreto: “Seu vendedor vai ter que vender 18% a mais todo santo dia”.","Monetiza o dono sem entregar implementação."],fraquezas:["Promete execução sem caso com número (forte); números inconsistentes (forte).","Desgaste com vendedores na pauta da 6x1 e a acusação de “vendedor cursos” (moderada).","Ensina urgência fabricada, o vendedor insistente que o Rafa rejeita (moderada).","Usa vídeo alheio sem crédito."],brechas:["A pergunta sem resposta: um post levanta os gargalos e fecha em “Já me segue”. A Triad vende a resposta.","“O lead esfriou” tratado como estrutura, não como disciplina: estados do lead e relógio da safra.","Ferramenta sem operador: copiloto e CRM já são mercadoria. O diferencial é quem opera e cobra.","O limite do palco: “Motivação dura três dias”. A Triad vende o mês 2 em diante, sem citá-lo.","Sênior do começo ao fim, contra o atendimento de massa."],copiar:["O post-conta para dono, virado em “a conta da sua safra”: leads, taxa por etapa e receita que vaza.","Isca por palavra-chave com filtro de dono (faturamento e time antes do envio). A isca de vendedor traz mil comentários do público errado.","A frase-regra seguida de “Faz assim:”, para criar o vocabulário da safra.","Os campos de qualificação dos parceiros (cargo, tamanho do time, faturamento) na aplicação."],evitar:["O tom moralizante sobre a folga do funcionário. Se usar a 6x1, só a conta.","“nº 1”, número inflado e qualquer cara de escola."],gastos:["método","venda não é sorte","processo comercial","playbook","rotina de alta performance","motor de vendas","máquinas de venda","previsível","IA na operação","feedback na hora","o lead esfriou","nº 1"],lacunas:["Preço da palestra; escopo e preço da consultoria e do Sales Clube.","Os termos com RD, Viver de IA e EQI.","A relação com Giovanne Saraiva, que ele chama de “um grande irmão, amigo meu”."],campo:{seg:"1,0 milhão",oferta:"ANEV para o vendedor; palestra; indica RD Station CRM e Viver de IA ao dono",preco:"ANEV: R$ 1.499 ou 12x R$ 149,90",executa:"O aluno",comenta:"Vendedores, debate da 6x1"},pos:{x:2,y:2}},{id:"carol",nome:"Carol Iasmim",curto:"Carol Iasmim",camada:"Vocabulário",ameaca:"Baixa",quem:"Maior base do recorte e alcance de massa. Vende um único produto de baixo ticket em janelas curtas de carrinho: o curso Neurovendas, empilhado com mentoria coletiva, IA própria, CRM em planilha e comunidade.",contas:[{handle:"@carol.iasmim",seguidores:"1.854.659",posts:"1,1 por semana na amostra",engaj:"0,22%",plays:"90.448 (4,9% da base)",nota:"Nenhum post coletado entre 14/08 e 14/10."}],resumo:["Reels de técnica e de orgulho do vendedor batem de 0,9 a 3,9 milhões de plays.","A Black das Vendas promete “Triplo de acesso com o menor valor da história”, sem preço literal no corpus e com data divergente: 05/11 na bio, 06/11 no site.","Público: vendedor individual e microempreendedor que vende por WhatsApp e Instagram, fortemente cristão. São 3 gestores explícitos em 421 comentários.","“Neurociência” é rótulo de marca sobre técnica clássica (SPIN adaptado, gatilhos, prova social), não mecanismo operacional (forte).","Não é concorrente direta, mas forma vocabulário e expectativa de preço. A brecha nítida está no “gestor que cobra sem treinar”."],ofertaTopo:{nome:"Black das Vendas (Neurovendas)",texto:"“Acesso Triplo a todos os Cursos, Eventos On-line e Atualizações”: curso gravado com mais de 180 aulas, mentoria coletiva mensal com ela, IA própria (IAS), CRM em planilha, comunidade e bônus.",preco:"Não aparece: “A condição será revelada ao vivo”.",executa:"O aluno.",garantia:"Não aparece no corpus."},escada:[{produto:"Conteúdo e YouTube",formato:"Reels, carrosséis, vídeo completo",preco:"Gratuito",condicoes:""},{produto:"Aulão de vendas",formato:"Live, quinta-feira às 20h",preco:"“100% gratuito e ao vivo (sem replay)”",condicoes:"Uma noite"},{produto:"Lista da Black",formato:"Palavra-chave QUERO e contagem regressiva",preco:"Gratuito",condicoes:"Até a revelação"},{produto:"Neurovendas",formato:"Curso gravado, mais de 180 aulas",preco:"Não aparece",condicoes:"“fica muito mais tempo fechado do que aberto”"},{produto:"Palestra",formato:"Palestra",preco:"“sessenta mil reais por hora” (só na transcrição)",condicoes:"Sem página"}],promessas:[{t:"Pra você dominar o que realmente faz o cliente dizer 'sim' em qualquer mercado",ref:"post"},{t:"Quando você tem técnica, vende o que quiser",ref:"post"},{t:"Seu papel nunca foi convencer. Foi conduzir.",ref:"post"}],problema:[{t:"Só sofre pra vender quem não estuda vendas e neurovendas",ref:"post"},{t:"Reunião de vendas sem treinamento é teatro corporativo.",ref:"vídeo com 218.199 plays"}],solucao:"Técnica, leitura do cliente e comunicação. O “neuro” é camada de marca e de autoridade (forte).",inimigos:"O “closer” e o processo “engessado, com umas frases decoradas horrorosas”, a reunião de segunda como “teatro corporativo”, a “pressão disfarçada de oportunidade”
